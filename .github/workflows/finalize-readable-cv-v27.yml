name: Finalize readable CV v27

on:
  push:
    branches:
      - fix/readable-cv-v27
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build v27 sources
        run: |
          python3 tools/rebuild_cv_v27.py
          python3 tools/tune_cv_v27.py
      - uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter
      - name: Install dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright pymupdf beautifulsoup4
          python3 -m playwright install --with-deps chromium
      - name: Validate HTML, export PDFs and collect evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json, sys
          import fitz
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          sys.path.insert(0, str(Path('.exporter').resolve()))
          import export_cv_html_to_pdf as helper

          html_files = sorted(Path('.').glob('*.html'))
          if len(html_files) != 17:
              raise RuntimeError(f'Expected 17 HTML files, found {len(html_files)}')
          all_ids = {}
          for path in html_files:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              ids = [node.get('id') for node in soup.find_all(attrs={'id': True})]
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'{path}: duplicate IDs')
              all_ids[path.name] = set(ids)
              for anchor in soup.select('a[target="_blank"]'):
                  if not {'noopener','noreferrer'} <= set(anchor.get('rel') or []):
                      raise RuntimeError(f'{path}: unsafe target=_blank')
          for path in html_files:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              for node in soup.select('[href], [src]'):
                  raw = node.get('href') or node.get('src')
                  if not raw or raw.startswith(('http://','https://','mailto:','tel:','data:','javascript:')):
                      continue
                  parsed = urlparse(raw)
                  target = (path.parent / (unquote(parsed.path) or path.name)).resolve()
                  if not target.exists():
                      raise RuntimeError(f'{path}: missing local target {raw}')
                  if parsed.fragment:
                      html_name = target.name if target.suffix == '.html' else path.name
                      if parsed.fragment not in all_ids.get(html_name,set()):
                          raise RuntimeError(f'{path}: missing fragment {raw}')

          mappings = {
              'ru-compiler.html': 'pdf/Mikhail_Razakov_Compiler_RU.pdf',
              'en-compiler.html': 'pdf/Mikhail_Razakov_Compiler_EN.pdf',
              'ru-cpp-systems.html': 'pdf/Mikhail_Razakov_CPP_Systems_RU.pdf',
              'en-cpp-systems.html': 'pdf/Mikhail_Razakov_CPP_Systems_EN.pdf',
          }
          evidence_dir = Path('v27-evidence')
          evidence_dir.mkdir(exist_ok=True)
          layout_report = {}
          with sync_playwright() as p:
              browser = helper.launch_browser(p, None)
              try:
                  for html, pdf in mappings.items():
                      page = browser.new_page(viewport={'width':1440,'height':900}, color_scheme='light', reduced_motion='reduce')
                      page.set_default_timeout(60000)
                      page.emulate_media(media='print', color_scheme='light', reduced_motion='reduce')
                      helper.load_local_document(page, Path(html).resolve())
                      helper.wait_for_page_assets(page, 60000, False)
                      helper.prepare_document(page, f'https://misha1302.github.io/CV/{html}')
                      page.wait_for_timeout(200)
                      layout = page.evaluate('''() => {
                        const cv=document.querySelector('.print-cv');
                        const cr=cv.getBoundingClientRect();
                        const all=Array.from(cv.querySelectorAll('*'));
                        const sizes=all.map(el=>parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);
                        let bottom=cr.top;
                        for(const el of all){bottom=Math.max(bottom,el.getBoundingClientRect().bottom);}
                        return {clientHeight:cv.clientHeight,scrollHeight:cv.scrollHeight,clientWidth:cv.clientWidth,scrollWidth:cv.scrollWidth,minCssFontPx:Math.min(...sizes),contentBottom:bottom,boxBottom:cr.bottom,usedRatio:(bottom-cr.top)/cr.height};
                      }''')
                      if layout['scrollHeight'] > layout['clientHeight'] + 2 or layout['scrollWidth'] > layout['clientWidth'] + 2:
                          raise RuntimeError(f'{html}: print overflow {layout}')
                      if layout['minCssFontPx'] < 10.0:
                          raise RuntimeError(f'{html}: CSS font below 7.5pt {layout}')
                      if not 0.68 <= layout['usedRatio'] <= 0.96:
                          raise RuntimeError(f'{html}: implausible vertical usage {layout}')
                      out=Path(pdf)
                      page.pdf(path=str(out),format='A4',print_background=True,display_header_footer=False,prefer_css_page_size=True,scale=1.0,margin={'top':'0','right':'0','bottom':'0','left':'0'},tagged=True,outline=True)
                      page.close()
                      layout_report[html]=layout
              finally:
                  browser.close()

          required = {
              'Mikhail_Razakov_Compiler_RU.pdf': ('1 358 / 1 358','NASM IA-32','x86-64','Опыт','Избранные проекты'),
              'Mikhail_Razakov_Compiler_EN.pdf': ('1,358 / 1,358','NASM IA-32','x86-64','Experience','Selected projects'),
              'Mikhail_Razakov_CPP_Systems_RU.pdf': ('12 C++23','NASM IA-32','x86-64','Опыт','Избранные проекты'),
              'Mikhail_Razakov_CPP_Systems_EN.pdf': ('12 C++23','NASM IA-32','x86-64','Experience','Selected projects'),
          }
          pdf_report={}
          all_pdfs=sorted(Path('pdf').glob('*.pdf'))
          if len(all_pdfs)!=14:
              raise RuntimeError(f'Expected 14 PDFs, found {len(all_pdfs)}')
          for path in all_pdfs:
              doc=fitz.open(path)
              if len(doc)!=1:
                  raise RuntimeError(f'{path}: {len(doc)} pages')
              page=doc[0]
              text=page.get_text('text')
              links=[x.get('uri') for x in page.get_links() if x.get('uri')]
              if len(text.strip())<900 or not links:
                  raise RuntimeError(f'{path}: incomplete text/links')
              if path.name in required:
                  if abs(page.rect.width-595.28)>3 or abs(page.rect.height-841.89)>3:
                      raise RuntimeError(f'{path}: not A4')
                  for marker in required[path.name]:
                      if marker not in text:
                          raise RuntimeError(f'{path}: missing {marker}')
                  for forbidden in ('NASM/FASM','System V AMD64 ABI','GDB/objdump'):
                      if forbidden in text:
                          raise RuntimeError(f'{path}: forbidden {forbidden}')
                  spans=[span for block in page.get_text('dict').get('blocks',[]) for line in block.get('lines',[]) for span in line.get('spans',[]) if span.get('text','').strip()]
                  min_font=min(float(s['size']) for s in spans)
                  if min_font<7.45:
                      raise RuntimeError(f'{path}: min font {min_font:.2f}pt')
                  exp='Опыт' if path.stem.endswith('_RU') else 'Experience'
                  proj='Избранные проекты' if path.stem.endswith('_RU') else 'Selected projects'
                  if not (0 <= text.find('Михаил Разаков') < text.find(exp) < text.find(proj)):
                      raise RuntimeError(f'{path}: bad extraction order')
                  uris=set(links)
                  for uri in ('https://github.com/Misha1302','https://github.com/Misha1302/x86-64-codegen-ra-playground'):
                      if uri not in uris:
                          raise RuntimeError(f'{path}: missing link {uri}')
                  pix=page.get_pixmap(matrix=fitz.Matrix(2.5,2.5),alpha=False)
                  pix.save(evidence_dir/f'{path.stem}.png')
                  pdf_report[path.name]={'pages':1,'min_font_pt':round(min_font,2),'text_chars':len(text.strip()),'links':len(links)}
              doc.close()
          (evidence_dir/'layout.json').write_text(json.dumps(layout_report,ensure_ascii=False,indent=2),encoding='utf-8')
          (evidence_dir/'pdf.json').write_text(json.dumps(pdf_report,ensure_ascii=False,indent=2),encoding='utf-8')
          qa=Path('QA-report-targeted-cv-v27.md')
          qa.write_text(qa.read_text(encoding='utf-8')+'\n## Automated result\n\n```json\n'+json.dumps({'layout':layout_report,'pdf':pdf_report},ensure_ascii=False,indent=2)+'\n```\n\nAutomated verdict: PASS. Human render review required before merge.\n',encoding='utf-8')
          print(json.dumps({'layout':layout_report,'pdf':pdf_report},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cv-v27-final-evidence
          path: v27-evidence/*
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified v27
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .exporter v27-evidence
          rm -f tools/rebuild_cv_v27.py tools/tune_cv_v27.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/debug-v27-export.yml
          rm -f .github/workflows/rebuild-readable-cv-v27.yml
          rm -f .github/workflows/finalize-readable-cv-v27.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild readable focused CVs and synchronize v27 release'
          git push origin HEAD:fix/readable-cv-v27
