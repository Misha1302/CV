name: Finish compiler CV editorial polish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-compiler-polish-v2.yml"

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finish canonical copy and print layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          data_path = Path('data/site.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = int(data.get('version', 0)) + 1
          data['updated_at'] = '2026-08-30'
          ru = data['profiles']['compiler']['ru']
          en = data['profiles']['compiler']['en']

          ru['experience'][1]['bullets'] = [
              'Реализовал LLVM LICM-pass: анализ циклов, проверки побочных эффектов и безопасности спекулятивного выполнения, вынос инвариантных инструкций в preheader.',
              'Разрабатывал межпроцедурный анализ глобальных переменных и проверки допустимости (legality) для безопасных преобразований LLVM IR.'
          ]

          ru['project_summaries']['globaliv'].update({
              'type': 'C++23 · LLVM 22 · межпроцедурный анализ · оптимизация',
              'solution': 'Проход LLVM 22 для межпроцедурного анализа линейной эволюции глобальных переменных и безопасного преобразования IR. Использует APInt, анализ циклов и доминаторов, транзитивные эффекты вызовов и условия обязательного исполнения (must-execute).',
          })
          ru['project_summaries']['deref'] = {
              'type': 'C# · Roslyn · статический анализ · анализ потоков данных',
              'solution': 'Анализ на Roslyn ControlFlowGraph с прямым fixed-point data-flow: состояния Unknown/MaybeNull/NotNull распространяются между базовыми блоками и объединяются в точках слияния.',
              'result': 'Повторно обрабатывает последующие блоки до стабилизации состояния и диагностирует потенциально небезопасное разыменование.'
          }
          ru['project_summaries']['wist'].update({
              'type': '.NET · модульная инфраструктура компилятора',
              'solution': 'Модульный .NET framework для построения языковых и компиляторных цепочек: разбор → промежуточные представления → оптимизационные проходы → backend. Компоненты подключаются через явные контракты, а порядок и совместимость определяются до исполнения.',
          })
          ru['project_summaries']['codegen'] = {
              'type': 'Rust · SSA/CFG · распределение регистров · SysV x86-64',
              'solution': 'SSA-подобное IR, проверки CFG/SSA, анализ живости и интерференции, распределение регистров с независимой проверкой назначения, phi lowering и генерация SysV x86-64.',
              'result': 'Эталонный интерпретатор и дифференциальное выполнение проверяют семантическую эквивалентность сгенерированного кода; распределитель регистров валидируется отдельно.'
          }
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          build_path = Path('tools/build_site.py')
          source = build_path.read_text(encoding='utf-8')
          old = '    return f\'<article class="project-row"><div><span class="project-type">{esc(project[f"type_{lang}"])}</span><h3>{esc(project["title"])}</h3></div><div><p>{esc(copy[\'solution\'])}</p><p class="project-result">{esc(copy[\'result\'])}</p><div class="project-links">{"".join(links)}</div></div></article>\'\n'
          new = '    type_label = copy.get("type", project[f"type_{lang}"])\n    return f\'<article class="project-row"><div><span class="project-type">{esc(type_label)}</span><h3>{esc(project["title"])}</h3></div><div><p>{esc(copy[\'solution\'])}</p><p class="project-result">{esc(copy[\'result\'])}</p><div class="project-links">{"".join(links)}</div></div></article>\'\n'
          if source.count(old) != 1:
              raise RuntimeError('compiler project type anchor changed')
          source = source.replace(old, new, 1)

          old_print = '''              project_text = summary.get("result") or project[f"result_{lang}"]
              projects.append(f'<article class="pcv-project"><h3><a href="{esc(target)}">{esc(project["title"])}</a></h3><p>{esc(project_text)}</p></article>')'''
          new_print = '''              if is_compiler_print and summary:
                  project_body = f'<p>{esc(summary.get("solution", ""))}</p><p class="pcv-project-result">{esc(summary.get("result", ""))}</p>'
              else:
                  project_body = f'<p>{esc(project[f"result_{lang}"])}</p>'
              projects.append(f'<article class="pcv-project"><h3><a href="{esc(target)}">{esc(project["title"])}</a></h3>{project_body}</article>')'''
          if source.count(old_print) != 1:
              raise RuntimeError('compiler print project anchor changed')
          source = source.replace(old_print, new_print, 1)
          build_path.write_text(source, encoding='utf-8')

          style_path = Path('style.css')
          css = style_path.read_text(encoding='utf-8')
          marker = '/* compiler print completion v54 */'
          if marker in css:
              raise RuntimeError('v54 print marker already exists')
          css += '''\n\n/* compiler print completion v54 */\n@media print {\n  .profile-compiler .pcv-project p {\n    margin-top: .8mm;\n    font-size: 8pt;\n    line-height: 1.25;\n  }\n  .profile-compiler .pcv-project .pcv-project-result {\n    margin-top: .55mm;\n    color: #211a1c;\n  }\n  .profile-compiler .pcv-project {\n    margin-bottom: 2.7mm;\n  }\n  .profile-compiler .pcv-entry li {\n    font-size: 8pt;\n    line-height: 1.27;\n  }\n  .profile-compiler .pcv-skill span,\n  .profile-compiler .pcv-compact p {\n    font-size: 7.8pt;\n    line-height: 1.25;\n  }\n  .profile-compiler .pcv-recognition span {\n    font-size: 7.55pt;\n    line-height: 1.22;\n  }\n}\n'''
          style_path.write_text(css.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Install build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Rebuild site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate before visual baseline
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/build_site.py --check
          git diff --check

      - name: Capture visual baseline
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual --update

      - name: Finalize and verify final tree
        run: |
          rm -f .github/workflows/one-shot-compiler-polish-v2.yml
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          python tools/build_site.py --check
          git diff --check

      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cv: finish compiler copy and print layout [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-polish-v2-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
