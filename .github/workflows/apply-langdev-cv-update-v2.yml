name: Apply reviewed LangDev CV update v2

on:
  push:
    branches:
      - "refactor/langdev-2026"

permissions:
  contents: write

concurrency:
  group: apply-langdev-cv-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed content patch
        run: python tools/apply_langdev_cv_update.py
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Generate and validate
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Commit final reviewed tree
        run: |
          rm -f .github/workflows/apply-langdev-cv-update.yml
          rm -f .github/workflows/apply-langdev-cv-update-v2.yml
          rm -f tools/apply_langdev_cv_update.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LangDev 2026 acceptance to CV"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: langdev-cv-review-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
