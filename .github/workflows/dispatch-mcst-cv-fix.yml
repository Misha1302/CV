name: Dispatch MCST CV fact repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcst-internship-facts-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install executor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Execute the reviewed branch repair workflow
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/validate-cv.yml').read_text(encoding='utf-8'))
          selected = {
              'Correct internship facts in all CV variants',
              'Add regression checks for the internship facts',
              'Rebuild all print blocks and PDFs',
              'Restore canonical workflow and rebuild manifest',
              'Validate clean final state',
              'Commit corrected CVs',
          }
          for step in workflow['jobs']['repair']['steps']:
              if step.get('name') in selected:
                  subprocess.run(step['run'], shell=True, check=True, executable='/bin/bash')
          PY
      - name: Remove temporary dispatcher from main
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/dispatch-mcst-cv-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove MCST CV repair dispatcher' || exit 0
          git push origin main
