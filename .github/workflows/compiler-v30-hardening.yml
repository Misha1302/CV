name: Compiler CV v30 final hardening

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-verify-release:
    if: github.event.pull_request.head.ref == 'fix/compiler-cv-v30-final-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve v29 compiler PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v30-evidence/before-pdf
          cp pdf/Mikhail_Razakov_Compiler_RU.pdf v30-evidence/before-pdf/
          cp pdf/Mikhail_Razakov_Compiler_EN.pdf v30-evidence/before-pdf/

      - name: Apply compiler v30 source changes
        run: python3 tools/harden_compiler_cv_v30.py

      - name: Install PDF validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright pymupdf beautifulsoup4
          python3 -m playwright install --with-deps chromium

      - name: Export compiler PDFs at scale 1.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright

          mappings = {
              'ru-compiler.html': 'pdf/Mikhail_Razakov_Compiler_RU.pdf',
              'en-compiler.html': 'pdf/Mikhail_Razakov_Compiler_EN.pdf',
          }
          metrics = {}
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              try:
                  for html, output in mappings.items():
                      page = browser.new_page(
                          viewport={'width': 1440, 'height': 900},
                          device_scale_factor=1,
                          color_scheme='light',
                          reduced_motion='reduce',
                      )
                      page.set_default_timeout(60000)
                      page.emulate_media(media='print', color_scheme='light', reduced_motion='reduce')
                      page.goto(Path(html).resolve().as_uri(), wait_until='networkidle')
                      page.evaluate('document.fonts.ready')
                      page.wait_for_timeout(250)
                      layout = page.evaluate('''() => {
                        const cv = document.querySelector('.print-cv');
                        if (!cv) throw new Error('print-cv missing');
                        const rect = cv.getBoundingClientRect();
                        const all = Array.from(cv.querySelectorAll('*'));
                        const sizes = all.map(el => parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);
                        let bottom = rect.top;
                        for (const el of all) bottom = Math.max(bottom, el.getBoundingClientRect().bottom);
                        return {
                          clientHeight: cv.clientHeight,
                          scrollHeight: cv.scrollHeight,
                          clientWidth: cv.clientWidth,
                          scrollWidth: cv.scrollWidth,
                          minCssFontPx: Math.min(...sizes),
                          usedRatio: (bottom - rect.top) / rect.height,
                        };
                      }''')
                      if layout['scrollHeight'] > layout['clientHeight'] + 2 or layout['scrollWidth'] > layout['clientWidth'] + 2:
                          raise RuntimeError(f'{html}: print overflow: {layout}')
                      if layout['minCssFontPx'] < 11.3:
                          raise RuntimeError(f'{html}: CSS font below readability gate: {layout}')
                      if not (0.78 <= layout['usedRatio'] <= 0.97):
                          raise RuntimeError(f'{html}: implausible page utilization: {layout}')
                      page.pdf(
                          path=output,
                          format='A4',
                          print_background=True,
                          display_header_footer=False,
                          prefer_css_page_size=True,
                          scale=1.0,
                          margin={'top': '0', 'right': '0', 'bottom': '0', 'left': '0'},
                          tagged=True,
                          outline=True,
                      )
                      metrics[html] = layout
                      page.close()
              finally:
                  browser.close()
          Path('v30-layout-metrics.json').write_text(json.dumps(metrics, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(metrics, ensure_ascii=False, indent=2))
          PY

      - name: Validate HTML, PDFs, ATS order and release consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json
          import fitz
          from bs4 import BeautifulSoup

          html_files = sorted(Path('.').glob('*.html'))
          if len(html_files) != 17:
              raise RuntimeError(f'Expected 17 HTML files, found {len(html_files)}')

          ids_by_file = {}
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if 'style.css?v=30' not in text or 'script.js?v=30' not in text:
                  raise RuntimeError(f'{path}: stale asset cache key')
              soup = BeautifulSoup(text, 'html.parser')
              ids = [node.get('id') for node in soup.find_all(attrs={'id': True})]
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'{path}: duplicate IDs')
              ids_by_file[path.name] = set(ids)
              for anchor in soup.select('a[target="_blank"]'):
                  if not {'noopener', 'noreferrer'} <= set(anchor.get('rel') or []):
                      raise RuntimeError(f'{path}: unsafe target=_blank')

          for path in html_files:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              for node in soup.select('[href], [src]'):
                  raw = node.get('href') or node.get('src')
                  if not raw or raw.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  parsed = urlparse(raw)
                  target = (path.parent / (unquote(parsed.path) or path.name)).resolve()
                  if not target.exists():
                      raise RuntimeError(f'{path}: missing local target {raw}')
                  if parsed.fragment:
                      html_name = target.name if target.suffix == '.html' else path.name
                      if parsed.fragment not in ids_by_file.get(html_name, set()):
                          raise RuntimeError(f'{path}: missing fragment {raw}')

          ru = Path('ru-compiler.html').read_text(encoding='utf-8')
          en = Path('en-compiler.html').read_text(encoding='utf-8')
          corpus = ru + '\n' + en
          for stale in (
              'baseline от 14.07.2026',
              'verified baseline dated July 14, 2026',
              'Студент НИУ ВШЭ.',
              'HSE University student.',
              '<strong>Compiler / IR</strong>',
              '<strong>Low-level</strong>',
              '<strong>Конвейер</strong>Лексер',
              '>Преподавание</h2>',
              '>Teaching</h2>',
          ):
              if stale in corpus:
                  raise RuntimeError(f'Stale compiler wording remains: {stale}')
          for required in (
              'Студент программы «Программная инженерия» НИУ ВШЭ',
              'Software Engineering student at HSE University',
              'LLVM-направление',
              'LLVM track',
              'полный прогон 23.07.2026: 0 сбоев, сборка успешна',
              'full run on July 23, 2026: 0 failures, build succeeded',
              'IR-преобразования, interpreter/CIL parity и контракты',
              'IR transforms, interpreter/CIL parity and contracts',
              'Техническая коммуникация',
              'Technical communication',
              '<strong>Конвейер:</strong> лексер',
          ):
              if required not in corpus:
                  raise RuntimeError(f'Required compiler wording missing: {required}')

          metadata = Path('RELEASE-METADATA.md').read_text(encoding='utf-8')
          if '- Version: v30' not in metadata or 'v29, commit `fae03e5adb4152bd1aaa43e56f49d383dc8f9e6d`' not in metadata:
              raise RuntimeError('Release metadata version/baseline mismatch')

          pdfs = sorted(Path('pdf').glob('*.pdf'))
          if len(pdfs) != 14:
              raise RuntimeError(f'Expected 14 PDFs, found {len(pdfs)}')
          changed = {
              'Mikhail_Razakov_Compiler_RU.pdf',
              'Mikhail_Razakov_Compiler_EN.pdf',
          }
          metrics = {}
          out = Path('v30-evidence')
          (out / 'before').mkdir(parents=True, exist_ok=True)
          (out / 'after').mkdir(parents=True, exist_ok=True)

          for before in sorted((out / 'before-pdf').glob('*.pdf')):
              with fitz.open(before) as doc:
                  if len(doc) != 1:
                      raise RuntimeError(f'{before}: pre-change PDF is not one page')
                  doc[0].get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False).save(out / 'before' / f'{before.stem}.png')

          for path in pdfs:
              doc = fitz.open(path)
              if len(doc) != 1:
                  raise RuntimeError(f'{path}: expected one page, found {len(doc)}')
              page = doc[0]
              if abs(page.rect.width - 595.28) > 3 or abs(page.rect.height - 841.89) > 3:
                  raise RuntimeError(f'{path}: expected A4, got {page.rect}')
              text = page.get_text('text')
              normalized = ' '.join(text.split())
              links = [link.get('uri') for link in page.get_links() if link.get('uri')]
              spans = [
                  span
                  for block in page.get_text('dict').get('blocks', [])
                  for line in block.get('lines', [])
                  for span in line.get('spans', [])
                  if span.get('text', '').strip()
              ]
              if not spans or not links:
                  raise RuntimeError(f'{path}: missing text layer or clickable links')
              min_font = min(float(span['size']) for span in spans)
              if path.name in changed:
                  if min_font < 8.45:
                      raise RuntimeError(f'{path}: minimum font below gate: {min_font}')
                  if path.name.endswith('_RU.pdf'):
                      required = (
                          'Программная инженерия',
                          'LLVM-направление',
                          'Техническая коммуникация',
                          'лучший итоговый балл',
                          'IR-преобразования',
                      )
                      order = ('Михаил Разаков', 'UniversalToolchain', 'МЦСТ', 'PS-form', 'Программная инженерия')
                      stale = ('Compiler / IR', 'Low-level', 'Преподавание')
                  else:
                      required = (
                          'Software Engineering student',
                          'LLVM track',
                          'Technical communication',
                          'top MEPhI Junior score',
                          'IR transforms',
                      )
                      order = ('Mikhail Razakov', 'UniversalToolchain', 'MCST', 'PS-form', 'Software Engineering')
                      stale = ('Teaching',)
                  missing = [token for token in required if token not in normalized]
                  if missing:
                      raise RuntimeError(f'{path}: required wording missing: {missing}')
                  bad = [token for token in stale if token in normalized]
                  if bad:
                      raise RuntimeError(f'{path}: stale wording remains: {bad}')
                  positions = [normalized.find(token) for token in order]
                  if any(pos < 0 for pos in positions) or positions != sorted(positions):
                      raise RuntimeError(f'{path}: ATS text order failed: {dict(zip(order, positions))}')
                  page.get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False).save(out / 'after' / f'{path.stem}.png')
              metrics[path.name] = {
                  'pages': len(doc),
                  'min_font_pt': round(min_font, 2),
                  'text_chars': len(text.strip()),
                  'links': len(links),
              }
              doc.close()

          layout = json.loads(Path('v30-layout-metrics.json').read_text(encoding='utf-8'))
          qa = Path('QA-report-targeted-cv-v30.md')
          qa.write_text(
              '# QA report - targeted CV v30\n\n'
              '## Scope\n\n'
              '- Compiler RU/EN public pages and focused PDFs were reviewed against the v29 baseline.\n'
              '- Education now identifies the confirmed HSE Software Engineering programme.\n'
              '- Wist2 proof qualifiers, LLVM-track positioning, Russian terminology, typography and technical-communication copy were checked.\n'
              '- All 17 HTML files parse; local links/fragments resolve and IDs are unique.\n'
              '- All 14 role PDFs remain one-page A4 documents with selectable text and clickable links.\n'
              '- Compiler RU/EN are rebuilt at scale=1.0 with no print overflow and an 8.45 pt extracted-font floor.\n'
              '- MANIFEST.sha256 is regenerated and verified after temporary build files are removed.\n\n'
              '## Layout result\n\n```json\n'
              + json.dumps(layout, ensure_ascii=False, indent=2)
              + '\n```\n\n## PDF result\n\n```json\n'
              + json.dumps({k: metrics[k] for k in sorted(changed)}, ensure_ascii=False, indent=2)
              + '\n```\n\n## Automated verdict\n\n**PASS.** Human before/after render review is required before merge.\n',
              encoding='utf-8',
          )
          Path('v30-pdf-metrics.json').write_text(json.dumps(metrics, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k: metrics[k] for k in sorted(changed)}, ensure_ascii=False, indent=2))
          PY

      - name: Upload before/after render evidence
        uses: actions/upload-artifact@v4
        with:
          name: compiler-cv-v30-before-after-renders
          path: |
            v30-evidence/before/*.png
            v30-evidence/after/*.png
            v30-layout-metrics.json
            v30-pdf-metrics.json
          retention-days: 7
          if-no-files-found: error

      - name: Commit clean v30 release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools v30-evidence
          rm -f v30-layout-metrics.json v30-pdf-metrics.json
          rm -f .github/workflows/compiler-v30-hardening.yml
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize compiler CV v30 hardening'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
