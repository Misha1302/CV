name: One-shot compiler and PL R&D reposition

on:
  push:
    branches: [positioning/compiler-pl-rd-20260908]
    paths:
      - ".github/workflows/one-shot-compiler-pl-rd-refresh.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-compiler-pl-rd-reposition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: positioning/compiler-pl-rd-20260908
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply application-print generator patch
        run: python tools/patch_application_print_layout.py

      - name: Apply evidence-driven positioning migration
        run: |
          python tools/reposition_compiler_pl_rd_20260908.py
          python tools/refine_compiler_pl_rd_rendering_20260908.py

      - name: Positioning and anti-overclaim guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/site.json').read_text(encoding='utf-8'))
          assert data['profile_order'].index('research') == data['profile_order'].index('compiler') + 1
          assert data['profiles']['general']['en']['role'] == 'Compiler & Program Analysis Engineer'
          assert data['profiles']['compiler']['en']['role'] == 'Compiler Engineer · LLVM · Program Analysis'
          assert data['profiles']['research']['en']['role'] == 'Research Engineer · Compilers & Programming Languages'
          assert data['profiles']['research']['en']['print_layout'] == 'application'
          assert data['profiles']['compiler']['en']['print_layout'] == 'application'
          assert data['profiles']['compiler']['en']['project_ids'] == ['globaliv', 'deref', 'codegen', 'wist']
          assert data['profiles']['research']['en']['project_ids'] == ['wist', 'globaliv', 'codegen', 'deref']
          assert data['profiles']['compiler']['en']['show_portrait'] is True
          assert data['profiles']['research']['en']['show_portrait'] is True
          assert 'APInt affine evolution' in data['profiles']['compiler']['en']['project_summaries']['globaliv']['application']
          assert 'edge-sensitive' in data['profiles']['compiler']['en']['project_summaries']['deref']['application']
          assert 'register allocation' in data['profiles']['compiler']['en']['project_summaries']['codegen']['application']
          assert '1,324-test exact manifest' in data['profiles']['compiler']['en']['project_summaries']['wist']['application']
          assert data['profiles']['research']['ru']['proofs'][1][0] == 'Корректность компилятора при неполной модели'
          raw = Path('data/site.json').read_text(encoding='utf-8').casefold()
          for forbidden in (
              'research scientist', 'peer-reviewed publication', 'published researcher',
              'production-grade', 'formal verification', 'state of the art',
              'senior compiler', 'staff engineer', 'principal engineer',
          ):
              assert forbidden not in raw, forbidden
          research_result = data['profiles']['research']['en']['project_summaries']['wist']['result']
          assert 'not a submission' in research_result
          assert 'remain explicitly blocked' in research_result
          build_site = Path('tools/build_site.py').read_text(encoding='utf-8')
          assert 'elif profile_key == "research"' in build_site
          assert 'Compiler & Program Analysis Engineer</h1>' in build_site
          assert 'summary.get("application")' in build_site
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Application PDF reading-order and text-layer guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz

          checks = {
              'Mikhail_Razakov_Compiler_EN.pdf': ('EDUCATION', 'EXPERIENCE', 'SELECTED RESEARCH & ENGINEERING', 'SKILLS', 'RECOGNITION'),
              'Mikhail_Razakov_Research_Engineer_EN.pdf': ('EDUCATION', 'EXPERIENCE', 'SELECTED RESEARCH & ENGINEERING', 'SKILLS', 'RECOGNITION'),
              'Mikhail_Razakov_Compiler_RU.pdf': ('ОБРАЗОВАНИЕ', 'ОПЫТ', 'ИССЛЕДОВАНИЯ И ПРОЕКТЫ', 'КОМПЕТЕНЦИИ', 'ДОСТИЖЕНИЯ'),
              'Mikhail_Razakov_Research_Engineer_RU.pdf': ('ОБРАЗОВАНИЕ', 'ОПЫТ', 'ИССЛЕДОВАНИЯ И ПРОЕКТЫ', 'КОМПЕТЕНЦИИ', 'ДОСТИЖЕНИЯ'),
          }
          for filename, headings in checks.items():
              path = Path('pdf') / filename
              assert path.exists(), filename
              with fitz.open(path) as doc:
                  assert doc.page_count == 1, (filename, doc.page_count)
                  text = doc[0].get_text('text')
              assert len(text.strip()) > 800, (filename, len(text))
              positions = [text.find(h) for h in headings]
              assert all(pos >= 0 for pos in positions), (filename, headings, positions)
              assert positions == sorted(positions), (filename, headings, positions)
          PY

      - name: Validate content and external links
        run: python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json

      - name: Targeted visual validation
        run: |
          mkdir -p /tmp/cv-visual
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/cv-visual')
          filenames = ('ru.html', 'en.html', 'ru-compiler.html', 'en-compiler.html', 'ru-research.html', 'en-research.html')
          with sync_playwright() as p:
              browser = p.chromium.launch()
              try:
                  for filename in filenames:
                      for width, height in ((1440, 1000), (390, 844)):
                          page = browser.new_page(viewport={'width': width, 'height': height})
                          page.goto(f'http://127.0.0.1:8765/{filename}', wait_until='networkidle')
                          metrics = page.evaluate('''() => ({
                              viewport: document.documentElement.clientWidth,
                              scrollWidth: document.documentElement.scrollWidth,
                              h1: document.querySelector('h1')?.textContent || '',
                              role: document.querySelector('.hero-role')?.textContent || '',
                          })''')
                          if metrics['scrollWidth'] > metrics['viewport'] + 1:
                              raise RuntimeError(f"Horizontal overflow {filename}/{width}: {metrics}")
                          if 'Разаков' not in metrics['h1'] and 'Razakov' not in metrics['h1']:
                              raise RuntimeError(f"Missing CV heading {filename}: {metrics}")
                          if not metrics['role'].strip():
                              raise RuntimeError(f"Missing role {filename}: {metrics}")
                          page.screenshot(path=str(out / f'{filename}-{width}.png'), full_page=True)
                          page.close()
              finally:
                  browser.close()
          PY

      - name: Final manifest, diff, and validation
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
          git status --short

      - name: Commit canonical source and generated artifacts to research branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Compiler/R&D profiles are already current'
          else
            git commit -m 'Reposition compiler and PL R&D CVs [skip ci]'
            git push origin HEAD:positioning/compiler-pl-rd-20260908
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-pl-rd-positioning-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn

# rerun after Russian research localization fix
