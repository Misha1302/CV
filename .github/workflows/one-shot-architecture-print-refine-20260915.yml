name: One-shot architecture print refinement

on:
  push:
    branches:
      - "refactor/architecture-profile-20260915"
    paths:
      - ".github/workflows/one-shot-architecture-print-refine-20260915.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Make print project evidence profile-specific
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = Path("data/site.json")
          data = json.loads(site.read_text(encoding="utf-8"))
          if data.get("version") != 62:
              raise SystemExit(f"Expected v62 baseline, got {data.get('version')!r}")
          if "architecture" not in data.get("profiles", {}):
              raise SystemExit("architecture profile missing")

          data["version"] = 63
          data["updated_at"] = "2026-09-15"

          ru = data["profiles"]["architecture"]["ru"]
          en = data["profiles"]["architecture"]["en"]

          ru["project_summaries"] = {
              "wist": {
                  "solution": "Единственный публичный semantic planner разрешает зависимости и конфликты, выбирает providers, фиксирует порядок contributions и типизированные backend routes в одном immutable LanguagePlan до запуска runtime.",
                  "result": "Архитектурные решения защищены pre-execution validation, exact manifest/ownership checks и parity interpreter/CIL; текущий exact manifest — 1 324/1 324."
              },
              "vpn": {
                  "solution": "Явные payment/access states отделяют приём внешних событий от идемпотентного reconciliation и recovery; миграции и operational gates делают lifecycle-переходы проверяемыми.",
                  "result": "Recovery включает backup/restore, health-gated переключение release и rollback; публичный кейс не раскрывает секреты и пользовательские данные."
              },
              "codegen": {
                  "solution": "Стратегия register allocation отделена от независимого assignment verifier до phi lowering и генерации SysV x86-64.",
                  "result": "Семантика сгенерированного native-кода проверяется differential execution относительно эталонного интерпретатора; тесты покрывают ветвления, циклы, spills и parallel phi moves."
              }
          }
          en["project_summaries"] = {
              "wist": {
                  "solution": "One public semantic planner resolves dependencies/conflicts, selects providers, and freezes contribution ordering plus typed backend routes into one immutable LanguagePlan before runtime starts.",
                  "result": "The design is enforced by pre-execution validation, exact manifest/ownership checks, and interpreter/CIL parity; the current exact manifest is 1,324/1,324."
              },
              "vpn": {
                  "solution": "Explicit payment/access states separate external-event acceptance from idempotent reconciliation and recovery; migrations and operational gates keep lifecycle transitions inspectable.",
                  "result": "Recovery includes backup/restore, health-gated release switching, and rollback; the public case study excludes secrets and user data."
              },
              "codegen": {
                  "solution": "Register-allocation strategy is separated from an independent assignment verifier before phi lowering and SysV x86-64 emission.",
                  "result": "Generated native behavior is differentially checked against a reference interpreter; tests cover branches, loops, spills, and parallel phi moves."
              }
          }
          site.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          for rel in ["tools/build_site.py", "tools/patch_application_print_layout.py"]:
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              old = '''        summary = project_summaries.get(project_id, {}) if is_compiler_print else {}\n        if is_compiler_print and summary:\n'''
              new = '''        summary = project_summaries.get(project_id, {})\n        if summary:\n'''
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{rel}: expected one print-summary guard, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, links, PDFs, and visual smoke
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update-if-missing
          git diff --check
      - name: Verify architecture print copy
        run: |
          grep -q "One public semantic planner resolves dependencies/conflicts" en-architecture.html
          grep -q "Единственный публичный semantic planner разрешает зависимости" ru-architecture.html
          if grep -q "32/32 primary" en-architecture.html; then
            echo "Architecture page still contains generic verifier experiment copy" >&2
            exit 1
          fi
      - name: Build manifest and validate final tree
        run: |
          rm -f .github/workflows/one-shot-architecture-print-refine-20260915.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          python tools/build_site.py --check
          git diff --check
      - name: Commit refined architecture profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine architecture CV decision evidence"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-print-refinement-validation
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
