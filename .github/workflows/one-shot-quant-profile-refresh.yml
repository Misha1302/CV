name: One-shot quant profile refresh

# retriggered for low-level/performance targeting on 2026-08-20
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-quant-profile-refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-quant-profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update canonical quant profile data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/site.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = max(int(data.get('version', 0)), 37)
          data['updated_at'] = '2026-08-20'

          ru = data['profiles']['quant']['ru']
          ru['summary'] = (
              'Сильная база в computer science, алгоритмах и исследовательском решении задач; '
              'практический опыт C++ и Python, LLVM и compiler/runtime-разработки. Работаю в цикле '
              '«гипотеза → эксперимент → проверка»: строю точные оракулы, randomized/metamorphic tests, '
              'воспроизводимые harnesses и benchmarks, анализирую контрпримеры и производительность. '
              'Работаю с JIT-компиляцией, векторизацией, x86-64 assembly и анализом генерируемого '
              'машинного и дизассемблированного кода.'
          )
          ru['description'] = (
              'Quantitative Research профиль Михаила Разакова: C++, Python, алгоритмы, LLVM, JIT, '
              'векторизация, low-level performance, проверка гипотез и воспроизводимые эксперименты.'
          )
          ru['proofs'][2] = [
              'C++ / low-level performance',
              'C++23, LLVM, JIT, векторизация, x86-64 assembly, анализ generated/disassembled machine code и benchmarks',
          ]
          for item in ru['experience']:
              if item['title'].startswith('UniversalToolchain / Wist2'):
                  item['bullets'][1] = (
                      'Использую benchmarking, JIT/CIL execution и анализ сгенерированного и '
                      'дизассемблированного кода для проверки производительности и поведения реализаций.'
                  )
                  break
          ru['skills'] = [
              ['Programming', 'C++23, Python, C17, C#, Rust'],
              ['Алгоритмы и CS', 'структуры данных, алгоритмы графов, program analysis, CFG/SSA, compiler optimizations'],
              ['Low-level & performance', 'LLVM, JIT/CIL, x86-64 assembly, vectorization, compiler optimizations, generated/disassembled machine-code analysis, benchmarking'],
              ['Эксперименты и tooling', 'формулировка и проверка гипотез, exact oracles, differential/metamorphic/randomized testing, Python-harnesses, Linux, Git, CMake'],
          ]

          en = data['profiles']['quant']['en']
          en['summary'] = (
              'Strong computer-science, algorithms, and research problem-solving background with hands-on '
              'C++ and Python, LLVM, and compiler/runtime engineering. I work in a hypothesis → experiment → '
              'validation loop using exact oracles, randomized/metamorphic tests, reproducible harnesses and '
              'benchmarks, counterexample analysis, and performance investigation. I work with JIT compilation, '
              'vectorization, x86-64 assembly, and generated/disassembled machine-code analysis.'
          )
          en['description'] = (
              'Mikhail Razakov quantitative-research profile: C++, Python, algorithms, LLVM, JIT, '
              'vectorization, low-level performance, hypothesis testing, and reproducible experiments.'
          )
          en['proofs'][2] = [
              'C++ / low-level performance',
              'C++23, LLVM, JIT, vectorization, x86-64 assembly, generated/disassembled machine-code analysis, and benchmarks',
          ]
          for item in en['experience']:
              if item['title'].startswith('UniversalToolchain / Wist2'):
                  item['bullets'][1] = (
                      'Use benchmarking, JIT/CIL execution, and generated/disassembled-code analysis to '
                      'investigate implementation behavior and performance.'
                  )
                  break
          en['skills'] = [
              ['Programming', 'C++23, Python, C17, C#, Rust'],
              ['Algorithms & CS', 'data structures, graph algorithms, program analysis, CFG/SSA, compiler optimizations'],
              ['Low-level & performance', 'LLVM, JIT/CIL, x86-64 assembly, vectorization, compiler optimizations, generated/disassembled machine-code analysis, benchmarking'],
              ['Experiments & tooling', 'hypothesis formulation and validation, exact oracles, differential/metamorphic/randomized testing, Python harnesses, Linux, Git, CMake'],
          ]

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Remove deprecated generated artifacts
        run: |
          rm -f data/cv-print-profiles.json tools/update_profiles_v33.py
          rm -f QA-report-targeted-cv-v*.md
          rm -f pdf/Mikhail_Razakov_DevTools_*.pdf
          rm -f pdf/Mikhail_Razakov_Algorithms_*.pdf
          rm -f pdf/Mikhail_Razakov_EdTech_*.pdf
          rm -f pdf/Mikhail_Razakov_Reliability_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate content, links, PDFs, and visuals
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update-if-missing
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf

      - name: Commit canonical source and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Quant profile is already current'
          else
            git commit -m 'Strengthen quant CV low-level profile [skip ci]'
            git push origin HEAD:main
          fi

      - name: Refresh GitHub Pages when branch-built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = 'legacy' ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header 'X-GitHub-Api-Version: 2022-11-28'
          else
            echo "GitHub Pages build type is '$build_type'; no legacy branch build request is needed."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-quant-profile-refresh-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
