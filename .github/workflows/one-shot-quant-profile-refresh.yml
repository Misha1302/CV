name: One-shot quant resume reposition

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-quant-profile-refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-quant-resume-reposition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply application-print generator patch
        run: python tools/patch_application_print_layout.py

      - name: Apply evidence-driven profile migration
        run: python tools/reposition_quant_profiles_20260908_v3.py

      - name: Evidence and positioning guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('data/site.json').read_text(encoding='utf-8'))
          assert data['profiles']['quantdev']['en']['role'] == 'Quant Developer / Research Engineer | C++ · Python'
          assert data['profiles']['quant']['en']['role'] == 'Quantitative Research Candidate | C++ · Python'
          assert data['profiles']['systems']['en']['role'].startswith('C++ / Systems Engineer')
          for key in ('quantdev', 'quant', 'systems'):
              for lang in ('ru', 'en'):
                  profile = data['profiles'][key][lang]
                  assert profile['print_layout'] == 'application'
                  titles = [x['title'] for x in profile['experience']]
                  assert any('ИСП РАН' in t or 'ISP RAS' in t for t in titles), (key, lang, titles)
                  assert any('МЦСТ' in t or 'MCST' in t for t in titles), (key, lang, titles)
                  assert not any('PS-form' in t or 'UniversalToolchain' in t for t in titles), (key, lang, titles)
          raw = Path('data/site.json').read_text(encoding='utf-8')
          assert 'Занял Консервативный' not in raw
          assert '1,306/1,306' not in raw
          assert '1 306/1 306' not in raw
          assert 'low-latency engineer' not in raw.casefold()
          assert data['projects']['wist']['result_en'].startswith('Current exact test manifest: 1,324/1,324.')
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Clean generated legacy artifacts
        run: |
          rm -f data/cv-print-profiles.json tools/update_profiles_v33.py
          rm -f QA-report-targeted-cv-v*.md
          rm -f pdf/Mikhail_Razakov_DevTools_*.pdf
          rm -f pdf/Mikhail_Razakov_Algorithms_*.pdf
          rm -f pdf/Mikhail_Razakov_EdTech_*.pdf
          rm -f pdf/Mikhail_Razakov_Reliability_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Application PDF reading-order guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz

          checks = {
              'Mikhail_Razakov_Quant_Developer_EN.pdf': ('EDUCATION', 'EXPERIENCE', 'SELECTED RESEARCH & ENGINEERING', 'SKILLS', 'RECOGNITION'),
              'Mikhail_Razakov_Quant_Research_EN.pdf': ('EDUCATION', 'EXPERIENCE', 'SELECTED RESEARCH & ENGINEERING', 'SKILLS', 'RECOGNITION'),
              'Mikhail_Razakov_CPP_Systems_EN.pdf': ('EDUCATION', 'EXPERIENCE', 'SELECTED RESEARCH & ENGINEERING', 'SKILLS', 'RECOGNITION'),
              'Mikhail_Razakov_Quant_Developer_RU.pdf': ('ОБРАЗОВАНИЕ', 'ОПЫТ', 'ИССЛЕДОВАНИЯ И ПРОЕКТЫ', 'КОМПЕТЕНЦИИ', 'ДОСТИЖЕНИЯ'),
              'Mikhail_Razakov_Quant_Research_RU.pdf': ('ОБРАЗОВАНИЕ', 'ОПЫТ', 'ИССЛЕДОВАНИЯ И ПРОЕКТЫ', 'КОМПЕТЕНЦИИ', 'ДОСТИЖЕНИЯ'),
              'Mikhail_Razakov_CPP_Systems_RU.pdf': ('ОБРАЗОВАНИЕ', 'ОПЫТ', 'ИССЛЕДОВАНИЯ И ПРОЕКТЫ', 'КОМПЕТЕНЦИИ', 'ДОСТИЖЕНИЯ'),
          }
          for filename, headings in checks.items():
              with fitz.open(Path('pdf') / filename) as doc:
                  assert doc.page_count == 1, filename
                  text = doc[0].get_text('text')
              positions = [text.find(h) for h in headings]
              assert all(pos >= 0 for pos in positions), (filename, headings, positions)
              assert positions == sorted(positions), (filename, headings, positions)
          PY

      - name: Validate content and external links
        run: python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json

      - name: Targeted visual validation
        run: |
          mkdir -p /tmp/cv-visual
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/cv-visual')
          filenames = (
              'ru-quant-dev.html', 'en-quant-dev.html',
              'ru-quant.html', 'en-quant.html',
              'ru-cpp-systems.html', 'en-cpp-systems.html',
          )
          with sync_playwright() as p:
              browser = p.chromium.launch()
              try:
                  for filename in filenames:
                      for width, height in ((1440, 1000), (390, 844)):
                          page = browser.new_page(viewport={'width': width, 'height': height})
                          page.goto(f'http://127.0.0.1:8765/{filename}', wait_until='networkidle')
                          metrics = page.evaluate('''() => ({
                              viewport: document.documentElement.clientWidth,
                              scrollWidth: document.documentElement.scrollWidth,
                              h1: document.querySelector('h1')?.textContent || '',
                              role: document.querySelector('.hero-role')?.textContent || '',
                          })''')
                          if metrics['scrollWidth'] > metrics['viewport'] + 1:
                              raise RuntimeError(f"Horizontal overflow {filename}/{width}: {metrics}")
                          if 'Разаков' not in metrics['h1'] and 'Razakov' not in metrics['h1']:
                              raise RuntimeError(f"Missing CV heading {filename}: {metrics}")
                          if not metrics['role'].strip():
                              raise RuntimeError(f"Missing role {filename}: {metrics}")
                          page.screenshot(path=str(out / f'{filename}-{width}.png'), full_page=True)
                          page.close()
              finally:
                  browser.close()
          PY

      - name: Final manifest, diff, and validation
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
          git status --short

      - name: Commit canonical source and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Quant/system profiles are already current'
          else
            git commit -m 'Add ATS-oriented quant application PDFs [skip ci]'
            git push origin HEAD:main
          fi

      - name: Refresh GitHub Pages when branch-built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = 'legacy' ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header 'X-GitHub-Api-Version: 2022-11-28'
          else
            echo "GitHub Pages build type is '$build_type'; no legacy branch build request is needed."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-quant-resume-reposition-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
