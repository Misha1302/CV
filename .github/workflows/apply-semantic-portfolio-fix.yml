name: Apply semantic portfolio rewrite

on:
  push:
    branches:
      - "refactor/cv-semantic-positioning-2026-09-14"
    paths:
      - "tools/apply_semantic_portfolio_fix_20260914.py"
      - "tools/refine_semantic_portfolio_fix_20260914.py"
      - "tools/finalize_portfolio_breadth_20260914.py"
      - ".github/workflows/apply-semantic-portfolio-fix.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply_semantic_portfolio_fix_20260914.py"
      - "tools/refine_semantic_portfolio_fix_20260914.py"
      - "tools/finalize_portfolio_breadth_20260914.py"
      - ".github/workflows/apply-semantic-portfolio-fix.yml"

permissions:
  contents: write

concurrency:
  group: semantic-cv-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewrite-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical semantic rewrite
        run: |
          python tools/apply_semantic_portfolio_fix_20260914.py
          python tools/refine_semantic_portfolio_fix_20260914.py
          python tools/finalize_portfolio_breadth_20260914.py
          python -m json.tool data/site.json >/dev/null
      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Regenerate HTML and PDF from canonical source
        run: |
          rm -f data/cv-print-profiles.json tools/update_profiles_v33.py
          rm -f QA-report-targeted-cv-v*.md
          rm -f pdf/Mikhail_Razakov_DevTools_*.pdf
          rm -f pdf/Mikhail_Razakov_Algorithms_*.pdf
          rm -f pdf/Mikhail_Razakov_EdTech_*.pdf
          rm -f pdf/Mikhail_Razakov_Reliability_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, links and one-page PDFs
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
      - name: Capture visual changes against previous baseline
        continue-on-error: true
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual-before-update
      - name: Rebaseline intentional semantic/structural changes and recheck all views
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/visual_regression.py --output-dir /tmp/cv-visual-recheck
      - name: Build manifest and validate generated tree
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Check regeneration determinism
        run: |
          python tools/build_site.py --check
          rm -rf /tmp/cv-pdf-rebuild /tmp/cv-pdf-evidence-2
          python tools/build_cv.py --output-dir /tmp/cv-pdf-rebuild --evidence-dir /tmp/cv-pdf-evidence-2 --report /tmp/cv-pdf-report-2.json
          python tools/validate_cv.py --pdf-dir /tmp/cv-pdf-rebuild --compare-dir pdf --skip-manifest
          python tools/build_site.py --check
      - name: Remove one-shot machinery, rebuild manifest, and commit verified result
        run: |
          git rm tools/apply_semantic_portfolio_fix_20260914.py tools/refine_semantic_portfolio_fix_20260914.py tools/finalize_portfolio_breadth_20260914.py .github/workflows/apply-semantic-portfolio-fix.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite compiler CV positioning from verified evidence [skip ci]"
          git push origin HEAD:refactor/cv-semantic-positioning-2026-09-14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-cv-rewrite-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual-before-update
            /tmp/cv-visual
            /tmp/cv-visual-recheck
            /tmp/cv-pdf-rebuild
          if-no-files-found: warn
