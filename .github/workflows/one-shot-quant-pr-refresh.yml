name: One-shot quant PR refresh

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pages: write

concurrency:
  group: one-shot-quant-pr-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.title == 'Temporary CI trigger probe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical quant profile
        run: |
          python tools/tmp_quant_profile_refresh_20260820.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/site.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['projects']['planfuzz']['repo'] = 'https://github.com/Misha1302/UniversalToolchain'
          data['projects']['wist']['repo'] = 'https://github.com/Misha1302/UniversalToolchain'
          data['projects']['wist'].pop('docs', None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Remove deprecated generated artifacts
        run: |
          rm -f data/cv-print-profiles.json tools/update_profiles_v33.py
          rm -f QA-report-targeted-cv-v*.md
          rm -f pdf/Mikhail_Razakov_DevTools_*.pdf
          rm -f pdf/Mikhail_Razakov_Algorithms_*.pdf
          rm -f pdf/Mikhail_Razakov_EdTech_*.pdf
          rm -f pdf/Mikhail_Razakov_Reliability_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Generate canonical HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content and external links
        run: python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
      - name: Targeted visual validation for quant profiles
        run: |
          mkdir -p /tmp/cv-visual
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          out = Path('/tmp/cv-visual')
          out.mkdir(parents=True, exist_ok=True)
          cases = [
              ('ru-quant.html', 1440, 1000),
              ('ru-quant.html', 390, 844),
              ('en-quant.html', 1440, 1000),
              ('en-quant.html', 390, 844),
          ]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              try:
                  for filename, width, height in cases:
                      page = browser.new_page(viewport={'width': width, 'height': height})
                      page.goto(f'http://127.0.0.1:8765/{filename}', wait_until='networkidle')
                      metrics = page.evaluate('''() => ({
                          viewport: document.documentElement.clientWidth,
                          scrollWidth: document.documentElement.scrollWidth,
                          scrollHeight: document.documentElement.scrollHeight,
                          h1: document.querySelector('h1')?.textContent || '',
                          role: document.querySelector('.role')?.textContent || document.querySelector('.pcv-header h2')?.textContent || ''
                      })''')
                      if metrics['scrollWidth'] > metrics['viewport'] + 1:
                          raise RuntimeError(f"Horizontal overflow {filename}/{width}: {metrics}")
                      if 'Разаков' not in metrics['h1'] and 'Razakov' not in metrics['h1']:
                          raise RuntimeError(f"Missing CV heading {filename}: {metrics}")
                      page.screenshot(path=str(out / f'{filename}-{width}.png'), full_page=True)
                      page.close()
              finally:
                  browser.close()
          PY
      - name: Final manifest and validation
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Commit canonical source and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Quant profile is already current'
          else
            git commit -m 'Refocus quant CV on research evidence [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-quant-pr-refresh-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
