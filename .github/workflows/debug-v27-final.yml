name: Debug v27 final

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  diagnose-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 tools/rebuild_cv_v27.py
          python3 tools/tune_cv_v27.py
      - uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter
      - run: |
          python3 -m pip install --disable-pip-version-check playwright pymupdf
          python3 -m playwright install --with-deps chromium
      - name: Diagnose tuned layout and PDF
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee debug-final.log
          from pathlib import Path
          import sys, json, traceback
          import fitz
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path('.exporter').resolve()))
          import export_cv_html_to_pdf as helper

          out=Path('debug-final'); out.mkdir(exist_ok=True)
          mappings={
            'ru-compiler.html':'Mikhail_Razakov_Compiler_RU.pdf',
            'en-compiler.html':'Mikhail_Razakov_Compiler_EN.pdf',
            'ru-cpp-systems.html':'Mikhail_Razakov_CPP_Systems_RU.pdf',
            'en-cpp-systems.html':'Mikhail_Razakov_CPP_Systems_EN.pdf',
          }
          report={}
          try:
            with sync_playwright() as p:
              browser=helper.launch_browser(p,None)
              try:
                for html,pdfname in mappings.items():
                  page=browser.new_page(viewport={'width':1440,'height':900},color_scheme='light',reduced_motion='reduce')
                  page.emulate_media(media='print',color_scheme='light',reduced_motion='reduce')
                  helper.load_local_document(page,Path(html).resolve())
                  helper.wait_for_page_assets(page,60000,False)
                  helper.prepare_document(page,f'https://misha1302.github.io/CV/{html}')
                  page.wait_for_timeout(200)
                  layout=page.evaluate('''() => {const cv=document.querySelector('.print-cv');const cr=cv.getBoundingClientRect();const all=Array.from(cv.querySelectorAll('*'));const sizes=all.map(el=>parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);let bottom=cr.top;for(const el of all){bottom=Math.max(bottom,el.getBoundingClientRect().bottom);}return {clientHeight:cv.clientHeight,scrollHeight:cv.scrollHeight,clientWidth:cv.clientWidth,scrollWidth:cv.scrollWidth,minCssFontPx:Math.min(...sizes),contentBottom:bottom,boxBottom:cr.bottom,usedRatio:(bottom-cr.top)/cr.height};}''')
                  pdf=out/pdfname
                  page.pdf(path=str(pdf),format='A4',print_background=True,display_header_footer=False,prefer_css_page_size=True,scale=1.0,margin={'top':'0','right':'0','bottom':'0','left':'0'},tagged=True,outline=True)
                  page.screenshot(path=str(out/f'{Path(html).stem}.png'),full_page=True,animations='disabled')
                  page.close()
                  doc=fitz.open(pdf); pg=doc[0]
                  text=pg.get_text('text'); links=[x.get('uri') for x in pg.get_links() if x.get('uri')]
                  spans=[s for b in pg.get_text('dict').get('blocks',[]) for l in b.get('lines',[]) for s in l.get('spans',[]) if s.get('text','').strip()]
                  report[html]={'layout':layout,'pdf_pages':len(doc),'min_font_pt':min(float(s['size']) for s in spans),'text_chars':len(text.strip()),'links':links,'text_head':text[:600]}
                  doc.close()
              finally:
                browser.close()
            (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
            print(json.dumps(report,ensure_ascii=False,indent=2))
          except Exception:
            traceback.print_exc()
            (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
            raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-v27-final
          path: |
            debug-final.log
            debug-final/*
          retention-days: 7
          if-no-files-found: error
