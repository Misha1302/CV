name: One-shot Russian CV readability rewrite

on:
  push:
    branches:
      - chore/ru-cv-readability-2026-07-25

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ru-cv-readability-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite Russian flagship CV
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          page_path = Path('ru-compiler.html')
          text = page_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'Резюме Михаила Разакова: typed composition/runtime SDK, Wist, callable-first SSA, PlanFuzz, program analysis и LLVM/C++23.',
                  'Резюме Михаила Разакова: UniversalToolchain/Wist2, типизированная композиция языков, SSA с семантикой вызовов, PlanFuzz, анализ программ и LLVM/C++23.',
              ),
              ('Михаил Разаков — Compiler / Runtime Engineer', 'Михаил Разаков — инженер по компиляторам и средам исполнения'),
              ('"name":"Mikhail Razakov","jobTitle":"Compiler / Runtime Engineer"', '"name":"Михаил Разаков","jobTitle":"Инженер по компиляторам и средам исполнения"'),
              ('компиляторы · runtime · анализ программ', 'компиляторы · среды исполнения · анализ программ'),
              ('aria-label="English version"', 'aria-label="Английская версия"'),
              ('Typed composition/runtime SDK · compiler/runtime · SSA · PlanFuzz', 'Языковые платформы · среды исполнения · SSA · PlanFuzz'),
              (
                  'Разрабатываю UniversalToolchain/Wist2 — SDK для типизированной композиции языковых компонентов и runtime. Ключевые части: детерминированные cross-package plans, exact manifest binding, callable-first SSA, публичный Wist facade и экспериментальный PlanFuzz.',
                  'Разрабатываю UniversalToolchain/Wist2 — SDK для типизированной сборки языковых компонентов и сред исполнения. Ключевые части: детерминированные межпакетные планы, точное связывание с манифестом, SSA с явной семантикой вызовов, публичный интерфейс Wist и экспериментальный PlanFuzz.',
              ),
              ('Языковые платформы, compiler/runtime и проверка семантики', 'Языковые платформы, среды исполнения и проверка семантики'),
              ('typed plans · callable-first SSA · PlanFuzz · interpreter/CIL', 'планы композиции · Callable-first SSA · PlanFuzz · интерпретатор/CIL'),
              ('<strong>Typed composition plans</strong><span>cross-package routes, deterministic passes и exact backend executor</span>', '<strong>Планы типизированной композиции</strong><span>межпакетные маршруты, детерминированные проходы и точный исполнитель</span>'),
              ('<strong>Callable-first SSA</strong><span>effects, determinism, trust и verifier-gated AIR → SSA → AIR</span>', '<strong>SSA с семантикой вызовов</strong><span>побочные эффекты, детерминизм, доверие и проверяемый цикл AIR → SSA → AIR</span>'),
              ('0 падений; 9 packages и clean consumers подтверждены canonical gate', '0 падений; контрольная проверка 9 пакетов и чистых проектов-потребителей'),
              ('typed authoring SDK и manifest-backed runtime', 'SDK для создания языков и среда исполнения с манифестами'),
              ('7 oracle families, replay, exact fingerprints и reducers', '7 семейств оракулов, воспроизведение, точные отпечатки и сокращение примеров'),
              ('Validate/Evaluate/Compile и typed .NET delegates', 'проверка, вычисление и компиляция в типизированные делегаты .NET'),
              ('LLVM-направление · C++23 · graph analysis', 'LLVM-направление · C++23 · анализ графов'),
              ('Архитектура языковых платформ, IR и проверяемые маршруты исполнения.', 'Архитектура языковых платформ, промежуточные представления и проверяемые маршруты исполнения.'),
              ('Главная работа — UniversalToolchain/Wist2: от типизированной композиции независимых языковых пакетов до callable-first SSA и configuration-aware testing.', 'Главная работа — UniversalToolchain/Wist2: от типизированной композиции независимых языковых пакетов до SSA с явной семантикой вызовов и тестирования с учётом конфигурации.'),
              ('Typed composition/runtime SDK · compiler/runtime platform · .NET', 'SDK для композиции языков и сред исполнения · .NET'),
              ('Спроектировал типизированный SDK, собирающий язык из независимо поставляемых packages: artifact contracts, capabilities/conflicts, детерминированные conversion routes и порядок passes.', 'Спроектировал типизированный SDK, собирающий язык из независимых пакетов: контракты артефактов, возможности и конфликты, детерминированные маршруты преобразования и порядок проходов.'),
              ('Реализовал exact manifest binding, schema-v5 lock identity, fail-closed runtime policies и точный выбор backend executor по contribution, backend и input contract.', 'Реализовал точное связывание с манифестом, lock-файл schema-v5, политики безопасного отказа и выбор исполнителя по пакету, целевой среде и входному контракту.'),
              ('Развиваю callable-first SSA: структурное ядро отделено от descriptor-driven semantics; folding разрешён только для trusted, pure и deterministic callables.', 'Развиваю SSA с явной семантикой вызовов: структурное ядро отделено от семантики дескрипторов; свёртка разрешена только для доверенных чистых детерминированных вызовов.'),
              ('Canonical gate от 25.07.2026: 1 465/1 465 тестов, 0 падений, 0 предупреждений и ошибок сборки; проверены 9 packages и clean consumers.', 'Контрольная проверка от 25.07.2026: 1 465/1 465 тестов, 0 падений, 0 предупреждений и ошибок сборки; проверены 9 пакетов и чистые проекты-потребители.'),
              ('Разработал общее графовое ядро и компоненты RPO/cycle detection, Dijkstra, Tarjan SCC и Dinic с едиными контрактами ввода и ошибок.', 'Разработал общее графовое ядро и алгоритмы RPO, поиска циклов, Дейкстры, Тарьяна SCC и Диница с едиными контрактами ввода и ошибок.'),
              ('Поддерживал CMake, warnings-as-errors, ASan/UBSan, clang-tidy, явные include-зависимости и воспроизводимые I/O-тесты.', 'Поддерживал CMake, обработку предупреждений как ошибок, ASan/UBSan, clang-tidy, явные зависимости по заголовкам и воспроизводимые тесты ввода-вывода.'),
              ('Пишу публичную документацию и технические материалы по compiler/runtime-проектам.', 'Пишу публичную документацию и технические материалы по компиляторам и средам исполнения.'),
              ('Языковая платформа, configuration-aware testing и program analysis.', 'Языковая платформа, тестирование с учётом конфигурации и анализ программ.'),
              ('Проекты показывают разные слои compiler engineering: композицию языков, проверку конфигураций, анализ зависимостей и backend/codegen.', 'Проекты показывают разные уровни разработки компиляторов: композицию языков, проверку конфигураций, анализ зависимостей и генерацию кода.'),
              ('.NET · typed language SDK · compiler/runtime', '.NET · SDK для языков · компиляторы и среды исполнения'),
              ('Платформа для типизированной композиции языков и сред исполнения. Wist — публичный facade для проверки ограниченных формул и компиляции одобренных выражений в typed delegates.', 'Платформа для типизированной композиции языков и сред исполнения. Wist — публичный интерфейс для проверки ограниченных формул и компиляции одобренных выражений в типизированные делегаты.'),
              ('<strong>Language plans:</strong> typed artifacts, cross-package routes, deterministic passes и exact backend executor.', '<strong>Планы языка:</strong> типизированные артефакты, межпакетные маршруты, детерминированные проходы и точный исполнитель.'),
              ('<strong>Runtime:</strong> per-session ownership, coordinated disposal, policy gates и manifest-backed package identity.', '<strong>Среда исполнения:</strong> управление ресурсами сеанса, согласованное освобождение, политики и идентичность пакетов по манифесту.'),
              ('<strong>SSA:</strong> callable descriptors с effects, determinism, trust и capability-checked lowering.', '<strong>SSA:</strong> дескрипторы вызовов с побочными эффектами, детерминизмом, уровнем доверия и проверкой возможностей при преобразовании.'),
              ('<strong>Продуктовый слой:</strong> Validate/Evaluate/Compile APIs, structured diagnostics и interpreter/CIL parity.', '<strong>Продуктовый слой:</strong> интерфейсы Validate/Evaluate/Compile, структурированная диагностика и одинаковое поведение интерпретатора и CIL.'),
              ('Compiler testing · research tooling', 'Тестирование компиляторов · исследовательские инструменты'),
              ('Language-neutral configuration-aware differential testing для программ, language-plan variants, backend и optimization routes.', 'Независимое от языка дифференциальное тестирование программ, вариантов языковых планов, целевых сред и маршрутов оптимизации с учётом конфигурации.'),
              ('Семь oracle families, typed observations и строгое разделение clean/confirmed/flaky/inconclusive/infrastructure.', 'Семь семейств оракулов, типизированные наблюдения и строгие категории результатов: подтверждённые, нестабильные, неопределённые и инфраструктурные.'),
              ('Fresh-process replay, exact fingerprints и воспроизводимые evidence artifacts.', 'Повторная проверка в новом процессе, точные отпечатки и воспроизводимые артефакты.'),
              ('Детерминированное program/plan reduction с повторным подтверждением исходного fingerprint.', 'Детерминированное сокращение программы и плана с повторным подтверждением исходного отпечатка.'),
              ('C17 · program analysis', 'C17 · анализ программ'),
              ('Точный oracle для малых областей и метаморфные проверки.', 'Точный оракул для малых областей и метаморфные проверки.'),
              ('Воспроизводимые WA/TL cases.', 'Воспроизводимые случаи неверного ответа и превышения лимита времени (WA/TL).'),
              ('Rust · x86-64 backend', 'Rust · бэкенд x86-64'),
              ('SSA-подобная IR, liveness/live intervals, linear scan и генерация x86-64 через iced-x86.', 'SSA-подобное IR, анализ живых интервалов, линейное сканирование и генерация x86-64 через iced-x86.'),
              ('Сравнение IR-интерпретатора и сгенерированного кода.', 'Сопоставление интерпретатора IR и сгенерированного кода.'),
              ('Изолированный runner с resource limits.', 'Изолированный запуск с ограничениями ресурсов.'),
              ('Метрики spills, loads/stores и code size.', 'Метрики выгрузок в память, загрузок и записей, а также размера кода.'),
              ('<strong>Language architecture</strong><p>Typed artifacts, contribution graphs, capabilities/conflicts, route planning, pass ordering, manifests и lock identity</p>', '<strong>Архитектура языков</strong><p>Типизированные артефакты, графы вкладов, возможности и конфликты, маршруты, порядок проходов, манифесты и lock-файлы</p>'),
              ('Bytecode/AIR, callable-first SSA, CFG, dominance, folding, SCCP-lite, unreachable cleanup и DCE', 'Байткод/AIR, SSA с семантикой вызовов, CFG, доминирование, свёртка, SCCP-lite, удаление недостижимого кода и DCE'),
              ('<strong>Verification</strong><p>Differential/metamorphic testing, exact oracles, fresh-process replay, reducers, structural verifiers и parity</p>', '<strong>Проверка корректности</strong><p>Дифференциальное и метаморфное тестирование, точные оракулы, повторное воспроизведение, сокращение примеров и структурные верификаторы</p>'),
              ('<strong>Runtime</strong><p>Interpreter/CIL, typed delegates, lifecycle ownership, fail-closed policies и package/runtime contracts</p>', '<strong>Среды исполнения</strong><p>Интерпретатор/CIL, типизированные делегаты, управление жизненным циклом, политики безопасного отказа и контракты пакетов</p>'),
              ('Ищу задачи в compiler/runtime, program analysis, compiler testing или language tooling.', 'Ищу задачи в разработке компиляторов и сред исполнения, анализе программ, тестировании компиляторов или инструментах для языков.'),
              ('Ищу стажировку или part-time работу в compiler/runtime и program analysis.', 'Ищу стажировку или работу с неполной занятостью в разработке компиляторов, сред исполнения и анализе программ.'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source text: {old!r}')
              text = text.replace(old, new)

          page_path.write_text(text, encoding='utf-8')

          data_path = Path('data/cv-print-profiles.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          profile = data['profiles']['ru-compiler.html']
          profile.update({
              'summary': 'Разрабатываю UniversalToolchain/Wist2 — SDK для типизированной сборки языков и сред исполнения: межпакетные планы, связывание с манифестом, SSA с явной семантикой вызовов (Callable-first SSA), интерфейс Wist и PlanFuzz.',
              'proofs': [
                  ['Планы типизированной композиции', 'межпакетные маршруты, проходы, возможности и точный исполнитель'],
                  ['SSA с семантикой вызовов', 'побочные эффекты, детерминизм и цикл под контролем верификатора'],
                  ['1 465 / 1 465', '0 падений; 9 пакетов и чистые проекты-потребители'],
              ],
              'experience': [
                  [
                      '2024 — сейчас',
                      'UniversalToolchain / Wist2',
                      [
                          'Типизированный SDK: независимые языковые пакеты, детерминированные маршруты, порядок проходов и lock-файл schema-v5.',
                          'Политики безопасного отказа, точное связывание с манифестом и управление жизненным циклом.',
                          'SSA с семантикой вызовов: побочные эффекты, детерминизм, уровень доверия и проверяемое обратное преобразование.',
                          'PlanFuzz: независимое от языка ядро, адаптеры Acme и Wist Int32, 7 семейств оракулов, воспроизведение и сокращение примеров.',
                      ],
                  ],
                  [
                      'Июль–август 2026',
                      'МЦСТ · LLVM-направление',
                      [
                          'Графовое ядро на C++23: RPO, поиск циклов, Дейкстра, Тарьян SCC и Диниц.',
                          'CMake, предупреждения как ошибки, ASan/UBSan, clang-tidy и тесты ввода-вывода.',
                      ],
                  ],
              ],
              'projects': [
                  ['PlanFuzz', 'Экспериментальное дифференциальное тестирование с учётом конфигурации: адаптеры Acme и Wist Int32, подтверждение в новом процессе и детерминированное сокращение программы и плана.'],
                  ['PS-form Analyzer', '1-е место из 49, 104/104; консервативный анализ зависимостей памяти и точный оракул.'],
                  ['x86-64 Codegen Lab', 'SSA-подобное IR, анализ живых интервалов, линейное сканирование, генерация через iced-x86 и дифференциальная проверка.'],
              ],
              'skills': [
                  ['Архитектура языков', 'типизированные артефакты, графы вкладов, маршруты, проходы, манифесты'],
                  ['IR / SSA', 'байткод/AIR, семантика вызовов, CFG, доминирование, свёртка, SCCP-lite, DCE'],
                  ['Проверка корректности', 'дифференциальные и метаморфные тесты, точные оракулы, воспроизведение, сокращение примеров'],
                  ['Языки', 'C#/.NET, C++23, C17, Python, Rust'],
              ],
          })
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Regenerate print source and PDFs
        run: |
          python tools/build_cv.py --write-html
          python tools/build_cv.py --check-html
          python tools/build_cv.py --render-dir pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
      - name: Remove one-shot workflow and rebuild manifest
        run: |
          rm .github/workflows/localize-ru-cv.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Validate final repository state
        run: |
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit generated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify Russian compiler CV language' || exit 0
          git push origin HEAD:chore/ru-cv-readability-2026-07-25
