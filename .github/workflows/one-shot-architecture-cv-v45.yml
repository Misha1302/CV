name: One-shot architecture CV v45 review fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-architecture-cv-v45.yml"

permissions:
  contents: write
  pages: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply post-render content review fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = Path("data/site.json")
          data = json.loads(site.read_text(encoding="utf-8"))
          if data.get("version") != 44:
              raise SystemExit(f"Expected v44 baseline, got {data.get('version')!r}")
          data["version"] = 45
          data["updated_at"] = "2026-08-25"

          data["profiles"]["general"]["ru"]["recognition"] = [
              ["2026", "UniversalToolchain — Балтийский научно-инженерный конкурс", "Диплом I степени и Главная премия «Совершенство как надежда» за UniversalToolchain."],
              ["2026", "НИЯУ МИФИ «Юниор»", "Диплом I степени, 96/100 за проект UniversalToolchain."],
          ]
          data["profiles"]["general"]["en"]["recognition"] = [
              ["2026", "UniversalToolchain — Baltic Science and Engineering Competition", "First-degree diploma and the Grand Prize “Perfection as Hope” for UniversalToolchain."],
              ["2026", "MEPhI Junior", "First-degree diploma, 96/100 for the UniversalToolchain project."],
          ]
          site.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          build = Path("tools/build_site.py")
          text = build.read_text(encoding="utf-8")
          replacements = [
              (
                  '<div class="landing-evidence"><span>1 465/1 465 тестов Wist2</span><span>1-е место из 49 · 104/104</span><span>.NET backend · LLVM · x86-64</span></div>',
                  '<div class="landing-evidence"><span>Typed contracts · exact runtime binding</span><span>State machines · idempotency · recovery</span><span>LLVM · SSA · x86-64</span></div>',
              ),
              (
                  'Основной профиль — универсальный Software Engineer. Специализированные версии меняют приоритет доказательств, но не противоречат друг другу.',
                  'Основной профиль — Software Engineer — Architecture & Platforms. Специализированные версии меняют приоритет доказательств, но не противоречат друг другу.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, got {count}: {old}")
              text = text.replace(old, new, 1)
          build.write_text(text, encoding="utf-8")
          PY
      - name: Rebuild HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content and rendered layout
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/build_site.py --check
          git diff --check
      - name: Finalize tree
        run: |
          rm -f .github/workflows/one-shot-architecture-cv-v45.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit final reviewed CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize architecture CV after rendered content review"
          git push
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = "legacy" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header "X-GitHub-Api-Version: 2022-11-28"
          else
            echo "GitHub Pages build type is '$build_type'; no legacy build request needed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-cv-v45-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
