name: Enlarge compiler portrait

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-enlarge-compiler-portrait.yml"

permissions:
  contents: write

jobs:
  enlarge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enlarge compiler portrait in canonical CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          style_path = Path('style.css')
          css = style_path.read_text(encoding='utf-8')

          replacements = {
              'grid-template-columns: minmax(0, 1fr) 172px;': 'grid-template-columns: minmax(0, 1fr) 224px;',
              '.profile-compiler .compiler-portrait {\n  margin: 4px 0 0;\n}': '.profile-compiler .compiler-portrait {\n  margin: 4px 0 0;\n  padding: 0;\n  border: 0;\n  border-radius: 0;\n  background: none;\n}',
              '  .profile-compiler .compiler-portrait {\n    width: 116px;\n    order: -1;\n  }': '  .profile-compiler .compiler-portrait {\n    width: 148px;\n    order: -1;\n  }',
          }
          for old, new in replacements.items():
              count = css.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one CSS anchor, got {count}: {old!r}')
              css = css.replace(old, new, 1)
          style_path.write_text(css, encoding='utf-8')

          data_path = Path('data/site.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = int(data.get('version', 0)) + 1
          data['updated_at'] = '2026-08-30'
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install validation and visual dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright
          python -m playwright install --with-deps chromium

      - name: Rebuild generated HTML
        run: python tools/build_site.py

      - name: Validate generated site
        run: python tools/validate_cv.py --pdf-dir pdf --skip-manifest --report /tmp/cv-validation.json

      - name: Capture intentional visual baseline
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual --update

      - name: Remove one-shot runner and rebuild manifest
        run: |
          rm -f .github/workflows/one-shot-enlarge-compiler-portrait.yml
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf

      - name: Commit enlarged portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: enlarge compiler portrait [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enlarged-compiler-portrait-evidence
          path: |
            /tmp/cv-validation.json
            /tmp/cv-visual
          if-no-files-found: warn
