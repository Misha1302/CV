name: Finish compiler identity refresh

on:
  push:
    branches:
      - refactor/compiler-identity-20260901
    paths:
      - ".github/workflows/hiring-refresh-apply.yml"

permissions:
  contents: write

concurrency:
  group: finish-compiler-identity-refresh
  cancel-in-progress: false

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply reviewed canonical migration
        run: |
          base64 -d tools/_hiring_refresh_payload.b64 | gzip -dc > /tmp/apply_hiring_refresh.py
          python -m py_compile /tmp/apply_hiring_refresh.py
          python /tmp/apply_hiring_refresh.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/validate_cv.py')
          text = path.read_text(encoding='utf-8')
          old = 'from build_site import ROOT, build_outputs, load_data, write_or_check'
          new = 'from build_site import ROOT, build_outputs, load_data, person_name, write_or_check'
          if old not in text:
              raise SystemExit('validator import anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm tools/_hiring_refresh_payload.b64
      - name: Remove obsolete generated PDFs
        run: |
          rm -f pdf/Mikhail_Razakov_Compiler_*.pdf
          rm -f pdf/Mikhail_Razakov_Quant_Research_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Generate site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, links, PDFs, and ATS extraction
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
      - name: Capture visual matrix
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update-if-missing
      - name: Deterministic clean rebuild
        run: |
          rm -rf /tmp/cv-clean-pdf /tmp/cv-clean-evidence /tmp/cv-visual-recheck
          python tools/build_site.py --check
          python tools/build_cv.py --output-dir /tmp/cv-clean-pdf --evidence-dir /tmp/cv-clean-evidence --report /tmp/cv-clean-pdf-report.json
          python tools/validate_cv.py --pdf-dir /tmp/cv-clean-pdf --compare-dir pdf --skip-manifest --report /tmp/cv-clean-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual-recheck
      - name: Validate final post-cleanup tree equivalence
        run: |
          mkdir -p /tmp/workflow-hold
          mv .github/workflows/hiring-refresh-apply.yml /tmp/workflow-hold/hiring-refresh-apply.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf --report /tmp/cv-final-validation.json
          git diff --check
          mv /tmp/workflow-hold/hiring-refresh-apply.yml .github/workflows/hiring-refresh-apply.yml
      - name: Commit validated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/hiring-refresh-apply.yml
          if git diff --cached --quiet; then
            echo "No source/generated changes to commit"
          else
            git commit -m "cv: unify compiler identity and targeted variants [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-identity-refresh-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-clean-pdf-report.json
            /tmp/cv-clean-validation.json
            /tmp/cv-final-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
            /tmp/cv-visual-recheck
          if-no-files-found: warn
