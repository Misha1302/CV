name: Refresh CV v31 manifest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wist2-cv-v31-strong-positioning
      - name: Rebuild recursive manifest from the final tree
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          temporary = '.github/workflows/refresh-v31-manifest.yml'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts:
                  continue
              rel = path.relative_to(root).as_posix()
              if rel == temporary:
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{rel}")
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/refresh-v31-manifest.yml
      - name: Verify the final manifest
        run: python tools/validate_cv.py --pdf-dir pdf
      - name: Commit clean manifest refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cv): rebuild v31 manifest after validator review"
          git push origin HEAD:feat/wist2-cv-v31-strong-positioning
