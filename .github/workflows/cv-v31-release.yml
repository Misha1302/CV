name: Build targeted CV v31

on:
  push:
    branches:
      - feat/wist2-cv-v31-strong-positioning
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wist2-cv-v31-strong-positioning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply strong Wist2 positioning and rebuild all PDFs
        run: python tools/cv_v31_release.py
      - name: Check source diff
        run: |
          git diff --check
          python tools/build_cv.py --check-html
          python tools/validate_cv.py
      - uses: actions/upload-artifact@v4
        with:
          name: cv-v31-review-evidence
          path: |
            /tmp/cv-v31-evidence
            QA-report-targeted-cv-v31.md
          if-no-files-found: error
      - name: Remove one-shot release machinery
        run: |
          rm -rf tools/.cv_v31_payload
          rm -f tools/cv_v31_release.py .github/workflows/cv-v31-release.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts:
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}")
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python tools/validate_cv.py
      - name: Commit clean v31 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cv): strengthen Wist2 positioning and rebuild targeted PDFs"
          git push origin HEAD:feat/wist2-cv-v31-strong-positioning
