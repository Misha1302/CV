name: Build targeted CV v31

on:
  pull_request:
    branches:
      - main

concurrency:
  group: cv-v31-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wist2-cv-v31-strong-positioning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply strong Wist2 positioning and rebuild all PDFs
        shell: bash
        run: |
          set -o pipefail
          python tools/cv_v31_release.py 2>&1 | tee /tmp/cv-v31-release.log
      - name: Check source diff
        run: |
          git diff --check
          python tools/build_cv.py --check-html
          python tools/validate_cv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-v31-review-evidence
          path: |
            /tmp/cv-v31-release.log
            /tmp/cv-v31-evidence
            QA-report-targeted-cv-v31.md
          if-no-files-found: warn
      - name: Remove payload and verify clean release
        run: |
          rm -rf tools/.cv_v31_payload
          rm -f tools/cv_v31_release.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          ignored = '.github/workflows/cv-v31-release.yml'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts:
                  continue
              if path.relative_to(root).as_posix() == ignored:
                  continue
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}")
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python tools/validate_cv.py
      - name: Commit clean v31 release
        id: release_commit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short
            git diff --stat
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git status --short
            git commit -m "feat(cv): strengthen Wist2 positioning and rebuild targeted PDFs"
            git push origin HEAD:feat/wist2-cv-v31-strong-positioning
          } 2>&1 | tee /tmp/cv-v31-commit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-v31-commit-diagnostics
          path: /tmp/cv-v31-commit.log
          if-no-files-found: error
      - name: Fail when release commit failed
        if: steps.release_commit.outcome != 'success'
        run: exit 1
