name: One-shot targeted CV v46 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-targeted-cv-v46.yml"

permissions:
  contents: write
  pages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply targeted profiles and layout guard
        run: |
          python tools/apply_targeted_cv_v46.py
          python tools/apply_targeted_cv_v46_layout.py
      - name: Rebuild HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-v46-pdf --report /tmp/cv-v46-pdf.json
      - name: Review targeted outputs
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-v46-validation.json
          python tools/build_site.py --check
          ! grep -E -i 'LangDev|1-е из 49|#1 of 49|104/104 official|104/104 официаль' ru-compiler.html en-compiler.html ru-backend.html en-backend.html
          git diff --check
      - name: Visual review gate
        run: python tools/visual_regression.py --output-dir /tmp/cv-v46-visual --update
      - name: Finalize tree
        run: |
          rm -f tools/apply_targeted_cv_v46.py tools/apply_targeted_cv_v46_layout.py .github/workflows/one-shot-targeted-cv-v46.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit targeted CV release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refocus compiler and backend CV profiles"
          git push
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = "legacy" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header "X-GitHub-Api-Version: 2022-11-28"
          else
            echo "GitHub Pages build type is '$build_type'; no legacy build request needed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-cv-v46-evidence
          path: |
            /tmp/cv-v46-pdf.json
            /tmp/cv-v46-validation.json
            /tmp/cv-v46-pdf
            /tmp/cv-v46-visual
          if-no-files-found: warn
