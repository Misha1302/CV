name: Update national achievement wording v28

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-export-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply achievement and release updates
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/update_achievements_v28.py > achievement-update.log 2>&1
          status=$?
          echo "$status" > achievement-update.status
          cat achievement-update.log
          exit "$status"

      - name: Upload achievement-update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-v28-achievement-update-log
          path: |
            achievement-update.log
            achievement-update.status
          retention-days: 7
          if-no-files-found: error

      - name: Stop after failed update
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Check out PDF exporter
        uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter

      - name: Install validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright pymupdf beautifulsoup4
          python3 -m playwright install --with-deps chromium

      - name: Export focused PDFs at scale 1.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          from playwright.sync_api import sync_playwright

          sys.path.insert(0, str(Path('.exporter').resolve()))
          import export_cv_html_to_pdf as helper

          mappings = {
              'ru-compiler.html': 'pdf/Mikhail_Razakov_Compiler_RU.pdf',
              'en-compiler.html': 'pdf/Mikhail_Razakov_Compiler_EN.pdf',
              'ru-cpp-systems.html': 'pdf/Mikhail_Razakov_CPP_Systems_RU.pdf',
              'en-cpp-systems.html': 'pdf/Mikhail_Razakov_CPP_Systems_EN.pdf',
          }
          with sync_playwright() as p:
              browser = helper.launch_browser(p, None)
              try:
                  for html, output in mappings.items():
                      page = browser.new_page(viewport={'width': 1440, 'height': 900}, color_scheme='light', reduced_motion='reduce')
                      page.set_default_timeout(60000)
                      page.emulate_media(media='print', color_scheme='light', reduced_motion='reduce')
                      helper.load_local_document(page, Path(html).resolve())
                      helper.wait_for_page_assets(page, 60000, False)
                      helper.prepare_document(page, f'https://misha1302.github.io/CV/{html}')
                      page.wait_for_timeout(200)
                      layout = page.evaluate('''() => {
                        const cv = document.querySelector('.print-cv');
                        if (!cv) throw new Error('print-cv missing');
                        const cr = cv.getBoundingClientRect();
                        const all = Array.from(cv.querySelectorAll('*'));
                        const sizes = all.map(el => parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);
                        let bottom = cr.top;
                        for (const el of all) bottom = Math.max(bottom, el.getBoundingClientRect().bottom);
                        return {clientHeight:cv.clientHeight,scrollHeight:cv.scrollHeight,clientWidth:cv.clientWidth,scrollWidth:cv.scrollWidth,minCssFontPx:Math.min(...sizes),usedRatio:(bottom-cr.top)/cr.height};
                      }''')
                      if layout['scrollHeight'] > layout['clientHeight'] + 2 or layout['scrollWidth'] > layout['clientWidth'] + 2:
                          raise RuntimeError(f'{html}: print overflow {layout}')
                      if layout['minCssFontPx'] < 10.0:
                          raise RuntimeError(f'{html}: CSS font below gate {layout}')
                      page.pdf(path=output,format='A4',print_background=True,display_header_footer=False,prefer_css_page_size=True,scale=1.0,margin={'top':'0','right':'0','bottom':'0','left':'0'},tagged=True,outline=True)
                      page.close()
              finally:
                  browser.close()
          PY

      - name: Validate HTML, PDFs and render evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import json
          import fitz
          from bs4 import BeautifulSoup

          html_files = sorted(Path('.').glob('*.html'))
          if len(html_files) != 17:
              raise RuntimeError(f'Expected 17 HTML files, found {len(html_files)}')
          ids_by_file = {}
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              soup = BeautifulSoup(text, 'html.parser')
              ids = [n.get('id') for n in soup.find_all(attrs={'id': True})]
              if len(ids) != len(set(ids)):
                  raise RuntimeError(f'{path}: duplicate ids')
              ids_by_file[path.name] = set(ids)
              for anchor in soup.select('a[target="_blank"]'):
                  if not {'noopener', 'noreferrer'} <= set(anchor.get('rel') or []):
                      raise RuntimeError(f'{path}: unsafe target=_blank')
              expected = '1-е место по итоговому баллу' if path.name.startswith('ru') else ('Top total score' if path.name.startswith('en') else None)
              if expected and expected not in text:
                  raise RuntimeError(f'{path}: updated achievement text missing')

          for path in html_files:
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              for node in soup.select('[href], [src]'):
                  raw = node.get('href') or node.get('src')
                  if not raw or raw.startswith(('http://','https://','mailto:','tel:','data:','javascript:')):
                      continue
                  parsed = urlparse(raw)
                  target = (path.parent / (unquote(parsed.path) or path.name)).resolve()
                  if not target.exists():
                      raise RuntimeError(f'{path}: missing local target {raw}')
                  if parsed.fragment:
                      html_name = target.name if target.suffix == '.html' else path.name
                      if parsed.fragment not in ids_by_file.get(html_name, set()):
                          raise RuntimeError(f'{path}: missing fragment {raw}')

          pdfs = sorted(Path('pdf').glob('*.pdf'))
          if len(pdfs) != 14:
              raise RuntimeError(f'Expected 14 role PDFs, found {len(pdfs)}')
          changed = {'Mikhail_Razakov_Compiler_RU.pdf','Mikhail_Razakov_Compiler_EN.pdf','Mikhail_Razakov_CPP_Systems_RU.pdf','Mikhail_Razakov_CPP_Systems_EN.pdf'}
          evidence = Path('v28-achievement-evidence'); evidence.mkdir(exist_ok=True)
          metrics = {}
          for path in pdfs:
              doc = fitz.open(path)
              if len(doc) != 1:
                  raise RuntimeError(f'{path}: expected one page, got {len(doc)}')
              page = doc[0]
              text = page.get_text('text')
              links = [x.get('uri') for x in page.get_links() if x.get('uri')]
              spans = [s for b in page.get_text('dict').get('blocks',[]) for l in b.get('lines',[]) for s in l.get('spans',[]) if s.get('text','').strip()]
              min_font = min(float(s['size']) for s in spans)
              if min_font < 7.5:
                  raise RuntimeError(f'{path}: font too small: {min_font}')
              if not links:
                  raise RuntimeError(f'{path}: links missing')
              if path.name in changed:
                  marker = '1-е место по итоговому баллу' if path.name.endswith('_RU.pdf') else '1st by total score'
                  if marker not in text:
                      raise RuntimeError(f'{path}: achievement marker missing')
                  page.get_pixmap(matrix=fitz.Matrix(2,2), alpha=False).save(evidence / f'{path.stem}.png')
              metrics[path.name] = {'pages':len(doc),'min_font_pt':round(min_font,2),'text_chars':len(text.strip()),'links':len(links)}
              doc.close()

          qa = Path('QA-report-targeted-cv-v28.md')
          with qa.open('a', encoding='utf-8') as f:
              f.write('\n## v28 focused-PDF validation\n\n```json\n')
              f.write(json.dumps({k:v for k,v in metrics.items() if k in changed}, ensure_ascii=False, indent=2))
              f.write('\n```\n\nAutomated v28 achievement/PDF verdict: PASS.\n')
          print(json.dumps(metrics, ensure_ascii=False, indent=2))
          PY

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: cv-v28-achievement-renders
          path: v28-achievement-evidence/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Commit clean release branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .exporter v28-achievement-evidence tools achievement-update.log achievement-update.status
          rm -f .github/workflows/update-achievements-v28.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type f ! -path './.git/*' ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Highlight first-place national competition results in CV v28'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
