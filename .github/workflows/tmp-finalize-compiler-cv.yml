name: Temporary compiler CV finalizer

on:
  push:
    branches:
      - "refactor/compiler-cv-evidence-2026-08-31"
    paths:
      - ".github/workflows/tmp-finalize-compiler-cv.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Align canonical PDF artifact names
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/site.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['profiles']['general']['ru']['pdf'] = 'Mikhail_Razakov_Compiler_Infrastructure_RU.pdf'
          data['profiles']['general']['en']['pdf'] = 'Mikhail_Razakov_Compiler_Infrastructure_EN.pdf'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm -f pdf/Mikhail_Razakov_Software_Engineer_RU.pdf pdf/Mikhail_Razakov_Software_Engineer_EN.pdf
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Build and validate final result
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Commit final generated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json index.html ru.html en.html ru-compiler.html en-compiler.html cases pdf MANIFEST.sha256 sitemap.xml robots.txt
          git add -u
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Align compiler infrastructure CV artifact names [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-cv-finalizer-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
