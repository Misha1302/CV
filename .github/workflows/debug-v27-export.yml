name: Debug v27 export

on:
  push:
    branches:
      - fix/readable-cv-v27
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/rebuild_cv_v27.py
      - uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter
      - run: |
          python3 -m pip install --disable-pip-version-check playwright pymupdf
          python3 -m playwright install --with-deps chromium
      - name: Capture layout diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee debug-v27.log
          from pathlib import Path
          import sys, json, traceback
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path('.exporter').resolve()))
          import export_cv_html_to_pdf as helper

          pages = ['ru-compiler.html','en-compiler.html','ru-cpp-systems.html','en-cpp-systems.html']
          out = Path('debug-v27')
          out.mkdir(exist_ok=True)
          diagnostics = {}
          failed = False
          with sync_playwright() as p:
              browser = helper.launch_browser(p, None)
              try:
                  for html in pages:
                      page = browser.new_page(viewport={'width':1440,'height':900}, color_scheme='light', reduced_motion='reduce')
                      page.emulate_media(media='print', color_scheme='light', reduced_motion='reduce')
                      helper.load_local_document(page, Path(html).resolve())
                      helper.wait_for_page_assets(page, 60000, False)
                      helper.prepare_document(page, f'https://misha1302.github.io/CV/{html}')
                      page.wait_for_timeout(200)
                      data = page.evaluate('''() => {
                        const cv = document.querySelector('.print-cv');
                        const cr = cv.getBoundingClientRect();
                        const all = Array.from(cv.querySelectorAll('*'));
                        const sizes = all.map(el => ({tag:el.tagName, cls:el.className, text:(el.textContent||'').trim().slice(0,80), px:parseFloat(getComputedStyle(el).fontSize)})).filter(x=>Number.isFinite(x.px)).sort((a,b)=>a.px-b.px);
                        let maxBottom = cr.top, offender = null;
                        for (const el of all) {
                          const r = el.getBoundingClientRect();
                          if (r.bottom > maxBottom) { maxBottom = r.bottom; offender = {tag:el.tagName, cls:el.className, text:(el.textContent||'').trim().slice(0,160), top:r.top, bottom:r.bottom}; }
                        }
                        return {clientHeight:cv.clientHeight,scrollHeight:cv.scrollHeight,clientWidth:cv.clientWidth,scrollWidth:cv.scrollWidth,rect:{top:cr.top,bottom:cr.bottom,width:cr.width,height:cr.height},contentBottom:maxBottom,overflowBottom:maxBottom-cr.bottom,minFonts:sizes.slice(0,15),offender};
                      }''')
                      diagnostics[html] = data
                      print(html, json.dumps(data, ensure_ascii=False, indent=2), flush=True)
                      page.screenshot(path=str(out / f'{Path(html).stem}.png'), full_page=True, animations='disabled')
                      if data['scrollHeight'] > data['clientHeight'] + 2 or data['scrollWidth'] > data['clientWidth'] + 2 or data['minFonts'][0]['px'] < 10.0:
                          failed = True
                      page.close()
              finally:
                  browser.close()
          (out/'diagnostics.json').write_text(json.dumps(diagnostics,ensure_ascii=False,indent=2),encoding='utf-8')
          if failed:
              raise SystemExit('layout gate failed; see diagnostics artifact')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-v27-export
          path: |
            debug-v27.log
            debug-v27/*
          retention-days: 7
          if-no-files-found: error
