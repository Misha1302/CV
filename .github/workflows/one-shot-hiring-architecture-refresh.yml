              'show_portrait': True,
              'portrait_asset': 'assets/portrait.jpg',
              'print_project_limit': 3,
          })

          # Remove claims that public evidence supports only as deployment tooling, not as proof of a live production deployment.
          data['projects']['vpn']['result_ru'] = 'State/recovery path с контролируемыми переходами, backup/restore, health checks и rollback; публичный разбор не раскрывает секреты и пользовательские данные.'
          data['projects']['vpn']['result_en'] = 'State/recovery paths with controlled transitions, backup/restore, health checks, and rollback; the public case study excludes secrets and user data.'
          data['projects']['wist']['result_ru'] = 'План фиксируется до запуска, а runtime создаёт выбранные компоненты без повторного разрешения зависимостей; канонический test contract сейчас фиксирует 1 306 успешных тестов.'
          data['projects']['wist']['result_en'] = 'The plan is fixed before execution and runtime materializes selected components without resolving dependencies again; the canonical test contract currently records 1,306 passing tests.'
          data['projects']['globaliv']['result_ru'] = 'Консервативный LLVM 22 prototype с реальным IR transform; 29/29 regression cases покрывают успешные преобразования и отказ на неподдерживаемом IR, LLVM Verifier, повторный запуск pass и before/after execution.'
          data['projects']['globaliv']['result_en'] = 'A conservative LLVM 22 prototype with an actual IR transform; 29/29 regression cases cover successful transforms and unsupported-IR rejection, LLVM Verifier checks, a second pass run, and before/after execution.'

          redirects = data.setdefault('redirects', {})
          redirects.update({
              'ru-compiler.html': 'ru.html',
              'en-compiler.html': 'en.html',
              'ru-devtools.html': 'ru.html#work',
              'en-devtools.html': 'en.html#work',
              'ru-algorithms.html': 'ru-cpp-systems.html#work',
              'en-algorithms.html': 'en-cpp-systems.html#work',
              'ru-edtech.html': 'ru-backend.html#work',
              'en-edtech.html': 'en-backend.html#work',
              'ru-platform.html': 'ru-backend.html',
              'en-platform.html': 'en-backend.html',
          })
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          build_path = root / 'tools' / 'build_site.py'
          build = build_path.read_text(encoding='utf-8')
          # All profile pages now use the same CV-first layout; content, not chrome, carries specialization.
          profile_re = re.compile(r'def profile_page\(data: dict\[str, Any\], profile_key: str, lang: str\) -> str:\n.*?(?=\ndef landing_page)', re.S)
          profile_fn = '''def profile_page(data: dict[str, Any], profile_key: str, lang: str) -> str:\n    profile = data["profiles"][profile_key][lang]\n    head = common_head(data, lang, profile["filename"], profile["title"], profile["description"], profile["role"])\n    footer_label = "Обновлено" if lang == "ru" else "Updated"\n    main_content = f"{compiler_hero(data, lang, profile)}{experience_section(lang, profile, compact=True)}{compiler_projects_section(data, lang, profile)}{skills_section(lang, profile, compact=True)}{recognition_section(data, lang, profile, compact=True)}{education_section(data, lang)}{contact_section(data, lang, profile)}"\n    return f"""{head}\n<body class="profile-{esc(profile_key)}">{print_cv(data, lang, profile)}{header(data, lang, profile)}<main id="main">{main_content}</main><footer class="shell site-footer"><span>{esc(person_name(data, lang))} · {esc(profile['footer'])}</span><span>{footer_label} {esc(data['updated_at'])}</span></footer><script src="script.js?v={esc(data['version'])}" defer></script></body></html>\n"""\n\n'''
          build, n = profile_re.subn(profile_fn, build)
          if n != 1:
              raise RuntimeError(f'profile_page replacement count={n}')

          landing_re = re.compile(r'def landing_page\(data: dict\[str, Any\]\) -> str:\n.*?(?=\ndef case_page)', re.S)
          landing_fn = '''def landing_page(data: dict[str, Any]) -> str:\n    lang = "ru"\n    profile = data["profiles"]["general"][lang]\n    head = common_head(data, lang, "index.html", profile["title"], profile["description"], profile["role"], data["site_url"])\n    specializations = []\n    for key in ("backend", "systems", "quant"):\n        item = data["profiles"][key][lang]\n        label = data["profile_ui"][key]["label_ru"]\n        specializations.append(f'<a href="{esc(item["filename"])}">{esc(label)}</a>')\n    specialization_block = f'''<section class="shell section compact-section" id="specializations"><div class="section-heading"><p class="section-label">Целевые версии</p><div><h2>Для точечных откликов</h2><p class="section-intro">Основная специализация остаётся compiler/program analysis. Дополнительные версии меняют порядок доказательств, а не профессиональную биографию.</p><div class="project-links">{"".join(specializations)}</div></div></div></section>'''\n    main_content = f"{compiler_hero(data, lang, profile)}{experience_section(lang, profile, compact=True)}{compiler_projects_section(data, lang, profile)}{skills_section(lang, profile, compact=True)}{recognition_section(data, lang, profile, compact=True)}{education_section(data, lang)}{specialization_block}{contact_section(data, lang, profile)}"\n    return f"""{head}\n<body class="profile-general public-home">{header(data, lang, profile)}<main id="main">{main_content}</main><footer class="shell site-footer"><span>{esc(person_name(data, lang))} · {esc(profile['footer'])}</span><span>Обновлено {esc(data['updated_at'])}</span></footer><script src="script.js?v={esc(data['version'])}" defer></script></body></html>\n"""\n\n'''
          build, n = landing_re.subn(landing_fn, build)
          if n != 1:
              raise RuntimeError(f'landing_page replacement count={n}')

          # Navigation should be document-first, not a profile marketplace.
          build = re.sub(r'\n    if profile\["filename"\] in \{"ru-compiler\.html", "en-compiler\.html"\}:\n        nav_labels\.pop\("contact", None\)\n', '\n    nav_labels.pop("contact", None)\n', build, count=1)
          build = re.sub(r'\n    is_compiler_profile = profile\["filename"\] in \{"ru-compiler\.html", "en-compiler\.html"\}\n    mobile_profiles = "" if is_compiler_profile else ""\.join\(f\'<a href="\{esc\(url\)\}">\{esc\(label\)\}</a>\' for label, url in profile_links\(data, lang\)\)\n', '\n    mobile_profiles = ""\n', build, count=1)
          build = build.replace('is_compiler_print = profile["filename"] in {"ru-compiler.html", "en-compiler.html"}', 'is_compiler_print = profile["filename"] in {"ru.html", "en.html"}')
          build = build.replace('proof_block = "" if is_compiler_print else f\'<div class="pcv-proofs">{proofs}</div>\'', 'proof_block = ""')
          build = build.replace('summary = project_summaries.get(project_id, {}) if is_compiler_print else {}', 'summary = project_summaries.get(project_id, {})')
          build = build.replace('if is_compiler_print and summary:', 'if summary:')
          # Numbered section labels read like a landing-page template; the headings already provide hierarchy.
          for old in ('01 · ', '02 · ', '03 · ', '04 · ', '05 · '):
              build = build.replace(old, '')
          build_path.write_text(build, encoding='utf-8')

          css_path = root / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.profile-compiler', ':is(.profile-general, .profile-backend, .profile-systems, .profile-quant)')
          css = css.replace('position: sticky; top: 0; z-index: 50;', 'position: relative; z-index: 50;')
          css = css.replace('background: rgba(15, 12, 13, .92); backdrop-filter: blur(16px);', 'background: var(--bg);')
          css = css.replace('font-size: 8.5pt;\n    line-height: 1.32;', 'font-size: 9pt;\n    line-height: 1.32;')
          css = css.replace('font-size: 8.45pt;\n    line-height: 1.31;', 'font-size: 8.9pt;\n    line-height: 1.31;')
          css_path.write_text(css, encoding='utf-8')

          cv_path = root / 'tools' / 'build_cv.py'
          cv = cv_path.read_text(encoding='utf-8').replace('min(sizes) < 6.8', 'min(sizes) < 7.8')
          cv_path.write_text(cv, encoding='utf-8')

          visual_path = root / 'tools' / 'visual_regression.py'
          visual = visual_path.read_text(encoding='utf-8')
          defs_re = re.compile(r'REGRESSION_CASES = \[.*?\]\nVIEW_MODES = \[.*?\]\n', re.S)
          defs = '''REGRESSION_CASES = [\n    ("index.html", "desktop", 1440, 1100, True),\n    ("ru.html", "desktop", 1440, 1100, True),\n    ("ru-backend.html", "desktop", 1440, 1100, True),\n    ("ru-cpp-systems.html", "desktop", 1440, 1100, True),\n    ("index.html", "mobile", 390, 844, True),\n    ("ru.html", "mobile", 390, 844, True),\n    ("ru-backend.html", "mobile", 390, 844, True),\n    ("ru-cpp-systems.html", "mobile", 390, 844, True),\n    ("ru.html", "no-js", 1440, 1100, False),\n    ("ru-backend.html", "no-js", 390, 844, False),\n]\nVIEW_MODES = [\n    ("desktop", 1440, 1100, True),\n    ("laptop", 1024, 900, True),\n    ("tablet", 768, 900, True),\n    ("mobile", 390, 844, True),\n    ("no-js", 390, 844, False),\n]\n'''
          visual, n = defs_re.subn(defs, visual)
          if n != 1:
              raise RuntimeError(f'visual matrix replacement count={n}')
          visual_path.write_text(visual, encoding='utf-8')

          readme = '''# CV site — generated, role-specific, verifiable\n\nThis repository publishes Mikhail Razakov's CV site and targeted PDF variants.\n\n## Canonical source\n\nAll public profile content lives in `data/site.json`. Generated HTML and PDF files must not be edited manually.\n\nThe generator produces RU/EN profile pages, the public landing page, project case studies, compatibility redirects, metadata, Open Graph/JSON-LD, sitemap/robots, and one-page role-specific PDFs.\n\n## Profile architecture\n\nThe public root has one professional identity: **Compiler Engineer** — LLVM · Program Analysis · Compiler / Language Infrastructure.\n\nDirect-link variants exist for targeted applications:\n\n1. `.NET Backend Engineer`\n2. `C++ / Compiler Systems & Program Analysis`\n3. `Quantitative Developer / Research Software`\n\nThese variants reorder evidence but keep the same professional history. Personal projects are rendered under Projects, never as employers. Older compiler URLs redirect to the public Compiler Engineer CV.\n\n## Local build\n\n```bash\npython -m pip install beautifulsoup4 pymupdf pillow playwright weasyprint\npython tools/build_site.py\npython tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence\npython tools/build_site.py --manifest\npython tools/validate_cv.py --pdf-dir pdf\n```\n\nFor browser layout and screenshot regression:\n\n```bash\npython -m playwright install chromium\npython tools/visual_regression.py --output-dir /tmp/cv-visual\n```\n\nThe visual matrix covers 1440, 1024, 768, and 390 px layouts plus JavaScript-disabled smoke checks.\n\n## Validation contracts\n\nThe checks enforce single-source generation, metadata/role parity, language separation, internal/external links, local portrait assets, one-page A4 PDFs with text layers and links, deterministic rebuilds, browser overflow checks, and recursive SHA-256 manifest integrity.\n'''
          (root / 'README.md').write_text(readme, encoding='utf-8')

          targeting = '''# Targeting guide — v57\n\n## Public default\n\n`Compiler Engineer` — LLVM · Program Analysis · Compiler / Language Infrastructure.\n\nUse this version by default for compiler, LLVM, static/program-analysis, language-infrastructure, and closely adjacent developer-tooling applications.\n\n## Direct-link variants\n\n- `.NET Backend Engineer` — when C#/ASP.NET Core and stateful backend work are central. Professional Experience remains ISP RAS + MCST; CompilationLabLMS, VpnMediator, and UniversalToolchain remain Projects.\n- `C++ / Compiler Systems & Program Analysis` — C++/LLVM/compiler-tooling applications. It does not claim generic kernel/networking/distributed-systems experience.\n- `Quantitative Developer / Research Software` — engineering-heavy research/quant infrastructure. It does not claim statistical finance, signals, forecasting, or portfolio-research experience.\n\nAll variants share one career story and differ only in evidence ordering and project selection.\n'''
          (root / 'TARGETING.md').write_text(targeting, encoding='utf-8')

          release = '''# CV site release metadata\n\n- Schema/content version: 57\n- Content source: `data/site.json`\n- Updated: 2026-09-01\n- Canonical profiles: general, backend, systems, quant\n- Public default: Compiler Engineer\n- Generated pages: RU/EN profiles, project case studies, compatibility redirects\n- Generated PDFs: eight one-page A4 role/language variants\n- Visual validation: 1440, 1024, 768, 390 px plus JavaScript-disabled smoke checks\n- Integrity: recursive `MANIFEST.sha256`\n\nHTML, metadata, print blocks, and PDF text are generated from the same canonical data source.\n'''
          (root / 'RELEASE-METADATA.md').write_text(release, encoding='utf-8')

          audit = '''# Hiring / claim audit — 2026-09-01\n\n## CONFIRMED\n\n- UniversalToolchain canonical `eng/test-counts.json`: `totalPassed = 1306`.\n- LLVM Interprocedural Global IV Optimization: CI regression contract records `passed=29 failed=0 warnings=0`; README explicitly describes it as a conservative prototype/MVP, not production LLVM infrastructure.\n- DerefAfterNullAnalyzer: Roslyn `ControlFlowGraph`, conditional edge states, loops/back edges, joins, and fixed-point iteration are documented in the public repository.\n- x86-64 Codegen & Register Allocation Playground: educational backend with SSA/CFG validation, liveness/interference, register-allocation verification, SysV x86-64 emission, and differential execution; repository explicitly says it is not production-ready.\n- PS-form Memory Dependence Analyzer: contest/research implementation with conservative yes/no/maybe semantics and an exact small-domain oracle; repository records 104/104 official tests and 5.0/5.0.\n- VpnMediator public mirror documents payment state machines, idempotency, outbox/audit trail, recovery workers, backup/restore, versioned deployment, health checks, and rollback.\n- CompilationLabLMS README documents a working MVP, YooKassa re-verification/reconciliation, ledger/idempotency, and deployment contracts while explicitly distinguishing those contracts from real production readiness.\n\n## SUPPORTED BUT STRONG\n\n- LangDev'26 acceptance is stated in the candidate's public announcement; the official conference site confirms the Oct 8–9 dates but its public program/speaker list was not yet populated during this audit. The CV keeps the acceptance claim but does not infer broader conference status.\n- ISP RAS / SharpChecker and MCST role labels are retained from the canonical CV history; no additional confidential responsibility is invented.\n\n## NEEDS VERIFICATION\n\n- Any future claim about production users, traffic, revenue, measured performance gains, or finance/statistics research requires new evidence before publication.\n\n## OVERCLAIM removed or softened\n\n- `Quantitative Research` -> `Quantitative Developer / Research Software`.\n- `.NET Backend / Platform Engineer` -> `.NET Backend Engineer`.\n- `C++ / LLVM Systems Engineer` -> `C++ / Compiler Systems & Program Analysis`.\n- VpnMediator `Production service` wording -> evidence-backed state/recovery and deployment-tooling wording.\n- SharpChecker `industrial platform` adjective removed where no public source was required to support it.\n\n## MISLEADING structure removed\n\n- CompilationLabLMS, VpnMediator, UniversalToolchain, PS-form, and codegen are no longer listed as Professional Experience. All profiles use ISP RAS and MCST as Professional Experience and keep independent work under Selected Projects.\n- The duplicate `general` / `compiler` personas are merged into one public Compiler Engineer profile; old compiler URLs redirect to it.\n'''
          (root / 'HIRING-AUDIT-2026-09-01.md').write_text(audit, encoding='utf-8')
          PY
      - name: Remove obsolete generated PDFs
        run: |
          rm -f pdf/Mikhail_Razakov_Quant_Research_RU.pdf pdf/Mikhail_Razakov_Quant_Research_EN.pdf
          rm -f pdf/Mikhail_Razakov_Compiler_RU.pdf pdf/Mikhail_Razakov_Compiler_EN.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, live links, and ATS text
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
      - name: Update expected visual baseline for redesign
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/visual_regression.py --output-dir /tmp/cv-visual-recheck
      - name: Deterministic clean rebuild
        run: |
          python tools/build_site.py --check
          rm -rf /tmp/cv-clean
          python tools/build_cv.py --output-dir /tmp/cv-clean --report /tmp/cv-clean-pdf-report.json
          python tools/validate_cv.py --pdf-dir /tmp/cv-clean --compare-dir pdf --skip-manifest --report /tmp/cv-clean-validation.json
          python tools/build_site.py --check
      - name: Remove one-shot workflow before manifest
        run: |
          rm -f .github/workflows/one-shot-hiring-architecture-refresh.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Final manifest and validation
        run: |
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf --report /tmp/cv-final-validation.json
          git diff --check
          git status --short
      - name: Commit validated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cv: make Compiler Engineer the public identity"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hiring-architecture-refresh-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-clean-pdf-report.json
            /tmp/cv-clean-validation.json
            /tmp/cv-final-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
            /tmp/cv-visual-recheck
          if-no-files-found: warn
