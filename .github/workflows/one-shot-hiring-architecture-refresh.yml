              'show_portrait': True,
              'portrait_asset': 'assets/portrait.jpg',
              'print_project_limit': 3,
          })
          quant['en'].update({
              'filename': 'en-quant.html',
              'pdf': 'Mikhail_Razakov_Quant_Developer_EN.pdf',
              'title': 'Mikhail Razakov — Quantitative Developer / Research Software',
              'role': 'Quantitative Developer / Research Software',
              'brand': 'C++ · Python · algorithms · reproducible experiments',
              'eyebrow': 'C++23 · Python · algorithms · experimental tooling',
              'summary': 'A research-software profile built on C++/Python, algorithms, and compiler/program-analysis engineering. Professional experience comes from LLVM work at MCST and static analysis at ISP RAS; independent projects add exact small-domain oracles, generative tests, reproducible harnesses, and low-level code generation. This version targets engineering-heavy quantitative development and research infrastructure.',
              'description': 'Mikhail Razakov — Quantitative Developer / Research Software: C++, Python, algorithms, reproducible experiments, program analysis, and low-level tooling.',
              'proofs': [
                  ['Algorithms', 'A strong competitive-programming background plus practical implementation of graph and analysis algorithms.'],
                  ['Research software', 'Exact small-domain oracles, randomized/metamorphic tests, and reproducible harnesses.'],
                  ['Low-level engineering', 'C++23, LLVM, program analysis, and x86-64 code generation.'],
              ],
              'experience': common_en_experience,
              'project_ids': ['psform', 'codegen', 'wist'],
              'skills': [
                  ['Programming', 'C++23, Python, C17, C#, Rust'],
                  ['Algorithms & analysis', 'graph algorithms, data structures, program analysis, CFG/SSA, compiler optimizations'],
                  ['Experimental tooling', 'exact small-domain oracles, differential/metamorphic/randomized tests, reproducible Python harnesses'],
                  ['Low-level', 'LLVM, x86-64, code generation, register allocation, Linux, CMake'],
              ],
              'contact_heading': 'Quantitative Developer · Research Software Engineer',
              'footer': 'Quantitative Developer / Research Software',
              'project_summaries': {
                  'psform': systems['en']['project_summaries']['psform'],
