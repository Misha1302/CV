name: Compiler CV v30 source diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'fix/compiler-cv-v30-final-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source hardening with full log
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tools/harden_compiler_cv_v30.py > compiler-v30-source.log 2>&1
          status=$?
          cat compiler-v30-source.log
          echo "$status" > compiler-v30-source.status
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-v30-source-diagnostic
          path: |
            compiler-v30-source.log
            compiler-v30-source.status
          retention-days: 7
          if-no-files-found: error
      - name: Fail when source hardening failed
        if: steps.source.outcome == 'failure'
        run: exit 1
