name: Restore recognition 2026-08-29

on:
  push:
    branches:
      - cv/restore-recognition

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply recognition update
        run: |
          python tools/_restore_recognition_20260829.py
          python -m json.tool data/site.json >/dev/null
      - name: Build and validate
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --update --output-dir /tmp/cv-visual
          python tools/visual_regression.py --output-dir /tmp/cv-visual-verify
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf --check-external --report /tmp/cv-validation.json
          python tools/build_site.py --check
          grep -q 'НИЯУ МИФИ «Юниор»' ru-compiler.html
          grep -q 'Высшая проба' ru-compiler.html
          grep -q "LangDev'26" ru-compiler.html
          grep -q 'MEPhI Junior' en-compiler.html
          grep -q 'Vysshaya Proba' en-compiler.html
          grep -q "LangDev'26" en-compiler.html
          python - <<'PY'
          import fitz
          from pathlib import Path
          for name in (
              'Mikhail_Razakov_Software_Engineer_RU.pdf',
              'Mikhail_Razakov_Software_Engineer_EN.pdf',
              'Mikhail_Razakov_Compiler_RU.pdf',
              'Mikhail_Razakov_Compiler_EN.pdf',
          ):
              doc = fitz.open(Path('pdf') / name)
              print(name, doc.page_count)
              if doc.page_count != 1:
                  raise SystemExit(f'{name}: expected one page')
          PY
          git diff --check
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recognition-visual-evidence
          path: |
            /tmp/cv-visual
            /tmp/cv-visual-verify
            /tmp/cv-pdf-evidence
            pdf/Mikhail_Razakov_Compiler_RU.pdf
            pdf/Mikhail_Razakov_Compiler_EN.pdf
          if-no-files-found: error
      - name: Commit validated result
        run: |
          rm -f tools/_restore_recognition_20260829.py .github/workflows/restore-recognition-20260829.yml
          git add -A
          git diff --cached --check
          git config user.name 'Misha1302'
          git config user.email 'misha13022008@gmail.com'
          git commit -m 'cv: restore selected achievements and LangDev talk'
          git push origin HEAD:cv/restore-recognition
