name: One-shot anti-AI compiler CV redesign

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-anti-ai-compiler-redesign.yml"

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical redesign
        run: python tools/one_shot_anti_ai_patch.py

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Rebuild site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate content and generated artifacts
        run: python tools/validate_cv.py --pdf-dir pdf --skip-manifest --report /tmp/cv-validation.json

      - name: Capture redesigned visual baseline
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual --update

      - name: Build manifest and final validation
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
          python -m py_compile tools/build_site.py

      - name: Commit redesign and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No redesign changes to commit"
            exit 1
          fi
          git commit -m "cv: redesign compiler profile as engineer-first CV [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anti-ai-compiler-redesign-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
