name: One-shot anti-AI compiler CV redesign

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-anti-ai-compiler-redesign.yml"

permissions:
  contents: write

env:
  PATCH_MARKER: "anti-ai compiler redesign v51"

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # 1) Human-readable compiler profile copy; keep facts and evidence unchanged.
          data_path = root / 'data' / 'site.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          data['version'] = max(int(data.get('version', 0)) + 1, 51)
          data['updated_at'] = '2026-08-30'

          compiler_ru = data['profiles']['compiler']['ru']
          compiler_en = data['profiles']['compiler']['en']
          compiler_ru['summary'] = (
              'Работаю с LLVM и статическим анализом. В МЦСТ реализовывал LLVM optimization passes '
              'и межпроцедурный анализ; сейчас работаю над SharpChecker в ИСП РАН. '
              'В собственных проектах занимаюсь CFG/data-flow analysis, LLVM IR и code generation.'
          )
          compiler_en['summary'] = (
              'I work on LLVM and static analysis. At MCST I implemented LLVM optimization passes '
              'and interprocedural analysis; I now work on SharpChecker at ISP RAS. '
              'My independent projects cover CFG/data-flow analysis, LLVM IR, and code generation.'
          )
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 2) Give the compiler profile its own CV-first hero without SaaS proof/CTA blocks.
          build_path = root / 'tools' / 'build_site.py'
          source = build_path.read_text(encoding='utf-8')
          function_marker = 'def compiler_hero(data: dict[str, Any], lang: str, profile: dict[str, Any]) -> str:'
          if function_marker not in source:
              insert_at = source.index('\n\ndef proof_strip')
              compiler_hero = r'''

def compiler_hero(data: dict[str, Any], lang: str, profile: dict[str, Any]) -> str:
    person = data["person"]
    location = person[f"location_{lang}"]
    education = person[f"education_{lang}"]
    pdf_label = "PDF" if lang == "en" else "PDF"
    return f"""
<section class="shell compiler-intro" id="top">
  <div class="compiler-intro-copy">
    <h1>{esc(person_name(data, lang))}</h1>
    <p class="hero-role">{esc(profile['role'])}</p>
    <p class="compiler-summary">{esc(profile['summary'])}</p>
    <div class="compiler-meta"><span>{esc(location)}</span><span>{esc(education)}</span></div>
    <div class="compiler-links">
      <a href="mailto:{esc(person['email'])}">{esc(person['email'])}</a>
      <a href="{esc(person['telegram'])}" rel="noopener noreferrer" target="_blank">Telegram</a>
      <a href="{esc(person['github'])}" rel="noopener noreferrer" target="_blank">GitHub</a>
      <a href="{esc(person['linkedin'])}" rel="noopener noreferrer" target="_blank">LinkedIn</a>
      <a href="pdf/{esc(profile['pdf'])}" download>{pdf_label}</a>
    </div>
  </div>
  <aside class="compiler-portrait" aria-label="{'Фотография' if lang == 'ru' else 'Portrait'}">
    <img src="{esc(profile.get('portrait_asset', 'assets/portrait.svg'))}" alt="{esc(person_name(data, lang))}" width="460" height="460">
  </aside>
</section>"""
'''
              source = source[:insert_at] + compiler_hero + source[insert_at:]

          # Compiler navigation should not point at the removed sales-style contact panel.
          header_start = source.index('def header(')
          header_anchor = '    other = other_language(lang)\n'
          header_pos = source.index(header_anchor, header_start)
          header_patch = '    if profile["filename"] in {"ru-compiler.html", "en-compiler.html"}:\n        nav_labels.pop("contact", None)\n'
          if header_patch not in source[header_start:source.index('def action_links', header_start)]:
              source = source[:header_pos] + header_patch + source[header_pos:]

          old_compiler_page = 'main_content = f"{hero(data, lang, profile, compact=True)}{experience_section(lang, profile, compact=True)}{compiler_projects_section(data, lang, profile)}{skills_section(lang, profile, compact=True)}{recognition_section(data, lang, profile, compact=True)}{education_section(data, lang)}{contact_section(data, lang, profile)}"'
          new_compiler_page = 'main_content = f"{compiler_hero(data, lang, profile)}{experience_section(lang, profile, compact=True)}{compiler_projects_section(data, lang, profile)}{skills_section(lang, profile, compact=True)}{recognition_section(data, lang, profile, compact=True)}{education_section(data, lang)}"'
          if old_compiler_page in source:
              source = source.replace(old_compiler_page, new_compiler_page, 1)
          elif new_compiler_page not in source:
              raise RuntimeError('compiler profile composition anchor not found')

          build_path.write_text(source, encoding='utf-8')

          # 3) Compiler-only visual grammar: flat CV, asymmetric project hierarchy, no SaaS glow/blur/cards.
          css_path = root / 'style.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* anti-ai compiler redesign v51 */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n\n'
          css += r'''/* anti-ai compiler redesign v51 */
body.profile-compiler::before {
  background: none;
}
.profile-compiler .site-header {
  position: static;
  background: var(--bg);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
.profile-compiler .header-inner {
  min-height: 60px;
}
.profile-compiler .brand {
  min-width: 0;
}
.profile-compiler .brand-mark,
.profile-compiler .brand-copy span,
.profile-compiler .header-actions > .button.compact {
  display: none;
}
.profile-compiler .brand-copy strong {
  font-size: 13px;
  font-weight: 700;
}
.profile-compiler .primary-nav {
  justify-content: flex-end;
  gap: 20px;
}
.profile-compiler .primary-nav a {
  font-size: 12.5px;
}
.profile-compiler .compiler-intro {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 172px;
  gap: clamp(34px, 6vw, 72px);
  align-items: start;
  padding: 58px 0 48px;
  border-bottom: 1px solid var(--border);
}
.profile-compiler .compiler-intro-copy {
  max-width: 790px;
}
.profile-compiler .compiler-intro h1 {
  margin: 0;
  font-size: clamp(44px, 5.4vw, 64px);
  line-height: 1;
  letter-spacing: -.045em;
}
.profile-compiler .compiler-intro .hero-role {
  margin: 14px 0 0;
  font-size: clamp(21px, 2.2vw, 27px);
  line-height: 1.2;
  letter-spacing: -.025em;
  font-weight: 560;
}
.profile-compiler .compiler-summary {
  max-width: 760px;
  margin: 25px 0 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.68;
}
.profile-compiler .compiler-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin-top: 20px;
  color: var(--quiet);
  font-size: 13px;
}
.profile-compiler .compiler-links {
  display: flex;
  flex-wrap: wrap;
  gap: 7px 18px;
  margin-top: 13px;
  font-size: 13px;
}
.profile-compiler .compiler-links a {
  color: var(--muted);
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}
.profile-compiler .compiler-links a:hover,
.profile-compiler .compiler-links a:focus-visible {
  color: var(--text);
}
.profile-compiler .compiler-portrait {
  margin: 4px 0 0;
}
.profile-compiler .compiler-portrait img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  object-position: 50% 35%;
  border: 1px solid var(--border);
  border-radius: 5px;
}
.profile-compiler .section {
  padding: 44px 0;
}
.profile-compiler .section-heading {
  display: block;
  margin-bottom: 22px;
}
.profile-compiler .section-label {
  display: none;
}
.profile-compiler .section-heading h2 {
  font-size: clamp(26px, 2.5vw, 33px);
  line-height: 1.08;
  letter-spacing: -.035em;
}
.profile-compiler .timeline article {
  grid-template-columns: 138px minmax(225px, .82fr) minmax(0, 1.18fr);
  gap: 24px;
  padding: 21px 0;
}
.profile-compiler .timeline time,
.profile-compiler .recognition-year,
.profile-compiler .project-type {
  font-family: inherit;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
  font-weight: 600;
}
.profile-compiler .timeline time,
.profile-compiler .recognition-year,
.profile-compiler .project-type {
  color: var(--quiet);
}
.profile-compiler .timeline h3 {
  font-size: 19px;
}
.profile-compiler .timeline-details li {
  line-height: 1.58;
}
.profile-compiler .project-list {
  border-top: 1px solid var(--border);
}
.profile-compiler .project-row {
  grid-template-columns: minmax(220px, .72fr) minmax(0, 1.28fr);
  gap: 34px;
  padding: 20px 0;
}
.profile-compiler .project-row:first-child {
  grid-template-columns: minmax(270px, .88fr) minmax(0, 1.12fr);
  padding: 32px 0 34px;
}
.profile-compiler .project-row h3 {
  margin-top: 7px;
  font-size: 20px;
  line-height: 1.22;
}
.profile-compiler .project-row:first-child h3 {
  font-size: clamp(25px, 2.4vw, 31px);
  letter-spacing: -.035em;
}
.profile-compiler .project-row p {
  line-height: 1.62;
}
.profile-compiler .project-row:not(:first-child) .project-result {
  color: var(--muted);
  font-size: 14px;
}
.profile-compiler .project-links {
  gap: 8px 16px;
}
.profile-compiler .stack-line {
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 24px;
  padding: 14px 0;
}
.profile-compiler .stack-line strong {
  font-size: 13px;
}
.profile-compiler .stack-line p {
  font-size: 14px;
  line-height: 1.55;
}
.profile-compiler .recognition-item {
  grid-template-columns: 150px minmax(0, 1fr);
  padding: 18px 0;
}
.profile-compiler .recognition-item h3 {
  font-size: 17px;
}
.profile-compiler .recognition-item p {
  max-width: 760px;
}
.profile-compiler #education {
  padding-bottom: 42px;
}
.profile-compiler #education .section-heading h2 {
  max-width: 760px;
  font-size: 18px;
  line-height: 1.45;
  letter-spacing: -.015em;
  font-weight: 650;
}
.profile-compiler #education .section-intro {
  display: none;
}
.profile-compiler .contact-section {
  display: none;
}
.profile-compiler .site-footer {
  border-top: 1px solid var(--soft-border);
  padding-top: 20px;
}
@media (max-width: 760px) {
  .profile-compiler .header-inner {
    min-height: 56px;
  }
  .profile-compiler .primary-nav {
    display: none;
  }
  .profile-compiler .compiler-intro {
    grid-template-columns: 1fr;
    gap: 25px;
    padding: 40px 0 34px;
  }
  .profile-compiler .compiler-intro h1 {
    font-size: clamp(39px, 12vw, 51px);
  }
  .profile-compiler .compiler-portrait {
    width: 116px;
    order: -1;
  }
  .profile-compiler .compiler-meta,
  .profile-compiler .compiler-links {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .profile-compiler .section {
    padding: 36px 0;
  }
  .profile-compiler .timeline article,
  .profile-compiler .project-row,
  .profile-compiler .project-row:first-child,
  .profile-compiler .stack-line,
  .profile-compiler .recognition-item {
    grid-template-columns: 1fr;
    gap: 9px;
  }
  .profile-compiler .project-row:first-child {
    padding: 25px 0 27px;
  }
  .profile-compiler .project-row:first-child h3 {
    font-size: 24px;
  }
}
'''
          css_path.write_text(css.rstrip() + '\n', encoding='utf-8')

          print('Applied compiler CV redesign to canonical source files')
          PY

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Rebuild site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate content and generated artifacts
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --report /tmp/cv-validation.json

      - name: Capture redesigned visual baseline
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update

      - name: Build manifest and final validation
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
          python -m py_compile tools/build_site.py

      - name: Commit redesign and generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json data/visual-baseline.json tools/build_site.py style.css \
                  ru-compiler.html en-compiler.html pdf MANIFEST.sha256 sitemap.xml index.html \
                  ru.html en.html ru-backend.html en-backend.html ru-cpp-systems.html en-cpp-systems.html \
                  ru-quant.html en-quant.html cases || true
          if git diff --cached --quiet; then
            echo "No redesign changes to commit"
            exit 1
          fi
          git commit -m "cv: redesign compiler profile as engineer-first CV [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anti-ai-compiler-redesign-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
