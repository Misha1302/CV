name: Finalize compiler redesign cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-anti-ai-compiler-redesign.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove one-shot execution files
        run: |
          rm -f .github/workflows/one-shot-anti-ai-compiler-redesign.yml
          rm -f tools/one_shot_anti_ai_patch.py

      - name: Rebuild integrity manifest
        run: |
          python tools/build_site.py --manifest
          git diff --check
          python -m py_compile tools/build_site.py

      - name: Install validation dependencies
        run: pip install beautifulsoup4 pymupdf

      - name: Validate final repository tree
        run: python tools/validate_cv.py --pdf-dir pdf

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot CV redesign runner [skip ci]"
          git push
