name: Polish Russian targeted CVs v31

on:
  pull_request:
    branches:
      - main

concurrency:
  group: cv-v31-ru-polish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wist2-cv-v31-strong-positioning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Polish Russian profiles and rebuild all PDFs
        run: python tools/cv_v31_ru_polish.py
      - name: Validate generated sources and PDFs
        run: |
          git diff --check
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --skip-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: cv-v31-ru-polish-evidence
          path: |
            /tmp/cv-v31-polish
            /tmp/cv-v31-polish-report.json
          if-no-files-found: error
      - name: Commit polished release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cv): polish Russian targeted PDF language"
          git push origin HEAD:feat/wist2-cv-v31-strong-positioning
