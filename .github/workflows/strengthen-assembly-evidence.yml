name: Strengthen assembly evidence

on:
  push:
    branches:
      - feat/assembly-evidence-2026-07-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CV branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update HTML variants
        run: python3 tools/strengthen_assembly_cv.py

      - name: Check out PDF exporter
        uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter

      - name: Install exporter dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r .exporter/requirements.txt
          python3 -m pip install --disable-pip-version-check PyMuPDF
          python3 -m playwright install --with-deps chromium

      - name: Rebuild affected PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          mappings = {
              "ru-compiler.html": "pdf/Mikhail_Razakov_Compiler_RU.pdf",
              "en-compiler.html": "pdf/Mikhail_Razakov_Compiler_EN.pdf",
              "ru-cpp-systems.html": "pdf/Mikhail_Razakov_CPP_Systems_RU.pdf",
              "en-cpp-systems.html": "pdf/Mikhail_Razakov_CPP_Systems_EN.pdf",
          }
          exporter = Path(".exporter/export_cv_html_to_pdf.py")
          for html, pdf in mappings.items():
              subprocess.run([
                  "python3", str(exporter), html, pdf,
                  "--viewport-width", "1440",
                  "--link-base-url", f"https://misha1302.github.io/CV/{html}",
                  "--require-links", "--min-text-chars", "1000",
                  "--timeout-ms", "60000", "--wait-ms", "250",
              ], check=True)
          print(f"Rebuilt {len(mappings)} PDFs")
          PY

      - name: Verify PDFs and render review images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import fitz

          changed = {
              "pdf/Mikhail_Razakov_Compiler_RU.pdf",
              "pdf/Mikhail_Razakov_Compiler_EN.pdf",
              "pdf/Mikhail_Razakov_CPP_Systems_RU.pdf",
              "pdf/Mikhail_Razakov_CPP_Systems_EN.pdf",
          }
          all_pdfs = sorted(Path("pdf").glob("*.pdf"))
          if len(all_pdfs) != 14:
              raise RuntimeError(f"Expected 14 targeted PDFs, found {len(all_pdfs)}")

          out = Path("render-review")
          out.mkdir(exist_ok=True)
          for path in all_pdfs:
              doc = fitz.open(path)
              if len(doc) != 1:
                  raise RuntimeError(f"{path}: expected one continuous page, found {len(doc)}")
              page = doc[0]
              text = page.get_text()
              links = page.get_links()
              uris = {link.get("uri") for link in links if link.get("uri")}
              if len(text.strip()) < 1000:
                  raise RuntimeError(f"{path}: extracted text is unexpectedly short")
              if not links:
                  raise RuntimeError(f"{path}: clickable links are missing")
              if page.rect.width < 500 or page.rect.height < 700:
                  raise RuntimeError(f"{path}: implausible dimensions {page.rect}")
              if path.as_posix() in changed:
                  for marker in ("NASM", "x86-64", "cdecl", "x87"):
                      if marker not in text:
                          raise RuntimeError(f"{path}: required marker missing: {marker}")
                  for uri in (
                      "https://github.com/Misha1302/Nasm-X86-Course",
                      "https://github.com/Misha1302/x86-64-codegen-ra-playground",
                  ):
                      if uri not in uris:
                          raise RuntimeError(f"{path}: required link missing: {uri}")
                  pix = page.get_pixmap(matrix=fitz.Matrix(0.75, 0.75), alpha=False)
                  pix.save(out / f"{path.stem}.png")
              doc.close()
          print("Verified all 14 PDFs and rendered four changed variants")
          PY

      - name: Upload render review
        uses: actions/upload-artifact@v4
        with:
          name: assembly-cv-render-review
          path: render-review/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Finalize branch commit and manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .exporter render-review
          rm -f tools/strengthen_assembly_cv.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/strengthen-assembly-evidence.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type f \
            ! -path './.git/*' \
            ! -name 'MANIFEST.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Strengthen assembly evidence in compiler and systems CVs'
          git push origin HEAD:feat/assembly-evidence-2026-07-24
