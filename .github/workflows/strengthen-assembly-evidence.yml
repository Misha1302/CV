name: Strengthen assembly evidence

on:
  push:
    branches:
      - feat/assembly-evidence-2026-07-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CV branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update HTML variants
        run: python3 tools/strengthen_assembly_cv.py

      - name: Check out PDF exporter helpers
        uses: actions/checkout@v4
        with:
          repository: Misha1302/cv-html-to-pdf-exporter
          path: .exporter

      - name: Install PDF dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r .exporter/requirements.txt
          python3 -m pip install --disable-pip-version-check PyMuPDF
          python3 -m playwright install --with-deps chromium

      - name: Rebuild affected one-page A4 PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee exporter.log
          from pathlib import Path
          import sys
          import fitz
          from playwright.sync_api import sync_playwright

          sys.path.insert(0, str(Path('.exporter').resolve()))
          import export_cv_html_to_pdf as exporter

          mappings = {
              "ru-compiler.html": "pdf/Mikhail_Razakov_Compiler_RU.pdf",
              "en-compiler.html": "pdf/Mikhail_Razakov_Compiler_EN.pdf",
              "ru-cpp-systems.html": "pdf/Mikhail_Razakov_CPP_Systems_RU.pdf",
              "en-cpp-systems.html": "pdf/Mikhail_Razakov_CPP_Systems_EN.pdf",
          }

          def write_pdf(page, path: Path, scale: float) -> int:
              page.pdf(
                  path=str(path),
                  format="A4",
                  print_background=True,
                  display_header_footer=False,
                  prefer_css_page_size=True,
                  scale=scale,
                  tagged=True,
                  outline=True,
              )
              with fitz.open(path) as doc:
                  return len(doc)

          with sync_playwright() as playwright:
              browser = exporter.launch_browser(playwright, None)
              try:
                  for html, pdf_name in mappings.items():
                      page = browser.new_page(
                          viewport={"width": 1440, "height": 900},
                          device_scale_factor=1,
                          color_scheme="light",
                          reduced_motion="reduce",
                      )
                      page.set_default_timeout(60000)
                      page.set_default_navigation_timeout(60000)
                      page.emulate_media(media="print", color_scheme="light", reduced_motion="reduce")
                      exporter.load_local_document(page, Path(html).resolve())
                      exporter.trigger_lazy_content(page)
                      exporter.wait_for_page_assets(page, 60000, False)
                      exporter.prepare_document(page, f"https://misha1302.github.io/CV/{html}")
                      page.wait_for_timeout(250)

                      output = Path(pdf_name)
                      probe = output.with_suffix('.probe.pdf')
                      if write_pdf(page, probe, 0.10) != 1:
                          raise RuntimeError(f"{html}: cannot fit on one A4 page even at Chromium minimum scale 0.10")

                      low, high = 0.10, 1.00
                      for _ in range(10):
                          mid = (low + high) / 2
                          pages = write_pdf(page, probe, mid)
                          if pages == 1:
                              low = mid
                          else:
                              high = mid
                      chosen = max(0.10, low - 0.002)
                      pages = write_pdf(page, output, chosen)
                      probe.unlink(missing_ok=True)
                      if pages != 1:
                          raise RuntimeError(f"{html}: adaptive export produced {pages} pages at scale {chosen:.4f}")
                      print(f"EXPORT {html} -> {pdf_name}: scale={chosen:.4f}, pages={pages}", flush=True)
                      page.close()
              finally:
                  browser.close()
          PY

      - name: Upload exporter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-cv-exporter-log
          path: exporter.log
          retention-days: 7
          if-no-files-found: warn

      - name: Verify PDFs and render review images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import fitz

          changed = {
              "pdf/Mikhail_Razakov_Compiler_RU.pdf",
              "pdf/Mikhail_Razakov_Compiler_EN.pdf",
              "pdf/Mikhail_Razakov_CPP_Systems_RU.pdf",
              "pdf/Mikhail_Razakov_CPP_Systems_EN.pdf",
          }
          all_pdfs = sorted(Path("pdf").glob("*.pdf"))
          if len(all_pdfs) != 14:
              raise RuntimeError(f"Expected 14 targeted PDFs, found {len(all_pdfs)}")

          out = Path("render-review")
          out.mkdir(exist_ok=True)
          for path in all_pdfs:
              doc = fitz.open(path)
              if len(doc) != 1:
                  raise RuntimeError(f"{path}: expected one page, found {len(doc)}")
              page = doc[0]
              text = page.get_text()
              links = page.get_links()
              uris = {link.get("uri") for link in links if link.get("uri")}
              if len(text.strip()) < 1000:
                  raise RuntimeError(f"{path}: extracted text is unexpectedly short")
              if not links:
                  raise RuntimeError(f"{path}: clickable links are missing")
              if abs(page.rect.width - 595.28) > 3 or abs(page.rect.height - 841.89) > 3:
                  raise RuntimeError(f"{path}: expected A4 dimensions, got {page.rect}")
              if path.as_posix() in changed:
                  for marker in ("NASM", "x86-64", "cdecl", "x87"):
                      if marker not in text:
                          raise RuntimeError(f"{path}: required marker missing: {marker}")
                  for uri in (
                      "https://github.com/Misha1302/Nasm-X86-Course",
                      "https://github.com/Misha1302/x86-64-codegen-ra-playground",
                  ):
                      if uri not in uris:
                          raise RuntimeError(f"{path}: required link missing: {uri}")
                  pix = page.get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False)
                  pix.save(out / f"{path.stem}.png")
              doc.close()
          print("Verified all 14 PDFs and rendered four changed variants")
          PY

      - name: Upload render review
        uses: actions/upload-artifact@v4
        with:
          name: assembly-cv-render-review
          path: render-review/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Finalize branch commit and manifest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .exporter render-review exporter.log
          rm -f tools/strengthen_assembly_cv.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/strengthen-assembly-evidence.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          find . -type f \
            ! -path './.git/*' \
            ! -name 'MANIFEST.sha256' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Strengthen assembly evidence in compiler and systems CVs'
          git push origin HEAD:feat/assembly-evidence-2026-07-24
