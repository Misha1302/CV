name: Finalize CV v32 flagship polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cv-v32-review-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply language and density polish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/cv-print-profiles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          profiles = data['profiles']

          for key in ['ru-devtools.html', 'en-devtools.html', 'ru-cpp-systems.html', 'en-cpp-systems.html']:
              profiles[key]['density'] = 'spacious'
              profiles[key]['min_fill'] = 0.86

          ru = profiles['ru-devtools.html']
          ru['summary'] = 'Разработал экспериментальный PlanFuzz: нейтральное к языку ядро, адаптер Acme и ограниченный адаптер Wist для Int32, семь семейств оракулов, повторное выполнение в свежих процессах, точные отпечатки и детерминированное сокращение программ и планов.'
          ru['experience'][0][2] = [
              'Нейтральное к языку ядро, адаптер Acme, ограниченный адаптер Wist для Int32 и структурные генераторы.',
              'Строгая семантика исходов и доказательств, подтверждение в свежих процессах и детерминированные reducers.',
          ]
          ru['experience'][1][1] = 'Инструменты Wist'
          ru['experience'][1][2] = [
              'Типизированные API, структурированные diagnostics, versioned traces и parity интерпретатора/CIL.',
              'Canonical gate: 1 465/1 465 тестов, 9 packages, clean template и cross-package consumer smoke.',
          ]
          ru['skills'][0][0] = 'Тестирование'
          ru['skills'][1][0] = 'Диагностика'
          ru['skills'][2][0] = 'Релизная проверка'
          ru['ats_order'] = ['Михаил Разаков', 'Инженер по тестированию компиляторов и инструментам разработчика', 'ОПЫТ', 'Инструменты Wist', 'ИЗБРАННЫЕ ПРОЕКТЫ', 'PS-form Harness']

          ru = profiles['ru-compiler.html']
          ru['summary'] = 'Разрабатываю UniversalToolchain/Wist2 — SDK для типизированной композиции языковых компонентов и runtime: межпакетные планы, точная привязка манифестов, callable-first SSA, публичный Wist facade и экспериментальный PlanFuzz.'
          ru['proofs'][0] = ['Планы типизированной композиции', 'маршруты, проходы, capabilities и exact executor']
          ru['experience'][0][2] = [
              'SDK для типизированной композиции независимых языковых пакетов: детерминированные маршруты, порядок проходов и schema-v5 lock identity.',
              'Fail-closed политики runtime, точная привязка манифестов и lifecycle ownership.',
              'Callable-first SSA: descriptor semantics, effects, determinism, trust и verifier-gated roundtrip.',
              'Экспериментальный PlanFuzz: нейтральное к языку ядро, адаптер Acme, ограниченный адаптер Wist для Int32, 7 семейств оракулов, replay и reducers.',
          ]
          ru['projects'][0][1] = 'Экспериментальное дифференциальное тестирование с учётом конфигурации: нейтральное к языку ядро, адаптеры Acme и ограниченный Wist Int32, подтверждение в свежих процессах и детерминированное сокращение программы и плана.'

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat >> style.css <<'CSS'

          /* v32 final: larger type for shorter flagship profiles */
          @media print {
            .print-cv.pcv-spacious { padding: 10.5mm 10.5mm 9.5mm; font-size: 10.8pt; line-height: 1.4; }
            .pcv-spacious .pcv-header { padding-bottom: 3.8mm; }
            .pcv-spacious .pcv-header h1 { font-size: 28.5pt; }
            .pcv-spacious .pcv-header h2 { margin-top: 2mm; font-size: 14.2pt; }
            .pcv-spacious .pcv-contact { font-size: 9.95pt; line-height: 1.48; }
            .pcv-spacious .pcv-summary { margin: 4.8mm 0 4.4mm; font-size: 11.15pt; line-height: 1.44; }
            .pcv-spacious .pcv-proofs { gap: 3.4mm; margin-bottom: 5.5mm; }
            .pcv-spacious .pcv-proof { min-height: 23.5mm; padding: 3.8mm; }
            .pcv-spacious .pcv-proof strong { font-size: 12.5pt; }
            .pcv-spacious .pcv-proof span { margin-top: 1.7mm; font-size: 9.55pt; line-height: 1.32; }
            .pcv-spacious .pcv-columns { gap: 7.3mm; }
            .pcv-spacious .pcv-main section + section,
            .pcv-spacious .pcv-side section + section { margin-top: 5.8mm; }
            .pcv-spacious .pcv-section-title { margin-bottom: 2.9mm; font-size: 12.4pt; }
            .pcv-spacious .pcv-entry { padding: 3.1mm 0 3.9mm; }
            .pcv-spacious .pcv-date { font-size: 9.1pt; }
            .pcv-spacious .pcv-entry h3,
            .pcv-spacious .pcv-project h3 { font-size: 11pt; }
            .pcv-spacious .pcv-entry ul { margin-top: 1.9mm; }
            .pcv-spacious .pcv-entry li { margin-bottom: 1.3mm; font-size: 9.85pt; line-height: 1.35; }
            .pcv-spacious .pcv-project { padding: 3mm 0 3.5mm; }
            .pcv-spacious .pcv-project p { margin-top: 1.5mm; font-size: 9.85pt; line-height: 1.37; }
            .pcv-spacious .pcv-skill { padding: 2.35mm 0; }
            .pcv-spacious .pcv-skill strong { font-size: 9.95pt; }
            .pcv-spacious .pcv-skill span { font-size: 9.35pt; line-height: 1.35; }
            .pcv-spacious .pcv-compact p { font-size: 9.7pt; line-height: 1.41; }
          }
          CSS
      - name: Regenerate and validate all artifacts
        run: |
          python tools/build_cv.py --write-html
          python tools/build_cv.py --render-dir pdf --evidence-dir /tmp/cv-v32-final-render --report /tmp/cv-v32-final-report.json
          rm .github/workflows/cv-v32-final-polish.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('.')
          manifest = root / 'MANIFEST.sha256'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts:
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.relative_to(root).as_posix()}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm -rf /tmp/cv-v32-final-clean
          python tools/build_cv.py --render-dir /tmp/cv-v32-final-clean --evidence-dir /tmp/cv-v32-final-clean-render --report /tmp/cv-v32-final-clean-report.json
          python tools/validate_cv.py --pdf-dir /tmp/cv-v32-final-clean --compare-dir pdf --skip-manifest
          python tools/validate_cv.py --pdf-dir pdf
      - uses: actions/upload-artifact@v4
        with:
          name: cv-v32-final-review-evidence
          path: |
            /tmp/cv-v32-final-report.json
            /tmp/cv-v32-final-clean-report.json
            /tmp/cv-v32-final-render
          if-no-files-found: error
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cv): improve flagship density and Russian copy"
          git push origin HEAD:feat/cv-v32-review-hardening
