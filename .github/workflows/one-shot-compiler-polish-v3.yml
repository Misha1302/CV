name: Final compiler CV polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-compiler-polish-v3.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/one_shot_compiler_polish_v2.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Build
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/build_site.py --check
          git diff --check
      - name: Visual verification
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual --update
      - name: Finalize
        run: |
          rm -f .github/workflows/one-shot-compiler-polish-v2.yml
          rm -f .github/workflows/one-shot-compiler-polish-v3.yml
          rm -f tools/one_shot_compiler_polish_v2.py
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          python tools/build_site.py --check
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'cv: finish compiler copy and print layout [skip ci]'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-polish-v3-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
