name: Finalize compiler CV PR 53

on:
  push:
    branches:
      - refactor/compiler-program-analysis-cv-20260912
    paths:
      - .github/workflows/finalize-compiler-cv-pr53.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical CV build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Rebuild canonical site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate content and external links
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json

      - name: Refresh and verify visual baseline
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/visual_regression.py --output-dir /tmp/cv-visual-verify

      - name: Remove one-shot workflow before manifest generation
        run: rm -f .github/workflows/finalize-compiler-cv-pr53.yml

      - name: Rebuild manifest and validate final tree
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          python tools/build_site.py --check
          git diff --check

      - name: Commit finalized branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize compiler CV visual baseline and manifest"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-cv-pr53-final-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
            /tmp/cv-visual-verify
          if-no-files-found: warn
