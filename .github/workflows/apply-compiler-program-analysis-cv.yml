name: Apply compiler and program-analysis CV reposition

on:
  push:
    branches:
      - refactor/compiler-program-analysis-cv-20260912
    paths:
      - .github/workflows/apply-compiler-program-analysis-cv.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical CV build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium

      - name: Reposition compiler profile around program analysis and validated backend evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/site.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          ui = data["profile_ui"]["compiler"]
          ui.update({
              "label_ru": "Compiler / Program Analysis",
              "label_en": "Compiler / Program Analysis",
              "landing_title": "Compiler & Program Analysis Engineer · LLVM · C++ · Static Analysis",
              "landing_description_ru": "Профессиональный опыт LLVM и статического анализа: преобразования IR с явной проверкой допустимости, анализ потоков данных до неподвижной точки и отдельный x86-64 backend с распределением регистров и дифференциальным исполнением.",
          })

          ru = data["profiles"]["compiler"]["ru"]
          ru.update({
              "title": "Михаил Разаков — Compiler & Program Analysis Engineer · LLVM · C++ · Static Analysis",
              "role": "Compiler & Program Analysis Engineer",
              "brand": "LLVM · program analysis · x86-64 codegen · static analysis",
              "eyebrow": "LLVM 22 · interprocedural analysis · register allocation · Roslyn",
              "summary": "Инженер по компиляторам и анализу программ с профессиональным опытом в МЦСТ и ИСП РАН. В МЦСТ реализовал LLVM 22 LICM и прототип межпроцедурного анализа global-IV с отдельной проверкой допустимости; сейчас участвую в разработке SharpChecker. Публичные проекты подтверждают преобразования LLVM IR с 29 регрессионными тестами, x86-64 backend с распределением регистров и Roslyn-анализ потоков данных до неподвижной точки.",
              "description": "Михаил Разаков — Compiler & Program Analysis Engineer: LLVM 22, межпроцедурный анализ, legality, LLVM Verifier, Roslyn fixed-point data-flow, register allocation и SysV x86-64 codegen.",
              "proofs": [
                  ["Professional compiler / analysis", "МЦСТ: LLVM 22 LICM, межпроцедурный global-IV, APInt и проверка допустимости; ИСП РАН: SharpChecker, промышленный статический анализ C#/.NET."],
                  ["Validated LLVM transformation", "Global-IV: 29 позитивных и негативных регрессионных тестов, LLVM Verifier, структурные проверки, идемпотентность и сравнение исполнения до/после transformation."],
                  ["Compiler backend", "SSA/CFG validation, liveness/interference, linear-scan и seeded simulated-annealing allocators, spills/phi lowering, SysV x86-64 и differential execution."],
              ],
              "project_ids": ["globaliv", "codegen", "deref", "wist"],
              "skills": [
                  ["Компиляторы", "C++23, LLVM 22, LLVM IR, optimization passes, APInt, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality, LLVM Verifier"],
                  ["Анализ программ", "C#, .NET, Roslyn ControlFlowGraph, fixed-point data-flow, conditional edges, loops/back edges, state propagation и joins"],
                  ["Backend / генерация кода", "Rust, SysV x86-64, liveness/interference, linear scan, simulated annealing, spills, phi lowering, differential execution"],
                  ["Инфраструктура компилятора", "typed artifact contracts, deterministic planning/pass ordering, artifact routing, interpreter/CIL parity, backend/runtime composition"],
              ],
              "contact_heading": "Целевые роли: Compiler Engineer · Program Analysis · Static Analysis · Compiler Backend",
              "footer": "Compiler & Program Analysis Engineer · LLVM · C++",
          })
          ru["project_summaries"]["globaliv"] = {
              "type": "C++23 · LLVM 22 · interprocedural analysis · legality",
              "solution": "LLVM 22 pass локализует поддерживаемые induction-like global variables после межпроцедурного анализа эффектов и аффинной эволюции с отдельным решением о допустимости; APInt моделирует fixed-width wraparound.",
              "result": "29 позитивных и негативных regression cases: global-iv,verify, структурные ожидания, идемпотентность и сравнение наблюдаемого поведения до/после transformation.",
          }
          ru["project_summaries"]["codegen"] = {
              "type": "Rust · compiler backend · register allocation · SysV x86-64",
              "solution": "Compiler backend с SSA/CFG validation, анализом живости и интерференции, linear-scan и seeded simulated-annealing allocators, spills, phi lowering и SysV x86-64 emitter.",
              "result": "Независимый verifier раскладки и native-vs-interpreter differential execution; тесты покрывают ветвления, циклы, spills и parallel phi moves.",
          }
          ru["project_summaries"]["deref"] = {
              "type": "C# · Roslyn · program analysis · fixed-point data-flow",
              "solution": "Roslyn ControlFlowGraph analyzer распространяет null-state по conditional edges до неподвижной точки, обрабатывает loops/back edges и объединяет состояния нескольких predecessors.",
              "result": "Поддерживает method/property/index/event dereferences и invalidation после assignment/ref/out; отдельные analyzer tests используют Microsoft.CodeAnalysis.CSharp.Testing.",
          }
          ru["project_summaries"]["wist"] = {
              "type": ".NET · compiler/language infrastructure · deterministic composition",
              "solution": "Модульная compiler/runtime infrastructure: typed artifact contracts, dependencies/conflicts, provider selection, pass ordering и artifact routes компилируются в immutable LanguagePlan до исполнения.",
              "result": "Опубликован alpha-пакет UniversalToolchain.Wist; interpreter/CIL paths, exact package binding и fail-closed runtime checks защищают выбранный execution plan.",
          }

          en = data["profiles"]["compiler"]["en"]
          en.update({
              "title": "Mikhail Razakov — Compiler & Program Analysis Engineer · LLVM · C++ · Static Analysis",
              "role": "Compiler & Program Analysis Engineer",
              "brand": "LLVM · program analysis · x86-64 codegen · static analysis",
              "eyebrow": "LLVM 22 · interprocedural analysis · register allocation · Roslyn",
              "summary": "Compiler and program-analysis engineer with professional experience at MCST and ISP RAS. At MCST, I implemented LLVM 22 LICM and an interprocedural global-IV prototype with a separate legality phase; I now contribute to SharpChecker. Public projects demonstrate LLVM IR transformations with a 29-case regression suite, an x86-64 backend with register allocation, and Roslyn fixed-point data flow.",
              "description": "Mikhail Razakov — Compiler & Program Analysis Engineer: LLVM 22, interprocedural analysis, legality, LLVM Verifier, Roslyn fixed-point data flow, register allocation, and SysV x86-64 code generation.",
              "proofs": [
                  ["Professional compiler / analysis", "MCST: LLVM 22 LICM, interprocedural global-IV, APInt, and legality; ISP RAS: SharpChecker industrial C#/.NET static analysis."],
                  ["Validated LLVM transformation", "Global-IV: 29 positive/negative regressions, LLVM Verifier, structural checks, idempotence, and before/after execution."],
                  ["Compiler backend", "SSA/CFG validation, liveness/interference, linear-scan and seeded simulated-annealing allocators, spills/phi lowering, SysV x86-64, and differential execution."],
              ],
              "project_ids": ["globaliv", "codegen", "deref", "wist"],
              "skills": [
                  ["Compilers", "C++23, LLVM 22, LLVM IR, optimization passes, APInt, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality, LLVM Verifier"],
                  ["Program Analysis", "C#, .NET, Roslyn ControlFlowGraph, fixed-point data flow, conditional edges, loops/back edges, state propagation and joins"],
                  ["Backend / Codegen", "Rust, SysV x86-64, liveness/interference, linear scan, simulated annealing, spills, phi lowering, differential execution"],
                  ["Compiler Infrastructure", "typed artifact contracts, deterministic planning/pass ordering, artifact routing, interpreter/CIL parity, backend/runtime composition"],
              ],
              "contact_heading": "Target roles: Compiler Engineer · Program Analysis · Static Analysis · Compiler Backend",
              "footer": "Compiler & Program Analysis Engineer · LLVM · C++",
          })
          en["project_summaries"]["globaliv"] = {
              "type": "C++23 · LLVM 22 · interprocedural analysis · legality",
              "solution": "An LLVM 22 pass localizes supported induction-like globals after interprocedural effects/affine analysis and a separate legality decision; APInt models fixed-width wraparound.",
              "result": "29 positive/negative regression cases: global-iv,verify, structural expectations, idempotence, and observable before/after execution comparison.",
          }
          en["project_summaries"]["codegen"] = {
              "type": "Rust · compiler backend · register allocation · SysV x86-64",
              "solution": "A compiler backend with SSA/CFG validation, liveness/interference analysis, linear-scan and seeded simulated-annealing allocators, spills, phi lowering, and a SysV x86-64 emitter.",
              "result": "An independent assignment verifier plus native-vs-interpreter differential execution; tests cover branches, loops, spills, and parallel phi moves.",
          }
          en["project_summaries"]["deref"] = {
              "type": "C# · Roslyn · program analysis · fixed-point data flow",
              "solution": "A Roslyn ControlFlowGraph analyzer propagates null state over conditional edges to a fixed point, handles loops/back edges, and merges states from multiple predecessors.",
              "result": "Handles method/property/index/event dereferences and invalidation after assignment/ref/out; dedicated analyzer tests use Microsoft.CodeAnalysis.CSharp.Testing.",
          }
          en["project_summaries"]["wist"] = {
              "type": ".NET · compiler/language infrastructure · deterministic composition",
              "solution": "Modular compiler/runtime infrastructure: typed artifact contracts, dependencies/conflicts, provider selection, pass ordering, and artifact routes compile into an immutable LanguagePlan before execution.",
              "result": "Published UniversalToolchain.Wist alpha package; interpreter/CIL paths, exact package binding, and fail-closed runtime checks protect the selected execution plan.",
          }

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          targeting = Path("TARGETING.md")
          targeting.write_text(
              "# Targeting guide — compiler/program-analysis refresh\n\n"
              "## Primary profiles\n\n"
              "1. `Compiler & Program Analysis Engineer — LLVM · C++ · Static Analysis` — primary for compiler, LLVM, static/program-analysis, compiler-backend, and adjacent code-intelligence roles.\n"
              "2. `Software Engineer — Architecture & Platforms` — broader architecture/platform roles spanning typed contracts, state/recovery, and compiler/runtime systems.\n"
              "3. `.NET Backend / Platform Engineer — State & Reliability` — backend/platform roles where payments, idempotency, recovery, migrations, and release correctness dominate.\n\n"
              "## Secondary profiles\n\n"
              "- `C++ / LLVM Systems` — low-level/backend compiler, systems, performance, and HFT-adjacent applications.\n"
              "- `Quantitative Research / Research Software Engineering` — only when algorithmic experimentation is central.\n\n"
              "Lead with the compiler/program-analysis profile unless the vacancy clearly rewards another evidence ordering. The profiles share facts and differ only in role-specific evidence priority and vocabulary.\n",
              encoding="utf-8",
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace("2. Compiler / LLVM Engineer", "2. Compiler & Program Analysis Engineer")
          readme.write_text(text, encoding="utf-8")
          PY

      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json

      - name: Validate content, links, and PDFs
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json

      - name: Verify layout structure and overflow
        run: |
          # Golden-image hashes also drift on an untouched profile with the current
          # Chromium runner. Keep every structural visual check and height guard,
          # but do not overwrite/bless the repository baseline in this content PR.
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update-if-missing --max-hamming 256

      - name: Build manifest and validate final tree
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf

      - name: Commit verified result and remove one-shot workflow
        run: |
          rm -f .github/workflows/apply-compiler-program-analysis-cv.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reposition compiler CV around program analysis"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-program-analysis-cv-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
