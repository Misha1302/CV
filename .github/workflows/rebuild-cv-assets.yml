name: Rebuild generated CV site

on:
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "data/site.json"
      - "style.css"
      - "script.js"
      - "assets/**"
      - "tools/build_site.py"
      - "tools/build_cv.py"
      - "tools/validate_cv.py"
      - "tools/visual_regression.py"
      - ".github/workflows/rebuild-cv-assets.yml"
      - ".github/workflows/validate-cv.yml"
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply evidence-backed compiler CV refresh
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/site.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['version'] = max(int(data.get('version', 0)), 55)
          data['updated_at'] = '2026-08-31'

          ui = data['profile_ui']
          ui['general']['label_ru'] = 'Compiler / Language Infrastructure'
          ui['general']['label_en'] = 'Compiler / Language Infrastructure'
          ui['general']['landing_title'] = 'Compiler Engineer · LLVM / Program Analysis / Language Infrastructure'
          ui['general']['landing_description_ru'] = 'Профессиональный LLVM/static-analysis опыт и compiler architecture: typed contracts, deterministic planning, runtime composition.'
          ui['compiler']['landing_title'] = 'Compiler / LLVM Engineer · Optimization & Program Analysis'
          ui['compiler']['landing_description_ru'] = 'LLVM passes, interprocedural analysis, legality и IR transforms; static analysis и codegen как дополнительная глубина.'

          general_ru = data['profiles']['general']['ru']
          general_ru.update({
              'title': 'Михаил Разаков — Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'role': 'Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'brand': 'LLVM · program analysis · compiler/language infrastructure',
              'eyebrow': 'LLVM · Roslyn · deterministic planning · x86-64',
              'summary': (
                  'Инженер по компиляторам с профессиональным опытом LLVM и статического анализа. '
                  'В МЦСТ работал с LLVM 22: loop/interprocedural analysis, legality и IR transformations; '
                  'в ИСП РАН участвую в разработке SharpChecker — промышленной платформы статического анализа C#/.NET. '
                  'В независимых проектах развиваю консервативные LLVM-преобразования, Roslyn fixed-point data-flow и '
                  'UniversalToolchain — compiler/language infrastructure с typed artifact contracts и детерминированным planning; '
                  'доклад по этой архитектуре принят на LangDev’26.'
              ),
              'description': (
                  'Михаил Разаков — Compiler Engineer: LLVM 22, interprocedural/program analysis, Roslyn fixed-point data-flow, '
                  'compiler/language infrastructure, register allocation и x86-64 codegen.'
              ),
              'proofs': [
                  ['Professional compiler / analysis', 'МЦСТ: LLVM passes, loop/interprocedural analysis и legality; ИСП РАН: SharpChecker, статический анализ C#/.NET.'],
                  ['Compiler architecture', 'UniversalToolchain: typed artifacts; dependencies/conflicts, provider selection, pass order, artifact routes и backends сводятся в immutable LanguagePlan до исполнения.'],
                  ['Verification & backends', 'Conservative rejection paths, LLVM Verifier и before/after execution; interpreter/CIL parity; отдельный x86-64 codegen/register-allocation pipeline.'],
              ],
              'experience': [
                  {
                      'date': '2026 — сейчас',
                      'title': 'ИСП РАН — инженер по статическому анализу',
                      'org': 'SharpChecker · C#/.NET',
                      'bullets': ['Участвую в разработке SharpChecker — промышленной платформы статического анализа C#/.NET в ИСП РАН.'],
                  },
                  {
                      'date': 'июль — август 2026',
                      'title': 'МЦСТ — стажёр по разработке компиляторов',
                      'org': 'LLVM 22 · C++23 · compiler engineering',
                      'bullets': [
                          'Реализовал LLVM LICM-pass с loop analysis, проверками side effects/speculative safety и hoisting loop-invariant инструкций в preheader.',
                          'Разработал консервативный межпроцедурный global-IV pass: APInt affine evolution, транзитивные эффекты вызовов, отдельная legality-фаза и LLVM IR transformation; неподдерживаемые CFG/call cases отклоняются.',
                      ],
                  },
              ],
              'project_ids': ['globaliv', 'wist', 'deref', 'codegen'],
              'skills': [
                  ['Compilers', 'C++, LLVM 22, LLVM IR, optimization passes, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality analysis'],
                  ['Static / Program Analysis', 'C#, .NET, Roslyn ControlFlowGraph, fixed-point data-flow, state propagation and joins'],
                  ['Compiler Infrastructure', 'typed artifact contracts, IR/lowering pipelines, deterministic planning/pass ordering, backend/runtime composition, executable verification'],
                  ['Codegen & Systems', 'Rust, SysV x86-64, liveness/interference, register allocation, Linux, CMake'],
              ],
              'contact_heading': 'Целевые роли: Compiler Engineer · LLVM Engineer · Compiler Infrastructure · Static / Program Analysis',
              'footer': 'Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'recognition': [
                  ['2026', 'LangDev’26 — Build the Language, Then Make the Abstractions Disappear', 'Доклад по архитектуре UniversalToolchain принят на LangDev’26; конференция пройдёт 8–9 октября 2026 в Малаге.'],
                  ['2026', 'UniversalToolchain — Балтийский научно-инженерный конкурс', 'Диплом I степени и Главная премия «Совершенство как надежда» за UniversalToolchain.'],
                  ['2026', 'НИЯУ МИФИ «Юниор»', 'Абсолютный победитель; диплом I степени, 96/100 за UniversalToolchain.'],
              ],
          })

          general_en = data['profiles']['general']['en']
          general_en.update({
              'title': 'Mikhail Razakov — Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'role': 'Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'brand': 'LLVM · program analysis · compiler/language infrastructure',
              'eyebrow': 'LLVM · Roslyn · deterministic planning · x86-64',
              'summary': (
                  'Compiler engineer with professional LLVM and C# static-analysis experience. '
                  'At MCST, I worked on LLVM 22 loop/interprocedural analysis, legality, and IR transformations; '
                  'at ISP RAS, I contribute to SharpChecker, an industrial C#/.NET static-analysis platform. '
                  'Independent work spans conservative LLVM transformations, Roslyn fixed-point data flow, and '
                  'UniversalToolchain, a compiler/language-infrastructure project built around typed artifact contracts and deterministic planning; '
                  'an architecture talk based on the project was accepted to LangDev’26.'
              ),
              'description': (
                  'Mikhail Razakov — Compiler Engineer: LLVM 22, interprocedural/program analysis, Roslyn fixed-point data flow, '
                  'compiler/language infrastructure, register allocation, and x86-64 code generation.'
              ),
              'proofs': [
                  ['Professional compiler / analysis', 'MCST: LLVM passes, loop/interprocedural analysis, and legality; ISP RAS: SharpChecker C#/.NET static analysis.'],
                  ['Compiler architecture', 'UniversalToolchain: typed artifacts; dependencies/conflicts, provider selection, pass order, artifact routes, and backends compile into an immutable LanguagePlan before execution.'],
                  ['Verification & backends', 'Conservative rejection paths, LLVM Verifier and before/after execution; interpreter/CIL parity; a separate x86-64 codegen/register-allocation pipeline.'],
              ],
              'experience': [
                  {
                      'date': '2026 — present',
                      'title': 'ISP RAS — Static Analysis Engineer',
                      'org': 'SharpChecker · C#/.NET',
                      'bullets': ['Contribute to SharpChecker, ISP RAS’s industrial static-analysis platform for C#/.NET.'],
                  },
                  {
                      'date': 'July — August 2026',
                      'title': 'MCST — Compiler Engineering Intern',
                      'org': 'LLVM 22 · C++23 · compiler engineering',
                      'bullets': [
                          'Implemented an LLVM LICM pass with loop analysis, side-effect/speculative-safety checks, and hoisting of loop-invariant instructions to preheaders.',
                          'Developed a conservative interprocedural global-IV pass with APInt affine evolution, transitive call effects, a separate legality phase, and LLVM IR transformation; unsupported CFG/call cases are rejected.',
                      ],
                  },
              ],
              'project_ids': ['globaliv', 'wist', 'deref', 'codegen'],
              'skills': [
                  ['Compilers', 'C++, LLVM 22, LLVM IR, optimization passes, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality analysis'],
                  ['Static / Program Analysis', 'C#, .NET, Roslyn ControlFlowGraph, fixed-point data-flow analysis, state propagation and joins'],
                  ['Compiler Infrastructure', 'typed artifact contracts, IR/lowering pipelines, deterministic planning/pass ordering, backend/runtime composition, executable verification'],
                  ['Codegen & Systems', 'Rust, SysV x86-64, liveness/interference, register allocation, Linux, CMake'],
              ],
              'contact_heading': 'Target roles: Compiler Engineer · LLVM Engineer · Compiler Infrastructure · Static / Program Analysis',
              'footer': 'Compiler Engineer · LLVM / Program Analysis / Language Infrastructure',
              'recognition': [
                  ['2026', 'LangDev’26 — Build the Language, Then Make the Abstractions Disappear', 'Accepted talk on UniversalToolchain’s architecture; LangDev’26 takes place October 8–9, 2026 in Málaga.'],
                  ['2026', 'UniversalToolchain — Baltic Science and Engineering Competition', 'First Degree Diploma and Grand Prize “Perfection as Hope” for UniversalToolchain.'],
                  ['2026', 'MEPhI Junior', 'Overall winner; First Degree Diploma, 96/100 for UniversalToolchain.'],
              ],
          })

          compiler_ru = data['profiles']['compiler']['ru']
          compiler_ru.update({
              'title': 'Михаил Разаков — Compiler / LLVM Engineer · Optimization & Program Analysis',
              'role': 'Compiler / LLVM Engineer · Optimization & Program Analysis',
              'brand': 'LLVM · IR transforms · interprocedural analysis · static analysis',
              'eyebrow': 'LLVM 22 · CFG/SSA · legality · Roslyn',
              'summary': (
                  'Compiler / LLVM engineer с профессиональным опытом compiler и static-analysis разработки. '
                  'В МЦСТ реализовал LLVM 22 loop/interprocedural analyses и консервативные legality checks для IR transformations; '
                  'в ИСП РАН участвую в разработке SharpChecker. Независимые проекты добавляют fixed-point Roslyn CFG analysis, '
                  'x86-64 codegen/register allocation и UniversalToolchain compiler infrastructure.'
              ),
              'description': 'Михаил Разаков — Compiler / LLVM Engineer: LLVM 22, optimization passes, interprocedural analysis, legality, Roslyn data-flow и x86-64 codegen.',
              'proofs': [
                  ['LLVM transformations', 'LICM и global-IV passes: loop/dominator reasoning, APInt affine evolution, transitive call effects, legality и conservative rejection.'],
                  ['Program analysis', 'SharpChecker в ИСП РАН; самостоятельный Roslyn CFG fixed-point analyzer с joins и повторной обработкой до стабилизации.'],
                  ['Infrastructure & backends', 'UniversalToolchain deterministic LanguagePlan/runtime split; SSA-like IR, register allocation и differential x86-64 execution в отдельном backend-проекте.'],
              ],
              'experience': general_ru['experience'],
              'project_ids': ['globaliv', 'wist', 'deref', 'codegen'],
              'skills': [
                  ['Compilers', 'C++23, LLVM 22, LLVM IR, optimization passes, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality analysis'],
                  ['Static / Program Analysis', 'C#, .NET, Roslyn ControlFlowGraph, fixed-point data-flow, state propagation and joins'],
                  ['Codegen', 'Rust, SysV x86-64, liveness/interference, register allocation, phi lowering, differential execution'],
                  ['Compiler Infrastructure', 'typed artifact contracts, deterministic planning/pass ordering, artifact routing, backend/runtime composition'],
              ],
              'contact_heading': 'Целевые роли: Compiler Engineer · LLVM Engineer · Compiler Optimization · Static / Program Analysis',
              'footer': 'Compiler / LLVM Engineer · Optimization & Program Analysis',
              'recognition': general_ru['recognition'],
          })
          compiler_ru.get('project_summaries', {}).pop('wist', None)

          compiler_en = data['profiles']['compiler']['en']
          compiler_en.update({
              'title': 'Mikhail Razakov — Compiler / LLVM Engineer · Optimization & Program Analysis',
              'role': 'Compiler / LLVM Engineer · Optimization & Program Analysis',
              'brand': 'LLVM · IR transforms · interprocedural analysis · static analysis',
              'eyebrow': 'LLVM 22 · CFG/SSA · legality · Roslyn',
              'summary': (
                  'Compiler / LLVM engineer with professional compiler and static-analysis work. '
                  'At MCST, I implemented LLVM 22 loop/interprocedural analyses and conservative legality checks for IR transformations; '
                  'at ISP RAS, I contribute to SharpChecker. Independent projects add fixed-point Roslyn CFG analysis, '
                  'x86-64 codegen/register allocation, and UniversalToolchain compiler infrastructure.'
              ),
              'description': 'Mikhail Razakov — Compiler / LLVM Engineer: LLVM 22, optimization passes, interprocedural analysis, legality, Roslyn data flow, and x86-64 codegen.',
              'proofs': [
                  ['LLVM transformations', 'LICM and global-IV passes: loop/dominator reasoning, APInt affine evolution, transitive call effects, legality, and conservative rejection.'],
                  ['Program analysis', 'SharpChecker at ISP RAS; an independent Roslyn CFG fixed-point analyzer with joins and successor reprocessing to convergence.'],
                  ['Infrastructure & backends', 'UniversalToolchain deterministic LanguagePlan/runtime split; SSA-like IR, register allocation, and differential x86-64 execution in a separate backend project.'],
              ],
              'experience': general_en['experience'],
              'project_ids': ['globaliv', 'wist', 'deref', 'codegen'],
              'skills': [
                  ['Compilers', 'C++23, LLVM 22, LLVM IR, optimization passes, interprocedural analysis, CFG/SSA, dominators, loop analysis, LICM, legality analysis'],
                  ['Static / Program Analysis', 'C#, .NET, Roslyn ControlFlowGraph, fixed-point data-flow analysis, state propagation and joins'],
                  ['Codegen', 'Rust, SysV x86-64, liveness/interference, register allocation, phi lowering, differential execution'],
                  ['Compiler Infrastructure', 'typed artifact contracts, deterministic planning/pass ordering, artifact routing, backend/runtime composition'],
              ],
              'contact_heading': 'Target roles: Compiler Engineer · LLVM Engineer · Compiler Optimization · Static / Program Analysis',
              'footer': 'Compiler / LLVM Engineer · Optimization & Program Analysis',
              'recognition': general_en['recognition'],
          })
          compiler_en.get('project_summaries', {}).pop('wist', None)

          wist = data['projects']['wist']
          wist.update({
              'type_ru': '.NET · compiler/language infrastructure · deterministic composition',
              'type_en': '.NET · compiler/language infrastructure · deterministic composition',
              'problem_ru': 'Независимо развиваемые language contributions должны собираться в один compiler/runtime pipeline без скрытой зависимости от registration order и без второго resolver в runtime.',
              'problem_en': 'Independently owned language contributions must compose into one compiler/runtime pipeline without hidden registration-order dependencies or a second resolver at runtime.',
              'solution_ru': 'Typed artifact contracts; dependencies/conflicts и capability/provider resolution; deterministic pass ordering и artifact routes компилируются в immutable LanguagePlan до исполнения.',
              'solution_en': 'Typed artifact contracts; dependency/conflict and capability/provider resolution; deterministic pass ordering and artifact routes compiled into an immutable LanguagePlan before execution.',
              'result_ru': 'LanguageRuntime валидирует и materialize-ит exact planned package/component graph без re-planning; контракт защищён plan-determinism/exact-binding checks, ownership guards и interpreter/CIL parity.',
              'result_en': 'LanguageRuntime validates and materializes the exact planned package/component graph without re-planning; plan-determinism/exact-binding checks, ownership guards, and interpreter/CIL parity protect the contract.',
          })

          for lang in ('ru', 'en'):
              rec = data['recognition'][lang]
              for item in rec:
                  if item[0] == '2026' and item[1].startswith("LangDev"):
                      if lang == 'ru':
                          item[:] = ['2026', 'LangDev’26 — Build the Language, Then Make the Abstractions Disappear', 'Доклад по архитектуре UniversalToolchain принят к выступлению на LangDev’26.']
                      else:
                          item[:] = ['2026', 'LangDev’26 — Build the Language, Then Make the Abstractions Disappear', 'Accepted talk on UniversalToolchain’s architecture at LangDev’26.']

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Remove deprecated generated sources and artifacts
        run: |
          rm -f data/cv-print-profiles.json tools/update_profiles_v33.py
          rm -f QA-report-targeted-cv-v*.md
          rm -f pdf/Mikhail_Razakov_DevTools_*.pdf
          rm -f pdf/Mikhail_Razakov_Algorithms_*.pdf
          rm -f pdf/Mikhail_Razakov_EdTech_*.pdf
          rm -f pdf/Mikhail_Razakov_Reliability_*.pdf
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Generate HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, links, and PDFs
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
      - name: Capture or verify visual baseline
        run: |
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update-if-missing
      - name: Build manifest and validate final tree
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current"
          else
            git commit -m "Rebuild generated CV site [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-rebuild-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn