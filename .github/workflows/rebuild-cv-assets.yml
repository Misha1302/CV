name: Rebuild generated CV artifacts

on:
  push:
    branches: [main, "refactor/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CV_EXTERNAL_REQUIRE_LIVE: "1"
      SOURCE_DATE_EPOCH: "1785715200"
    steps:
      - uses: actions/checkout@v4
      - name: Apply authoritative source bundle
        run: |
          test -f .cv-source-bundle.tar.gz
          tar -xzf .cv-source-bundle.tar.gz
          rm -f .cv-source-bundle.tar.gz .cv-rebuild-pending
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cv.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cv.txt
          python -m playwright install --with-deps chromium
      - name: Generate canonical HTML, ATS and PDFs
        run: |
          rm -rf tools/__pycache__
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content, PDFs and live external links
        run: python tools/validate_cv.py --pdf-dir pdf --check-external --skip-manifest --report /tmp/cv-validation.json
      - name: Verify browser, no-JS, reflow and print surfaces
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual --report /tmp/cv-visual-report.json
      - name: Build and validate full-tree manifest
        run: |
          rm -rf tools/__pycache__
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf --report /tmp/cv-final-validation.json
      - name: Commit verified generated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Rebuild generated CV artifacts"
          git push
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cv-bootstrap-rebuild-${{ github.sha }}
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-final-validation.json
            /tmp/cv-visual-report.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
