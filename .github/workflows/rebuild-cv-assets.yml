name: Rebuild targeted CV assets

on:
  push:
    branches: [main]
    paths:
      - "script.js"
      - "index.html"
      - "data/cv-print-profiles.json"
      - "tools/update_profiles_v33.py"
      - "tools/build_cv.py"
      - "tools/validate_cv.py"
      - ".github/workflows/rebuild-cv-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-targeted-cv-assets
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply deterministic profile migration
        run: python tools/update_profiles_v33.py
      - name: Rebuild print blocks and PDFs
        run: |
          python tools/build_cv.py --write-html
          python tools/build_cv.py --render-dir pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
      - name: Validate rebuilt HTML and PDFs
        run: |
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest
      - name: Regenerate recursive manifest
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          from pathlib import Path

          root = Path('.').resolve()
          manifest = root / 'MANIFEST.sha256'
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == manifest or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  ./{path.relative_to(root).as_posix()}")
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Validate final repository state
        run: python tools/validate_cv.py --pdf-dir pdf
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv-print-profiles.json *.html pdf MANIFEST.sha256
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Rebuild targeted CV PDFs [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-targeted-cv-evidence
          path: |
            /tmp/cv-report.json
            /tmp/cv-render
          if-no-files-found: warn
