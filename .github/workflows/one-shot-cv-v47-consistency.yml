name: One-shot CV v47 consistency release
# Expanded after repository-wide rendered evidence review.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-cv-v47-consistency.yml"

permissions:
  contents: write
  pages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply evidence consistency cleanup
        run: python tools/apply_cv_v47_consistency.py
      - name: Rebuild HTML and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-v47-pdf --report /tmp/cv-v47-pdf.json
      - name: Validate content
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-v47-validation.json
          python tools/build_site.py --check
          if grep -R -E -i --include='*.html' 'LangDev|1-е из 49|1-е место (из|среди) 49|#1 of 49|1st of 49|104/104|1[ ,]465/1[ ,]465' .; then
            echo 'Found stale public evidence wording' >&2
            exit 1
          fi
          git diff --check
      - name: Visual review gate
        run: python tools/visual_regression.py --output-dir /tmp/cv-v47-visual --update
      - name: Finalize tree
        run: |
          rm -f tools/apply_cv_v47_consistency.py .github/workflows/one-shot-cv-v47-consistency.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit final CV consistency release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden targeted CV evidence consistency"
          git push
      - name: Refresh GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = "legacy" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header "X-GitHub-Api-Version: 2022-11-28"
          else
            echo "GitHub Pages build type is '$build_type'; no legacy build request needed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-v47-evidence
          path: |
            /tmp/cv-v47-pdf.json
            /tmp/cv-v47-validation.json
            /tmp/cv-v47-pdf
            /tmp/cv-v47-visual
          if-no-files-found: warn
