            .pcv-roomy .pcv-side section + section { margin-top: 5.3mm; }
            .pcv-roomy .pcv-section-title { margin-bottom: 2.6mm; font-size: 12pt; }
            .pcv-roomy .pcv-entry { padding: 2.8mm 0 3.5mm; }
            .pcv-roomy .pcv-date { font-size: 8.85pt; }
            .pcv-roomy .pcv-entry h3,
