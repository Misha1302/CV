          }

          data["profiles"]["general"]["en"] = {
              "filename": "en.html",
              "pdf": "Mikhail_Razakov_Software_Engineer_EN.pdf",
              "title": "Mikhail Razakov — Software Engineer — Architecture & Platforms",
              "role": "Software Engineer — Architecture & Platforms",
              "brand": "architecture · .NET platforms · compiler/runtime",
              "eyebrow": "Ownership · typed contracts · reliability · compilers",
              "summary": "I design extensible platforms, compiler/runtime systems, and backend services where correctness depends on explicit ownership boundaries. I turn implicit dependencies and state assumptions into typed contracts, deterministic plans, and mechanically checked invariants.",
              "description": "Software Engineer Mikhail Razakov: platform architecture, typed contracts, state/recovery, compiler/runtime systems, LLVM, and mechanically checked engineering invariants.",
