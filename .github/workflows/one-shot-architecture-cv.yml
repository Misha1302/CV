- UniversalToolchain public boundary: typed .NET language/runtime platform with explicit package/contribution planning, exact runtime binding, and experimental non-packable PlanFuzz research tooling.
- SSA boundary: optional verifier-gated AIR → SSA → AIR routes; no universal SSA coverage or performance-superiority claim.
- Baltic award RU: Диплом I степени и Главная премия «Совершенство как надежда» Балтийского научно-инженерного конкурса 2026.
- Baltic award EN: First-degree diploma and the Grand Prize “Perfection as Hope” at the 2026 Baltic Science and Engineering Competition.
- MEPhI Junior 2026: First-degree diploma, 96/100 for UniversalToolchain (49 project + 47 written part).
"""
          Path("FACT-RETENTION.md").write_text(facts, encoding="utf-8")

          targeting = """# Targeting guide — v44

## Primary default

1. `Software Engineer — Architecture & Platforms` — default RU/EN profile for hands-on platform architecture, backend state/recovery, compiler/runtime systems, and correctness-oriented engineering.

## Strong specialized alternatives

1. `Compiler / Language Platforms` — compiler/runtime, language SDK, IR/SSA and compiler-infrastructure roles.
2. `.NET Backend` — backend roles where payment state, idempotency, recovery and operations are more important than compiler depth.
3. `C++ / LLVM Systems` — C++ systems, program analysis, low-level and compiler-backend roles.
4. `Quantitative Research / Research Software Engineering` — only where algorithms, experimentation and research tooling are central.

The default profile intentionally does not use `Software Architect`, `Staff`, or `Principal` as a title. Its purpose is to get architecture-heavy engineering interviews without implying multi-team or enterprise architecture seniority that the current evidence does not establish.
"""
          Path("TARGETING.md").write_text(targeting, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = "1. General Software Engineer\n2. Compiler / Language Platforms"
          new = "1. Software Engineer — Architecture & Platforms\n2. Compiler / Language Platforms"
          if readme.count(old) != 1:
              raise SystemExit("README canonical profile list no longer matches expected baseline")
          readme = readme.replace(old, new, 1)
          old = "The landing page exposes the four specializations plus the general profile."
          new = "The landing page exposes the four specializations plus the architecture-first default profile."
          if readme.count(old) != 1:
              raise SystemExit("README landing-page wording no longer matches expected baseline")
          readme_path.write_text(readme.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Rebuild site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content and layout
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --check-external --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/build_site.py --check
          git diff --check
      - name: Remove one-shot workflow, build manifest, validate final tree
        run: |
          rm -f .github/workflows/one-shot-architecture-cv.yml
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refocus general CV on architecture and platforms"
          git push
      - name: Refresh GitHub Pages when branch-built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = "legacy" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header "X-GitHub-Api-Version: 2022-11-28"
          else
            echo "GitHub Pages build type is '$build_type'; no legacy build request needed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-cv-release-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
