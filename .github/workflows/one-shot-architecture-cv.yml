name: One-shot architecture-first CV release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-architecture-cv.yml"

permissions:
  contents: write
  pages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply reviewed canonical content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site_path = Path("data/site.json")
          data = json.loads(site_path.read_text(encoding="utf-8"))
          if data.get("version") != 43:
              raise SystemExit(f"Expected source version 43, got {data.get('version')!r}")

          data["version"] = 44
          data["updated_at"] = "2026-08-25"
          data["profile_ui"]["general"] = {
              "label_ru": "Architecture / Platforms",
              "label_en": "Architecture / Platforms",
              "landing_title": "Software Architecture / Platforms",
              "landing_description_ru": "Ownership boundaries, typed contracts, state/recovery и compiler/runtime systems.",
          }

          data["profiles"]["general"]["ru"] = {
              "filename": "ru.html",
              "pdf": "Mikhail_Razakov_Software_Engineer_RU.pdf",
              "title": "Михаил Разаков — Software Engineer — Architecture & Platforms",
