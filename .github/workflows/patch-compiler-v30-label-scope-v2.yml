name: Patch compiler v30 label validation scope v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/compiler-cv-v30-final-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Scope mixed-language label checks correctly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          for name in ('tools/harden_compiler_cv_v30.py', '.github/workflows/compiler-v30-hardening.yml'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              text, c1 = re.subn(r'^\s*["\']<strong>Compiler / IR</strong>["\'],\s*\n', '', text, count=1, flags=re.MULTILINE)
              text, c2 = re.subn(r'^\s*["\']<strong>Low-level</strong>["\'],\s*\n', '', text, count=1, flags=re.MULTILINE)
              if c1 != 1 or c2 != 1:
                  raise RuntimeError(f'{name}: expected label checks not found: Compiler/IR={c1}, Low-level={c2}')
              if text == original:
                  raise RuntimeError(f'{name}: no changes applied')
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/compiler-v30-source-diagnostic.yml
          rm -f .github/workflows/patch-compiler-v30-label-scope.yml
          rm -f .github/workflows/patch-compiler-v30-label-scope-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scope compiler label checks to Russian output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
