name: Validate CV bootstrap

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm mandatory rebuild handoff
        run: |
          test -f .cv-rebuild-pending
          test -f .cv-source-bundle.tar.gz
          echo "PASS — source-only bootstrap is delegated to Rebuild generated CV artifacts"
