name: Validate CV source

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-cv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Generate site from canonical source
        run: python tools/build_site.py
      - name: Clean PDF rebuild
        run: python tools/build_cv.py --output-dir /tmp/cv-pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate canonical source and generated output
        run: |
          python tools/validate_cv.py \
            --pdf-dir /tmp/cv-pdf \
            --skip-manifest \
            --check-external \
            --report /tmp/cv-validation.json
      - name: "Visual regression: desktop, mobile, and no-JS"
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual
      - name: Ensure generators are deterministic
        run: python tools/build_site.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-validation-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
