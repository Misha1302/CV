name: Finalize and validate Russian compiler CV

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ru-cv-readability-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Refine wording and restore unrelated PDFs
        run: |
          git fetch origin main
          python - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          data_path = Path('data/cv-print-profiles.json')
          data = json.loads(data_path.read_text(encoding='utf-8'))
          target_pdf = 'Mikhail_Razakov_Compiler_RU.pdf'
          for profile in data['profiles'].values():
              pdf = profile['pdf']
              if pdf != target_pdf:
                  subprocess.run(['git', 'checkout', 'origin/main', '--', f'pdf/{pdf}'], check=True)

          html_path = Path('ru-compiler.html')
          text = html_path.read_text(encoding='utf-8')
          replacements = {
              'межпакетные маршруты, детерминированные проходы и точный исполнитель': 'межпакетные маршруты, детерминированные проходы и однозначный выбор исполнителя',
              'побочные эффекты, детерминизм, доверие и проверяемый цикл AIR → SSA → AIR': 'побочные эффекты, детерминизм, доверие и проверяемое преобразование AIR → SSA → AIR',
              '0 падений; контрольная проверка 9 пакетов и чистых проектов-потребителей': '0 падений; проверены 9 пакетов и проекты, подключающие SDK с нуля',
              'SDK для создания языков и среда исполнения с манифестами': 'SDK для создания языков и среда исполнения на основе манифестов',
              'планы композиции · Callable-first SSA · PlanFuzz · интерпретатор/CIL': 'планы композиции · SSA с семантикой вызовов · PlanFuzz · интерпретатор/CIL',
              'lock-файл schema-v5': 'lock-файл схемы v5',
              'проверены 9 пакетов и чистые проекты-потребители': 'проверены 9 пакетов и проекты, подключающие SDK с нуля',
              'Rust · бэкенд x86-64': 'Rust · генерация кода x86-64',
              'SSA-подобное IR, анализ живых интервалов': 'SSA-подобное промежуточное представление, анализ живых интервалов',
              'Типизированные артефакты, графы вкладов, возможности и конфликты': 'Типизированные артефакты, графы компонентов, возможности и конфликты',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'missing both source and target HTML phrases: {old!r}')
          html_path.write_text(text, encoding='utf-8')

          profile = data['profiles']['ru-compiler.html']
          profile['proofs'] = [
              ['Планы типизированной композиции', 'маршруты, проходы, возможности и выбор исполнителя'],
              ['SSA с семантикой вызовов', 'эффекты, детерминизм и проверяемое преобразование'],
              ['1 465 / 1 465', '0 падений; 9 пакетов и проекты с чистого листа'],
          ]
          profile['experience'][0][2][0] = 'Типизированный SDK: независимые пакеты, маршруты, проходы и lock-файл v5.'
          profile['projects'][2][1] = 'SSA-подобное IR, живые интервалы, линейное сканирование, iced-x86 и дифференциальная проверка.'
          profile['skills'][0][1] = 'артефакты, графы компонентов, маршруты, проходы, манифесты'
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Regenerate print source and affected PDF
        run: |
          python tools/build_cv.py --write-html
          rm -rf /tmp/cv-pdf /tmp/cv-render
          python tools/build_cv.py --render-dir /tmp/cv-pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
          cp /tmp/cv-pdf/Mikhail_Razakov_Compiler_RU.pdf pdf/Mikhail_Razakov_Compiler_RU.pdf
      - name: Restore canonical workflow and rebuild manifest
        run: |
          rm -f .github/workflows/finalize-ru-cv-branch.yml
          git checkout origin/main -- .github/workflows/validate-cv.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Validate final branch
        run: |
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir /tmp/cv-pdf --compare-dir pdf --skip-manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit final branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Russian compiler CV readability'
          git push origin HEAD:chore/ru-cv-readability-2026-07-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russian-cv-readability-evidence
          path: |
            /tmp/cv-report.json
            /tmp/cv-render/Mikhail_Razakov_Compiler_RU.png
          if-no-files-found: warn
