name: Diagnose and execute MCST CV repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcst-internship-facts-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install executor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Run repair with captured diagnostics
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/validate-cv.yml').read_text(encoding='utf-8'))
          selected = [
              'Correct internship facts in all CV variants',
              'Add regression checks for the internship facts',
              'Rebuild all print blocks and PDFs',
          ]
          by_name = {step.get('name'): step for step in workflow['jobs']['repair']['steps']}
          logs = []

          def run(name: str, script: str) -> None:
              result = subprocess.run(script, shell=True, executable='/bin/bash', text=True, capture_output=True)
              logs.append(f'===== {name} =====\nexit={result.returncode}\n--- stdout ---\n{result.stdout}\n--- stderr ---\n{result.stderr}\n')
              if result.returncode != 0:
                  subprocess.run(['git', 'reset', '--hard', 'HEAD'], check=True)
                  Path('MCST_FIX_FAILURE.log').write_text('\n'.join(logs), encoding='utf-8')
                  subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
                  subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
                  subprocess.run(['git', 'add', 'MCST_FIX_FAILURE.log'], check=True)
                  subprocess.run(['git', 'commit', '-m', 'Record MCST CV repair failure diagnostics'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'HEAD:fix/mcst-internship-facts-2026-07-25'], check=True)
                  raise SystemExit(result.returncode)

          for name in selected:
              run(name, by_name[name]['run'])

          final_script = r'''
          git checkout 6abd55d6ecfcff8d489b4986fe4aa29c9185194d -- .github/workflows/validate-cv.yml
          python - <<'PY2'
          import hashlib
          from pathlib import Path
          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'MANIFEST.sha256' and '.git' not in path.parts:
                  lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY2
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir /tmp/cv-pdf --compare-dir pdf --skip-manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
          '''
          run('Restore canonical workflow, rebuild manifest, and validate', final_script)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Correct MCST internship dates and LLVM work'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:fix/mcst-internship-facts-2026-07-25'], check=True)
          PY
      - name: Restore clean main
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git checkout 6abd55d6ecfcff8d489b4986fe4aa29c9185194d -- .github/workflows/validate-cv.yml
          rm -f .github/workflows/dispatch-mcst-cv-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove MCST CV repair dispatcher' || exit 0
          git push origin main
