name: Repair MCST internship facts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcst-internship-facts-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Correct internship facts in all CV variants
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from bs4 import BeautifulSoup

          root = Path('.')
          data_path = root / 'data' / 'cv-print-profiles.json'
          data = json.loads(data_path.read_text(encoding='utf-8'))
          targets = list(data['profiles']) + ['ru.html', 'en.html']

          ru_date = '1 июля — 31 августа 2026'
          en_date = 'July 1 — August 31, 2026'
          ru_title = 'МЦСТ — стажёр по разработке компиляторов'
          en_title = 'MCST — Compiler Engineering Intern'
          ru_org = 'LLVM-направление · 0,25 ставки · удалённо'
          en_org = 'LLVM track · 0.25 FTE · remote'
          ru_detail = 'Изучаю алгоритмы на графах и устройство компиляторов; разрабатываю собственный оптимизационный проход для LLVM.'
          en_detail = 'Studying graph algorithms and compiler construction; developing an LLVM optimization pass.'
          ru_bullets = [
              'Стажировка на 0,25 ставки: изучаю алгоритмы на графах, устройство компиляторов и LLVM.',
              'Разрабатываю собственный оптимизационный проход LLVM; реализую и тестирую графовые алгоритмы на C++23.',
          ]
          en_bullets = [
              '0.25 FTE internship: studying graph algorithms, compiler construction, and LLVM.',
              'Developing an LLVM optimization pass; implementing and testing graph algorithms in C++23.',
          ]

          def set_text(tag, value: str) -> None:
              tag.clear()
              tag.append(value)

          def replace_role_article(soup: BeautifulSoup, article, ru: bool) -> None:
              article.clear()
              time = soup.new_tag('time')
              time['datetime'] = '2026-07-01'
              time.string = ru_date if ru else en_date
              article.append(time)

              div = soup.new_tag('div')
              h3 = soup.new_tag('h3')
              h3.string = ru_title if ru else en_title
              org = soup.new_tag('p')
              org['class'] = ['org']
              org.string = ru_org if ru else en_org
              div.append(h3)
              div.append(org)
              article.append(div)

              details = soup.new_tag('p')
              details['class'] = ['details']
              details.string = ru_detail if ru else en_detail
              article.append(details)

          def replace_experience(article, soup: BeautifulSoup, ru: bool) -> None:
              time = article.find('time')
              if time is not None:
                  time.attrs.clear()
                  set_text(time, ru_date if ru else en_date)
              h3 = article.find('h3')
              if h3 is not None:
                  set_text(h3, ru_title if ru else en_title)
              org = article.find('p', class_='org')
              if org is not None:
                  set_text(org, ru_org if ru else en_org)
              details = article.find('p', class_='details')
              if details is not None:
                  details.decompose()
              ul = article.find('ul', class_='timeline-details')
              if ul is None:
                  ul = soup.new_tag('ul')
                  ul['class'] = ['timeline-details']
                  article.append(ul)
              ul.clear()
              for bullet in (ru_bullets if ru else en_bullets):
                  li = soup.new_tag('li')
                  li.string = bullet
                  ul.append(li)

          for filename in targets:
              path = root / filename
              soup = BeautifulSoup(path.read_text(encoding='utf-8'), 'html.parser')
              ru = filename.startswith('ru')

              education = soup.select_one('#education')
              if education is not None:
                  heading = education.select_one('.section-heading h2')
                  if heading is not None:
                      set_text(heading, 'Образование и текущая занятость.' if ru else 'Education and current role.')
                  role_article = None
                  for article in education.find_all('article'):
                      content = article.get_text(' ', strip=True)
                      if (
                          'Стажировка или неполная занятость' in content
                          or 'Internship or part-time role' in content
                          or 'С сентября 2026' in content
                          or 'From September 2026' in content
                      ):
                          role_article = article
                          break
                  if role_article is None:
                      raise RuntimeError(f'{filename}: current-role article not found')
                  replace_role_article(soup, role_article, ru)

              experience = soup.select_one('#experience')
              found_mcst = False
              if experience is not None:
                  for article in experience.find_all('article'):
                      heading = article.find('h3')
                      heading_text = heading.get_text(' ', strip=True) if heading else ''
                      if 'МЦСТ' in heading_text or 'MCST' in heading_text:
                          replace_experience(article, soup, ru)
                          found_mcst = True
                          break
              if not found_mcst:
                  raise RuntimeError(f'{filename}: MCST experience article not found')

              for span in soup.select('.hero-context span'):
                  current = span.get_text(' ', strip=True)
                  if ('МЦСТ' in current and ('июль' in current.lower() or 'август' in current.lower())):
                      set_text(span, 'МЦСТ · 1 июля–31 августа 2026 · 0,25 ставки')
                  elif ('MCST' in current and ('july' in current.lower() or 'august' in current.lower())):
                      set_text(span, 'MCST · July 1–August 31, 2026 · 0.25 FTE')

              for item in soup.select('.career-item'):
                  strong = item.find('strong')
                  if strong is None:
                      continue
                  label = strong.get_text(' ', strip=True)
                  if label in {'МЦСТ', 'MCST'}:
                      detail = item.find('span')
                      if detail is not None:
                          set_text(detail, 'LLVM · оптимизационный проход · графовые алгоритмы' if ru else 'LLVM · optimization pass · graph algorithms')

              contact_heading = soup.select_one('#contact h2')
              if contact_heading is not None:
                  current = contact_heading.get_text(' ', strip=True)
                  if ru and ('Ищу стажировку' in current or 'стажировку или работу' in current):
                      set_text(contact_heading, 'С сентября 2026 открыт к работе с неполной занятостью в LLVM, разработке компиляторов и анализе программ.')
                  elif not ru and ('internship' in current.lower() or 'part-time role' in current.lower()):
                      set_text(contact_heading, 'Available for part-time LLVM, compiler, or program-analysis work from September 2026.')

              path.write_text(str(soup), encoding='utf-8')

          for filename, profile in data['profiles'].items():
              ru = profile.get('lang') == 'ru'
              mcst = None
              for entry in profile['experience']:
                  if 'МЦСТ' in entry[1] or 'MCST' in entry[1]:
                      mcst = entry
                      break
              if mcst is None:
                  raise RuntimeError(f'{filename}: MCST print experience missing')
              if ru:
                  mcst[:] = [
                      ru_date,
                      'МЦСТ · LLVM · 0,25 ставки',
                      [
                          '0,25 ставки: алгоритмы на графах, устройство компиляторов и LLVM.',
                          'Разрабатываю собственный оптимизационный проход LLVM; реализую графовые алгоритмы на C++23.',
                      ],
                  ]
              else:
                  mcst[:] = [
                      en_date,
                      'MCST · LLVM · 0.25 FTE',
                      [
                          '0.25 FTE: graph algorithms, compiler construction, and LLVM.',
                          'Developing an LLVM optimization pass; implementing graph algorithms in C++23.',
                      ],
                  ]
              for index, marker in enumerate(profile.get('ats_order', [])):
                  if 'МЦСТ' in marker or 'MCST' in marker:
                      profile['ats_order'][index] = mcst[1]

          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Add regression checks for the internship facts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/validate_cv.py')
          text = path.read_text(encoding='utf-8')

          data_anchor = "    for filename in ['ru-devtools.html', 'en-devtools.html']:\n"
          data_check = '''    for filename, profile in DATA['profiles'].items():
        ru = profile.get('lang') == 'ru'
        mcst = next((entry for entry in profile['experience'] if 'МЦСТ' in entry[1] or 'MCST' in entry[1]), None)
        if mcst is None:
            raise RuntimeError(f'{filename}: missing MCST internship')
        joined = ' '.join([mcst[0], mcst[1], *mcst[2]])
        required = ['1 июля — 31 августа 2026', '0,25 ставки', 'оптимизационный проход LLVM'] if ru else ['July 1 — August 31, 2026', '0.25 FTE', 'LLVM optimization pass']
        for marker in required:
            if marker.casefold() not in joined.casefold():
                raise RuntimeError(f'{filename}: incomplete MCST fact {marker!r}')
'''
          if data_check not in text:
              if data_anchor not in text:
                  raise RuntimeError('validate_data insertion anchor missing')
              text = text.replace(data_anchor, data_check + data_anchor)

          html_anchor = "    compiler = (ROOT / 'ru-compiler.html').read_text(encoding='utf-8')\n"
          html_check = '''    for filename in TARGET + ['ru.html', 'en.html']:
        page = (ROOT / filename).read_text(encoding='utf-8')
        required = ['1 июля — 31 августа 2026', '0,25 ставки', 'оптимизационный проход'] if filename.startswith('ru') else ['July 1 — August 31, 2026', '0.25 FTE', 'optimization pass']
        for marker in required:
            if marker.casefold() not in page.casefold():
                raise RuntimeError(f'{filename}: missing current MCST fact {marker!r}')
'''
          if html_check not in text:
              if html_anchor not in text:
                  raise RuntimeError('validate_html insertion anchor missing')
              text = text.replace(html_anchor, html_check + html_anchor)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Rebuild all print blocks and PDFs
        run: |
          python tools/build_cv.py --write-html
          rm -rf /tmp/cv-pdf /tmp/cv-render
          python tools/build_cv.py --render-dir /tmp/cv-pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
          cp /tmp/cv-pdf/*.pdf pdf/
      - name: Restore canonical workflow and rebuild manifest
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/validate-cv.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Validate clean final state
        run: |
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir /tmp/cv-pdf --compare-dir pdf --skip-manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit corrected CVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct MCST internship dates and LLVM work'
          git push origin HEAD:fix/mcst-internship-facts-2026-07-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcst-internship-cv-evidence
          path: |
            /tmp/cv-report.json
            /tmp/cv-render
          if-no-files-found: warn
