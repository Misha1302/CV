name: Add visible PlanFuzz links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planfuzz-links-2026-07-26
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf
      - name: Apply PlanFuzz link patch
        run: python tools/add_planfuzz_links.py
      - name: Validate focused result
        run: |
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir pdf
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          expected = "https://github.com/Misha1302/Wist2/blob/main/internal-docs/proposals/planfuzz/README.md"
          for filename in ("ru-compiler.html", "en-compiler.html", "ru-devtools.html", "en-devtools.html"):
              soup = BeautifulSoup(Path(filename).read_text(encoding="utf-8"), "html.parser")
              card = next(article for article in soup.select("article.project-card") if article.find("h3") and article.find("h3").get_text(" ", strip=True) == "PlanFuzz")
              link = card.select_one(f'a[href="{expected}"]')
              assert link is not None and link.get_text(" ", strip=True)
          PY
          git diff --check
      - name: Commit corrected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add visible PlanFuzz project links'
          git push origin HEAD:fix/planfuzz-links-2026-07-26
      - name: Restore canonical validation workflow
        if: always()
        run: |
          git fetch origin main fix/planfuzz-links-2026-07-26
          git checkout -B main origin/main
          git checkout origin/fix/planfuzz-links-2026-07-26 -- .github/workflows/validate-cv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-cv.yml
          git commit -m 'chore: restore CV validation workflow' || exit 0
          git push origin main
