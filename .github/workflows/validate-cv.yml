name: Validate CV site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Verify generated HTML is current
        run: |
          python tools/build_site.py
          python tools/build_compiler_redesign.py
          git diff --exit-code
      - name: Clean PDF rebuild
        run: python tools/build_cv.py --output-dir /tmp/cv-pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate source, metadata, languages, links, and PDFs
        run: |
          python tools/validate_cv.py \
            --pdf-dir /tmp/cv-pdf \
            --check-external \
            --report /tmp/cv-validation.json
      - name: Visual regression: desktop, mobile, and no-JS
        run: python tools/visual_regression.py --output-dir /tmp/cv-visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-validation-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
