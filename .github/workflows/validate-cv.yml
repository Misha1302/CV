name: Finalize visible PlanFuzz links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planfuzz-links-2026-07-26
          fetch-depth: 0
      - name: Apply and verify links
        run: |
          python3 tools/add_planfuzz_links.py
          python3 - <<'PY'
          import re
          from pathlib import Path

          expected = "https://github.com/Misha1302/Wist2/blob/main/internal-docs/proposals/planfuzz/README.md"
          patterns = {
              "ru-compiler.html": r'<article class="project-card">(?:(?!</article>).)*?<h3>PlanFuzz</h3>(?:(?!</article>).)*?</article>',
              "en-compiler.html": r'<article class="project-card">(?:(?!</article>).)*?<h3>PlanFuzz</h3>(?:(?!</article>).)*?</article>',
              "ru-devtools.html": r'<article class="project-featured">(?:(?!</article>).)*?<h3>PlanFuzz</h3>(?:(?!</article>).)*?</article>',
              "en-devtools.html": r'<article class="project-featured">(?:(?!</article>).)*?<h3>PlanFuzz</h3>(?:(?!</article>).)*?</article>',
          }
          for filename, pattern in patterns.items():
              source = Path(filename).read_text(encoding="utf-8")
              match = re.search(pattern, source, re.DOTALL)
              assert match is not None, filename
              assert expected in match.group(0), filename
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete visible PlanFuzz links'
          git push origin HEAD:fix/planfuzz-links-2026-07-26
      - name: Restore canonical validation workflow
        if: always()
        run: |
          git fetch origin main fix/planfuzz-links-2026-07-26
          git checkout -B main origin/main
          git checkout origin/fix/planfuzz-links-2026-07-26 -- .github/workflows/validate-cv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-cv.yml
          git commit -m 'chore: restore CV validation workflow' || exit 0
          git push origin main
