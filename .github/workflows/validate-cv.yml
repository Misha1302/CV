name: Execute MCST internship CV correction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcst-internship-facts-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply factual correction
        run: python tools/fix_mcst_internship_facts.py
      - name: Rebuild HTML and PDFs
        run: |
          python tools/build_cv.py --write-html
          rm -rf /tmp/cv-pdf /tmp/cv-render
          python tools/build_cv.py --render-dir /tmp/cv-pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
          cp /tmp/cv-pdf/*.pdf pdf/
      - name: Remove migrator and restore canonical workflow
        run: |
          rm tools/fix_mcst_internship_facts.py
          git checkout 6abd55d6ecfcff8d489b4986fe4aa29c9185194d -- .github/workflows/validate-cv.yml
      - name: Rebuild manifest and validate
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir /tmp/cv-pdf --compare-dir pdf --skip-manifest
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit corrected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct MCST internship dates and LLVM work'
          git push origin HEAD:fix/mcst-internship-facts-2026-07-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcst-internship-cv-evidence
          path: |
            /tmp/cv-report.json
            /tmp/cv-render
          if-no-files-found: warn
      - name: Restore clean main
        if: always()
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git checkout 6abd55d6ecfcff8d489b4986fe4aa29c9185194d -- .github/workflows/validate-cv.yml
          rm -f .github/workflows/dispatch-mcst-cv-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove MCST CV correction dispatcher' || exit 0
          git push origin main
