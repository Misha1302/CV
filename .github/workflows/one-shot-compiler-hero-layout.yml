name: One-shot compiler hero layout fix
# Triggered after workflow registration.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-compiler-hero-layout.yml"

permissions:
  contents: write
  pages: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf pillow playwright weasyprint
          python -m playwright install --with-deps chromium
      - name: Apply canonical source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("data/site.json", '  "version": 42,', '  "version": 43,')

          replace_once(
              "style.css",
              "  grid-template-columns: minmax(0, 1fr) 220px;",
              "  grid-template-columns: minmax(0, 1fr) 230px;",
          )
          replace_once("style.css", "  padding: 64px 0 46px;", "  padding: 52px 0 30px;")
          replace_once(
              "style.css",
              ".profile-compiler .compact-portrait { display: block; margin: 22px 0 0; padding: 0; overflow: hidden; border: 1px solid #4c3037; border-radius: 14px; background: #130f10; }",
              ".profile-compiler .compact-aside { display: grid; gap: 14px; margin-top: 18px; align-self: start; }\n.profile-compiler .compact-portrait { display: block; margin: 0; padding: 0; overflow: hidden; border: 1px solid #4c3037; border-radius: 14px; background: #130f10; }",
          )
          replace_once(
              "style.css",
              ".profile-compiler .compact-portrait .identity-mark { width: 100%; aspect-ratio: 1 / 1; height: auto; border: 0; border-radius: 0; object-fit: cover; object-position: 50% 35%; transform: scale(1.12); transform-origin: 50% 35%; }",
              ".profile-compiler .compact-portrait .identity-mark { width: 100%; aspect-ratio: 1 / 1; height: auto; border: 0; border-radius: 0; object-fit: cover; object-position: 50% 35%; transform: scale(1.12); transform-origin: 50% 35%; }\n.profile-compiler .compact-proof-list { border-top: 1px solid var(--border); }\n.profile-compiler .compact-proof { padding: 10px 0 11px; border-bottom: 1px solid var(--border); }\n.profile-compiler .compact-proof strong { display: block; color: var(--text); font-size: 13px; line-height: 1.25; }\n.profile-compiler .compact-proof span { display: block; margin-top: 4px; color: var(--quiet); font-size: 11px; line-height: 1.35; }",
          )
          replace_once(
              "style.css",
              ".profile-compiler .hero-compact .hero-summary { font-size: 16px; line-height: 1.6; }",
              ".profile-compiler .hero-compact .hero-summary { font-size: 16px; line-height: 1.6; }\n@media (min-width: 761px) { .profile-compiler .hero-compact + .section { padding-top: 30px; } }",
          )
          replace_once(
              "style.css",
              "  .profile-compiler .hero-compact { grid-template-columns: 1fr; gap: 24px; padding: 44px 0 38px; }\n  .profile-compiler .compact-portrait { width: 132px; margin-top: 0; }",
              "  .profile-compiler .hero-compact { grid-template-columns: 1fr; gap: 24px; padding: 44px 0 38px; }\n  .profile-compiler .compact-aside { margin-top: 0; }\n  .profile-compiler .compact-portrait { width: 132px; margin-top: 0; }\n  .profile-compiler .compact-proof-list { display: none; }",
          )

          replace_once(
              "tools/build_site.py",
              "    if compact:\n        return f\"\"\"",
              "    if compact:\n        compact_proofs = \"\".join(\n            f'<div class=\"compact-proof\"><strong>{esc(title)}</strong><span>{esc(body)}</span></div>'\n            for title, body in profile[\"proofs\"]\n        )\n        return f\"\"\"",
          )
          replace_once(
              "tools/build_site.py",
              "  <aside class=\"identity-card compact-portrait\" aria-label=\"{'Профиль' if lang == 'ru' else 'Profile'}\"><img class=\"identity-mark\" src=\"{esc(profile.get('portrait_asset', 'assets/portrait.svg'))}\" data-local-photo=\"true\" alt=\"{esc(person_name(data, lang))}\" width=\"460\" height=\"460\"></aside>",
              "  <aside class=\"compact-aside\" aria-label=\"{'Профиль и ключевые факты' if lang == 'ru' else 'Profile and key evidence'}\">\n    <div class=\"identity-card compact-portrait\"><img class=\"identity-mark\" src=\"{esc(profile.get('portrait_asset', 'assets/portrait.svg'))}\" data-local-photo=\"true\" alt=\"{esc(person_name(data, lang))}\" width=\"460\" height=\"460\"></div>\n    <div class=\"compact-proof-list\">{compact_proofs}</div>\n  </aside>",
          )
          PY
      - name: Rebuild site and PDFs
        run: |
          python tools/build_site.py
          python tools/build_cv.py --output-dir pdf --evidence-dir /tmp/cv-pdf-evidence --report /tmp/cv-pdf-report.json
      - name: Validate content and layout
        run: |
          python tools/validate_cv.py --pdf-dir pdf --skip-manifest --report /tmp/cv-validation.json
          python tools/visual_regression.py --output-dir /tmp/cv-visual --update
          python tools/build_site.py --check
          git diff --check
      - name: Build manifest and validate final tree
        run: |
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          python tools/build_site.py --manifest
          python tools/validate_cv.py --pdf-dir pdf
      - name: Commit final result
        run: |
          rm -f .github/workflows/one-shot-compiler-hero-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compact compiler hero layout"
          git push
      - name: Refresh GitHub Pages when branch-built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type')"
          if [ "$build_type" = "legacy" ]; then
            gh api --method POST "repos/${{ github.repository }}/pages/builds" --header "X-GitHub-Api-Version: 2022-11-28"
          else
            echo "GitHub Pages build type is '$build_type'; no legacy build request needed."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-hero-layout-evidence
          path: |
            /tmp/cv-pdf-report.json
            /tmp/cv-validation.json
            /tmp/cv-pdf-evidence
            /tmp/cv-visual
          if-no-files-found: warn
