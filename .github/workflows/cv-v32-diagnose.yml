name: Diagnose CV v32 final polish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cv-v32-review-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
      - name: Apply candidate polish
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/cv-print-profiles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          p = data['profiles']
          for key in ['ru-devtools.html','en-devtools.html','ru-cpp-systems.html','en-cpp-systems.html']:
              p[key]['density']='spacious'; p[key]['min_fill']=0.82
          ru=p['ru-devtools.html']
          ru['summary']='Разработал экспериментальный PlanFuzz: нейтральное к языку ядро, адаптер Acme и ограниченный адаптер Wist для Int32, семь семейств оракулов, повторное выполнение в свежих процессах, точные отпечатки и детерминированное сокращение программ и планов.'
          ru['experience'][0][2]=['Нейтральное к языку ядро, адаптер Acme, ограниченный адаптер Wist для Int32 и структурные генераторы.','Строгая семантика исходов и доказательств, подтверждение в свежих процессах и детерминированные reducers.']
          ru['experience'][1][1]='Инструменты Wist'
          ru['experience'][1][2]=['Типизированные API, структурированные diagnostics, versioned traces и parity интерпретатора/CIL.','Canonical gate: 1 465/1 465 тестов, 9 packages, clean template и cross-package consumer smoke.']
          ru['skills'][0][0]='Тестирование'; ru['skills'][1][0]='Диагностика'; ru['skills'][2][0]='Релизная проверка'
          ru['ats_order']=['Михаил Разаков','Инженер по тестированию компиляторов и инструментам разработчика','ОПЫТ','Инструменты Wist','ИЗБРАННЫЕ ПРОЕКТЫ','PS-form Harness']
          ru=p['ru-compiler.html']
          ru['summary']='Разрабатываю UniversalToolchain/Wist2 — SDK для типизированной композиции языковых компонентов и runtime: межпакетные планы, точная привязка манифестов, callable-first SSA, публичный Wist facade и экспериментальный PlanFuzz.'
          ru['proofs'][0]=['Планы типизированной композиции','маршруты, проходы, capabilities и exact executor']
          ru['experience'][0][2]=['SDK для типизированной композиции независимых языковых пакетов: детерминированные маршруты, порядок проходов и schema-v5 lock identity.','Fail-closed политики runtime, точная привязка манифестов и lifecycle ownership.','Callable-first SSA: descriptor semantics, effects, determinism, trust и verifier-gated roundtrip.','Экспериментальный PlanFuzz: нейтральное к языку ядро, адаптер Acme, ограниченный адаптер Wist для Int32, 7 семейств оракулов, replay и reducers.']
          ru['projects'][0][1]='Экспериментальное дифференциальное тестирование с учётом конфигурации: нейтральное к языку ядро, адаптеры Acme и ограниченный Wist Int32, подтверждение в свежих процессах и детерминированное сокращение программы и плана.'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat >> style.css <<'CSS'
          @media print {
            .print-cv.pcv-spacious { padding: 10.2mm 10.5mm 9.2mm; font-size: 10.6pt; line-height: 1.38; }
            .pcv-spacious .pcv-header { padding-bottom: 3.6mm; }
            .pcv-spacious .pcv-header h1 { font-size: 28pt; }
            .pcv-spacious .pcv-header h2 { margin-top: 1.9mm; font-size: 14pt; }
            .pcv-spacious .pcv-contact { font-size: 9.8pt; line-height: 1.47; }
            .pcv-spacious .pcv-summary { margin: 4.7mm 0 4.2mm; font-size: 10.95pt; line-height: 1.43; }
            .pcv-spacious .pcv-proofs { gap: 3.3mm; margin-bottom: 5.2mm; }
            .pcv-spacious .pcv-proof { min-height: 22.8mm; padding: 3.7mm; }
            .pcv-spacious .pcv-proof strong { font-size: 12.2pt; }
            .pcv-spacious .pcv-proof span { margin-top: 1.6mm; font-size: 9.4pt; line-height: 1.31; }
            .pcv-spacious .pcv-columns { gap: 7.1mm; }
            .pcv-spacious .pcv-main section + section, .pcv-spacious .pcv-side section + section { margin-top: 5.5mm; }
            .pcv-spacious .pcv-section-title { margin-bottom: 2.8mm; font-size: 12.2pt; }
            .pcv-spacious .pcv-entry { padding: 3mm 0 3.7mm; }
            .pcv-spacious .pcv-date { font-size: 9pt; }
            .pcv-spacious .pcv-entry h3, .pcv-spacious .pcv-project h3 { font-size: 10.85pt; }
            .pcv-spacious .pcv-entry ul { margin-top: 1.8mm; }
            .pcv-spacious .pcv-entry li { margin-bottom: 1.2mm; font-size: 9.7pt; line-height: 1.34; }
            .pcv-spacious .pcv-project { padding: 2.9mm 0 3.3mm; }
            .pcv-spacious .pcv-project p { margin-top: 1.45mm; font-size: 9.7pt; line-height: 1.36; }
            .pcv-spacious .pcv-skill { padding: 2.25mm 0; }
            .pcv-spacious .pcv-skill strong { font-size: 9.85pt; }
            .pcv-spacious .pcv-skill span { font-size: 9.25pt; line-height: 1.34; }
            .pcv-spacious .pcv-compact p { font-size: 9.55pt; line-height: 1.4; }
          }
          CSS
      - name: Capture diagnostic steps
        continue-on-error: true
        run: |
          mkdir -p /tmp/cvdiag
          set +e
          python tools/build_cv.py --write-html > /tmp/cvdiag/01-write-html.log 2>&1
          echo $? > /tmp/cvdiag/01-write-html.status
          python tools/build_cv.py --render-dir /tmp/cvdiag/pdf --evidence-dir /tmp/cvdiag/render --report /tmp/cvdiag/report.json > /tmp/cvdiag/02-render.log 2>&1
          echo $? > /tmp/cvdiag/02-render.status
          python tools/validate_cv.py --pdf-dir /tmp/cvdiag/pdf --skip-manifest > /tmp/cvdiag/03-validate.log 2>&1
          echo $? > /tmp/cvdiag/03-validate.status
          cat /tmp/cvdiag/*.status
          tail -n 80 /tmp/cvdiag/02-render.log || true
          tail -n 80 /tmp/cvdiag/03-validate.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv-v32-diagnostic
          path: /tmp/cvdiag
          if-no-files-found: error
