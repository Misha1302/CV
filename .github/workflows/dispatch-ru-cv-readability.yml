name: Normalize Russian CV artifact diff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ru-cv-readability-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unrelated PDFs
        run: |
          git fetch origin main
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          data = json.loads(Path('data/cv-print-profiles.json').read_text(encoding='utf-8'))
          keep = 'Mikhail_Razakov_Compiler_RU.pdf'
          for profile in data['profiles'].values():
              pdf = profile['pdf']
              if pdf != keep:
                  subprocess.run(['git', 'checkout', 'origin/main', '--', f'pdf/{pdf}'], check=True)
          PY
      - name: Rebuild manifest and validate
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 pymupdf
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python tools/build_cv.py --check-html
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit normalized branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Limit Russian CV update to affected artifact'
          git push origin HEAD:chore/ru-cv-readability-2026-07-25
