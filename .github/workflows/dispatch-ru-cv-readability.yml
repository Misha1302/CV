name: Dispatch Russian CV readability rewrite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ru-cv-readability-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute rewrite payload from branch
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml beautifulsoup4 playwright pymupdf
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import subprocess
          import yaml
          from pathlib import Path

          workflow = yaml.safe_load(Path('.github/workflows/localize-ru-cv.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['rewrite']['steps']
          rewrite = next(step['run'] for step in steps if step.get('name') == 'Rewrite Russian flagship CV')
          subprocess.run(rewrite, shell=True, check=True, executable='/bin/bash')
          PY
          python tools/build_cv.py --write-html
          python tools/build_cv.py --check-html
          python tools/build_cv.py --render-dir pdf --evidence-dir /tmp/cv-render --report /tmp/cv-report.json
          rm .github/workflows/localize-ru-cv.yml
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('.')
          lines = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.sha256' or '.git' in path.parts:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path.as_posix()}')
          Path('MANIFEST.sha256').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python tools/validate_cv.py --pdf-dir pdf
          git diff --check
      - name: Commit result to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Simplify Russian compiler CV language'
          git push origin HEAD:chore/ru-cv-readability-2026-07-25
      - name: Remove temporary dispatcher from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/dispatch-ru-cv-readability.yml
          git add -A
          git commit -m 'chore: remove Russian CV readability dispatcher'
          git push origin main
