name: Patch CV v29 source normalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/cv-v29-consistency-readability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Cover mixed duplicate wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/harden_cv_v29.py')
          text = path.read_text(encoding='utf-8')
          old = """        'Disassembly and compiler-output analysis; differential testing, differential testing and isolated execution.',
                  'Disassembly and compiler-output analysis; differential testing, spill/code-size metrics and isolated execution.',
              )"""
          new = """        'Disassembly and compiler-output analysis; differential testing, differential testing and isolated execution.',
                  'Disassembly and compiler-output analysis; differential testing, spill/code-size metrics and isolated execution.',
              ).replace(
                  'differential tests, differential testing',
                  'differential tests, spill/code-size metrics',
              )"""
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif 'differential tests, spill/code-size metrics' not in text:
              raise RuntimeError('Expected EN normalization block not found')
          PY
          if git diff --quiet -- tools/harden_cv_v29.py; then
            echo 'Normalizer already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/harden_cv_v29.py
          git commit -m 'Cover mixed differential-testing wording in v29 normalizer'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
